<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>工具集合</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #f5f5f5;
            --title-color: #333;
            --group-title-color: #444;
            --card-bg: #fff;
            --card-color: #333;
            --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
            --toggle-bg: rgba(0,0,0,0.08);
            --toggle-hover-bg: rgba(0,0,0,0.15);
            --toggle-icon-color: #555;
        }

        /* 暗色主题变量 */
        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --title-color: #e0e0e0;
            --group-title-color: #ccc;
            --card-bg: #16213e;
            --card-color: #e0e0e0;
            --card-shadow: 0 2px 8px rgba(0,0,0,0.3);
            --toggle-bg: rgba(255,255,255,0.1);
            --toggle-hover-bg: rgba(255,255,255,0.2);
            --toggle-icon-color: #e0e0e0;
        }

        /* 跟随系统偏好（当用户未手动设置时生效） */
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-color: #1a1a2e;
                --title-color: #e0e0e0;
                --group-title-color: #ccc;
                --card-bg: #16213e;
                --card-color: #e0e0e0;
                --card-shadow: 0 2px 8px rgba(0,0,0,0.3);
                --toggle-bg: rgba(255,255,255,0.1);
                --toggle-hover-bg: rgba(255,255,255,0.2);
                --toggle-icon-color: #e0e0e0;
            }
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            padding: 20px;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 30px;
        }

        h1 {
            text-align: center;
            color: var(--title-color);
            font-size: 28px;
            transition: color 0.3s ease;
        }

        /* 主题切换按钮 */
        .theme-toggle {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--toggle-bg);
            border-radius: 20px;
            padding: 4px;
            transition: background 0.3s ease;
        }

        .theme-toggle button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 16px;
            font-size: 16px;
            line-height: 1;
            color: var(--toggle-icon-color);
            transition: all 0.25s ease;
            opacity: 0.5;
        }

        .theme-toggle button:hover {
            background: var(--toggle-hover-bg);
            opacity: 0.8;
        }

        .theme-toggle button.active {
            opacity: 1;
            background: var(--toggle-hover-bg);
        }

        .tool-group {
            margin-bottom: 30px;
        }

        .group-title {
            font-size: 2vw;
            color: var(--group-title-color);
            margin-bottom: 12px;
            padding-left: 10px;
            border-left: 4px solid #667eea;
            transition: color 0.3s ease;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            padding: 10px 0 20px;
        }

        .tool-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 20px;
            font-size: 1.3vw;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--card-shadow);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.5;
            word-wrap: break-word;
        }

        [data-theme="dark"] .tool-button {
            filter: brightness(0.85) saturate(0.9);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .tool-button {
                filter: brightness(0.85) saturate(0.9);
            }
        }

        .tool-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(102, 126, 234, 0.4);
        }

        .tool-button:active {
            transform: translateY(-1px);
        }

        .group-yarward .tool-button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .group-yarward .tool-button:hover {
            box-shadow: 0 6px 12px rgba(245, 87, 108, 0.4);
        }

        .group-yarward .group-title {
            border-left-color: #f5576c;
        }

        .group-game .tool-button {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .group-game .tool-button:hover {
            box-shadow: 0 6px 12px rgba(79, 172, 254, 0.4);
        }

        .group-game .group-title {
            border-left-color: #4facfe;
        }

        .group-utility .tool-button {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .group-utility .tool-button:hover {
            box-shadow: 0 6px 12px rgba(67, 233, 123, 0.4);
        }

        .group-utility .group-title {
            border-left-color: #43e97b;
        }

        .group-tool .tool-button {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .group-tool .tool-button:hover {
            box-shadow: 0 6px 12px rgba(250, 112, 154, 0.4);
        }

        .group-tool .group-title {
            border-left-color: #fa709a;
        }

        @media (max-width: 768px) {
            .tools-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 12px;
            }

            .tool-button {
                padding: 16px;
                font-size: 14px;
                min-height: 70px;
            }

            h1 {
                font-size: 22px;
            }

            .group-title {
                font-size: 18px;
            }

            .page-header {
                flex-wrap: wrap;
                gap: 10px;
            }

            .theme-toggle {
                position: static;
                transform: none;
                margin: 0 auto;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .tools-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .tool-button {
                font-size: 13px;
                padding: 14px;
                min-height: 60px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="page-header">
        <h1>工具集合</h1>
        <div class="theme-toggle" title="切换主题">
            <button data-theme-value="light" title="明亮主题">☀️</button>
            <button data-theme-value="system" title="跟随系统">💻</button>
            <button data-theme-value="dark" title="黑暗主题">🌙</button>
        </div>
    </div>
    <div id="tools-container">
    </div>
</div>

<script>
    const pageConfig = {

        "Yarward": {
            groupClass: "group-yarward",
            tools: [
                { name: "Yarward快速创建数据[调用接口]", url: "../application/editFileName/createData.html" },
                { name: "Yarward创建Mock数据", url: "../application/editFileName/createMockRemote.html" },
                { name: "Yarward创建Mock数据-old", url: "../application/editFileName/createMock.html" },
                { name: "Yarward创建服务器数据", url: "../application/editFileName/createHostData_v.html" },
                { name: "Yarward创建服务器设备数据", url: "../application/editFileName/createHostData_device.html" },
                { name: "Yarward在svn上面创建目录", url: "../application/editFileName/svnCreateDir.html" },
                { name: "Yarward门诊项目生成zip", url: "../application/editFileName/menZhenSavezip.html" }
            ]
        },
        "实用工具": {
            groupClass: "group-tool",
            tools: [
                { name: "简易番茄钟", url: "./Game/Pomodoro/index.html" },
                { name: "AI绘本处理脚本", url: "../application/tools/dealJson.html" },
                { name: "本地小工具", url: "../application/editFileName/edit2.html" },
                { name: "图片爬取任务开启", url: "../application/editFileName/web-crawl-processor.html" },
                { name: "Theme主题数据展示与复制", url: "../application/editFileName/themeViewer.html" },
            ]
        },
        "数字游戏": {
            groupClass: "group-game",
            tools: [
                { name: "1、数字左右点击", url: "./num1.html" },
                { name: "2、数字自增，可调速", url: "./num2.html" },
                { name: "3、数字自增，可变色", url: "./num3.html" },
                { name: "4、数字+1+1+1..+n..+1", url: "./num4.html" },
                { name: "5、数字+1+2+3+n", url: "./num5.html" }
            ]
        },
        "2048系列": {
            groupClass: "group-game",
            tools: [
                { name: "数字2048[固定难度128，可手滑]", url: "./Game/2048/index.html" },
                { name: "数字2048[高难度最大65,536]", url: "./Game/2048/index2.html" },
                { name: "数字2048[可调难度，高难度]", url: "./Game/2048/index3.html" },
                { name: "数字2048[最大262,144，实际难度128]", url: "./Game/2048/index4.html" }
            ]
        },
        "学习益智": {
            groupClass: "group-utility",
            tools: [
                { name: "数字计算【选类型、选难度】", url: "./Game/numericalOperations/index.html" },
                { name: "数字计算2【可调节倒计时】", url: "./Game/numericalOperations/index2.html" },
                { name: "时间和数字显示概念", url: "./Game/TimeAndNum/index.html" },
                { name: "2的次幂乐园", url: "./Game/powerNOf2/index.html" },
                { name: "成功或者失败", url: "./Game/SuccessFail/index.html" },
                { name: "总和小游戏", url: "./Game/edukiz/index.html" }
            ]
        },
    };

    // ========== 主题管理 ==========
    const THEME_KEY = 'num-index-theme';

    function getSystemTheme() {
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function applyTheme(mode) {
        // mode: 'light' | 'dark' | 'system'
        if (mode === 'system') {
            document.documentElement.removeAttribute('data-theme');
        } else {
            document.documentElement.setAttribute('data-theme', mode);
        }
        // 更新按钮激活状态
        document.querySelectorAll('.theme-toggle button').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.themeValue === mode);
        });
    }

    function initTheme() {
        const saved = localStorage.getItem(THEME_KEY) || 'system';
        applyTheme(saved);
    }

    // 监听系统主题变化（仅在跟随系统时生效）
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        const current = localStorage.getItem(THEME_KEY) || 'system';
        if (current === 'system') {
            applyTheme('system');
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        initTheme();
        renderToolGroups();

        // 主题切换事件
        document.querySelector('.theme-toggle').addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-theme-value]');
            if (!btn) return;
            const mode = btn.dataset.themeValue;
            localStorage.setItem(THEME_KEY, mode);
            applyTheme(mode);
        });
    });

    function renderToolGroups() {
        const container = document.getElementById('tools-container');
        container.innerHTML = '';

        Object.entries(pageConfig).forEach(([groupName, groupData]) => {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'tool-group ' + groupData.groupClass;

            const title = document.createElement('h2');
            title.className = 'group-title';
            title.textContent = groupName;
            groupDiv.appendChild(title);

            const grid = document.createElement('div');
            grid.className = 'tools-grid';

            groupData.tools.forEach(item => {
                const button = document.createElement('button');
                button.className = 'tool-button';
                button.textContent = item.name;
                button.addEventListener('click', () => {
                    window.open(item.url, '_blank');
                });
                grid.appendChild(button);
            });

            groupDiv.appendChild(grid);
            container.appendChild(groupDiv);
        });
    }
</script>
</body>
</html>
