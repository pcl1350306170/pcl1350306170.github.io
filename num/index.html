<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>工具集合</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            padding: 20px 0;
        }

        .tool-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 20px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .tool-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(102, 126, 234, 0.4);
        }

        .tool-button:active {
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .tools-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 12px;
            }

            .tool-button {
                padding: 16px;
                font-size: 14px;
                min-height: 70px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 20px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .tools-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .tool-button {
                font-size: 13px;
                padding: 14px;
                min-height: 60px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>工具集合</h1>
    <div class="tools-grid" id="tools-container">
        <!-- 工具按钮将通过 JavaScript 动态生成 -->
    </div>
</div>

<script>
    // 页面配置（易于扩展）
    const pageConfig = [
        { name: "1、数字左右点击", url: "./num1.html" },
        { name: "2、数字自增，可调速", url: "./num2.html" },
        { name: "3、数字自增，可变色", url: "./num3.html" },
        { name: "4、数字+1+1+1..+n..+1", url: "./num4.html" },
        { name: "5、数字+1+2+3+n", url: "./num5.html" },
        { name: "数字2048[固定难度128，可手滑]", url: "./Game/2048/index.html" },
        { name: "数字2048[高难度最大65,536]", url: "./Game/2048/index2.html" },
        { name: "数字2048[可调难度，高难度]", url: "./Game/2048/index3.html" },
        { name: "数字2048[最大262,144，实际难度128]", url: "./Game/2048/index4.html" },
        { name: "数字计算【选类型、选难度】", url: "./Game/numericalOperations/index.html" },
        { name: "数字计算2【可调节倒计时】", url: "./Game/numericalOperations/index2.html" },
        { name: "时间和数字显示概念", url: "./Game/TimeAndNum/index.html" },
        { name: "2的次幂乐园", url: "./Game/powerNOf2/index.html" },
        { name: "成功或者失败", url: "./Game/SuccessFail/index.html" },
        { name: "总和小游戏", url: "./Game/edukiz/index.html" },
        { name: "简易番茄钟", url: "./Game/Pomodoro/index.html" },
        { name: "AI绘本处理脚本", url: "../application/tools/dealJson.html" },
        { name: "本地小工具", url: "../application/editFileName/edit2.html" },
        { name: "快速创建数据[调用接口]", url: "../application/editFileName/createData.html" },
        { name: "Yarward快速创建Mock数据", url: "../application/editFileName/createMock.html" },
        { name: "Yarward创建服务器数据", url: "../application/editFileName/createHostData_v.html" },
        { name: "Yarward创建服务器设备数据", url: "../application/editFileName/createHostData_device.html" },
        { name: "图片爬取任务开启", url: "../application/editFileName/web-crawl-processor.html" },
       // { name: "txt下载任务开启", url: "../application/editFileName/web_crawler.html" },
        { name: "Yarward在svn上面创建目录", url: "../application/editFileName/svnCreateDir.html" },
        { name: "Yarward门诊项目生成zip", url: "../application/editFileName/menZhenSavezip.html" }
    ];

    document.addEventListener('DOMContentLoaded', () => {
        renderToolButtons();
    });

    // 渲染工具按钮
    function renderToolButtons() {
        const container = document.getElementById('tools-container');
        container.innerHTML = '';

        pageConfig.forEach(item => {
            const button = document.createElement('button');
            button.className = 'tool-button';
            button.textContent = item.name;
            button.addEventListener('click', () => {
                window.open(item.url, '_blank');
            });
            container.appendChild(button);
        });
    }
</script>
</body>
</html>
