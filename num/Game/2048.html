<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>宝宝2048</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Comic Sans MS", cursive, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .game-container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            color: #ff6b6b;
            margin-bottom: 15px;
            text-shadow: 2px 2px 0 #ffd166;
        }

        .score-board {
            background: white;
            padding: 12px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .score-label {
            font-size: 1.1rem;
            color: #6a5acd;
        }

        .score-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ff6b6b;
        }

        .grid {
            background-color: #bbada0;
            border-radius: 10px;
            padding: 10px;
            margin: 0 auto;
            width: 320px;
            height: 320px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
        }

        .cell {
            background-color: #cdc1b4;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #776e65;
            transition: all 0.15s ease-in-out;
        }

        /* 数字颜色和大小适配儿童 */
        .cell-2 { background: #eee4da; }
        .cell-4 { background: #ede0c8; }
        .cell-8 { background: #f2b179; color: white; }
        .cell-16 { background: #f59563; color: white; }
        .cell-32 { background: #f67c5f; color: white; }
        .cell-64 { background: #f65e3b; color: white; }
        .cell-128 {
            background: #edcf72;
            color: white;
            font-size: 1.6rem;
        }
        .cell-256 {
            background: #edcc61;
            color: white;
            font-size: 1.6rem;
        }
        .cell-512 {
            background: #edc850;
            color: white;
            font-size: 1.6rem;
        }
        .cell-1024 {
            background: #edc53f;
            color: white;
            font-size: 1.4rem;
        }
        .cell-2048 {
            background: #edc22e;
            color: white;
            font-size: 1.4rem;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            padding: 10px 20px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            background: #ffd166;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #ef9b0f;
            transition: transform 0.1s;
        }

        button:hover {
            background: #ffca4a;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .instructions {
            margin-top: 20px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            line-height: 1.5;
            color: #555;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .audio-controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .audio-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: #a0e7e5;
            color: #333;
            border: none;
            cursor: pointer;
        }

        .win-message, .lose-message {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.5rem;
            z-index: 100;
            display: none;
        }

        .win-message h2, .lose-message h2 {
            margin-bottom: 20px;
            text-shadow: 0 0 10px yellow;
        }

        @media (max-width: 480px) {
            .grid {
                width: 280px;
                height: 280px;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>🎈 宝宝2048 🎈</h1>

    <div class="score-board">
        <div class="score-label">得分：</div>
        <div class="score-value" id="score">0</div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="controls">
        <button id="new-game">新游戏</button>
    </div>

    <div class="audio-controls">
        <button class="audio-btn" id="sound-on">🔊</button>
        <button class="audio-btn" id="sound-off">🔇</button>
    </div>

    <div class="instructions">
        <p>用方向键移动方块，相同数字会合并！</p>
        <p>目标：合成 <strong>2048</strong>！</p>
    </div>
</div>

<!-- 胜利/失败弹窗 -->
<div class="win-message" id="win-message">
    <h2>🎉 恭喜你！</h2>
    <p>你合成 2048 啦！</p>
    <button id="play-again-win">再玩一次</button>
</div>

<div class="lose-message" id="lose-message">
    <h2>😢 再试一次吧！</h2>
    <p>没有可移动的方块了</p>
    <button id="play-again-lose">重新开始</button>
</div>

<!-- 音频元素（隐藏） -->
<audio id="move-sound" src="sounds/move.mp3" preload="auto"></audio>
<audio id="merge-sound" src="sounds/merge.mp3" preload="auto"></audio>
<audio id="win-sound" src="sounds/win.mp3" preload="auto"></audio>
<audio id="lose-sound" src="sounds/lose.mp3" preload="auto"></audio>
<audio id="new-tile-sound" src="sounds/new-tile.mp3" preload="auto"></audio>

<script>
    // 游戏状态
    let board = [];
    let score = 0;
    let soundEnabled = true;

    // DOM 元素
    const gridElement = document.getElementById('grid');
    const scoreElement = document.getElementById('score');
    const winMessage = document.getElementById('win-message');
    const loseMessage = document.getElementById('lose-message');

    // 音频元素
    const moveSound = document.getElementById('move-sound');
    const mergeSound = document.getElementById('merge-sound');
    const winSound = document.getElementById('win-sound');
    const loseSound = document.getElementById('lose-sound');
    const newTileSound = document.getElementById('new-tile-sound');

    // 初始化游戏
    function initGame() {
        board = Array(4).fill().map(() => Array(4).fill(0));
        score = 0;
        scoreElement.textContent = score;
        addRandomTile();
        addRandomTile();
        renderBoard();
        winMessage.style.display = 'none';
        loseMessage.style.display = 'none';
    }

    // 渲染棋盘
    function renderBoard() {
        gridElement.innerHTML = '';
        for (let r = 0; r < 4; r++) {
            for (let c = 0; c < 4; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (board[r][c] !== 0) {
                    cell.textContent = board[r][c];
                    cell.classList.add(`cell-${board[r][c]}`);
                }
                gridElement.appendChild(cell);
            }
        }
    }

    // 添加随机方块（2 或 4）
    function addRandomTile() {
        const emptyCells = [];
        for (let r = 0; r < 4; r++) {
            for (let c = 0; c < 4; c++) {
                if (board[r][c] === 0) {
                    emptyCells.push({ r, c });
                }
            }
        }
        if (emptyCells.length > 0) {
            const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            board[randomCell.r][randomCell.c] = Math.random() < 0.9 ? 2 : 4;
            if (soundEnabled) newTileSound.play().catch(e => console.log("音频播放被阻止"));
        }
    }

    // 移动逻辑（向左）
    function moveLeft() {
        let moved = false;
        for (let r = 0; r < 4; r++) {
            let row = board[r].filter(val => val !== 0);
            let newRow = [];
            let i = 0;
            while (i < row.length) {
                if (i + 1 < row.length && row[i] === row[i + 1]) {
                    const mergedValue = row[i] * 2;
                    newRow.push(mergedValue);
                    score += mergedValue;
                    i += 2;
                    if (soundEnabled) mergeSound.play().catch(e => console.log("音频播放被阻止"));
                    if (mergedValue === 2048) {
                        setTimeout(showWin, 300);
                    }
                } else {
                    newRow.push(row[i]);
                    i++;
                }
            }
            while (newRow.length < 4) {
                newRow.push(0);
            }
            if (newRow.some((val, idx) => val !== board[r][idx])) {
                moved = true;
            }
            board[r] = newRow;
        }
        return moved;
    }

    // 矩阵旋转（用于处理其他方向）
    function rotateBoard(clockwise = true) {
        const newBoard = Array(4).fill().map(() => Array(4).fill(0));
        if (clockwise) {
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    newBoard[c][3 - r] = board[r][c];
                }
            }
        } else {
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    newBoard[3 - c][r] = board[r][c];
                }
            }
        }
        board = newBoard;
    }

    // 处理按键
    function handleMove(direction) {
        // direction: 0=up, 1=right, 2=down, 3=left
        let moved = false;
        switch (direction) {
            case 0: // up
                rotateBoard(false);
                moved = moveLeft();
                rotateBoard(true);
                break;
            case 1: // right
                rotateBoard(true);
                rotateBoard(true);
                moved = moveLeft();
                rotateBoard(true);
                rotateBoard(true);
                break;
            case 2: // down
                rotateBoard(true);
                moved = moveLeft();
                rotateBoard(false);
                break;
            case 3: // left
                moved = moveLeft();
                break;
        }
        if (moved) {
            if (soundEnabled) moveSound.play().catch(e => console.log("音频播放被阻止"));
            addRandomTile();
            renderBoard();
            scoreElement.textContent = score;
            if (!canMove()) {
                setTimeout(showLose, 500);
            }
        }
    }

    // 检查是否还能移动
    function canMove() {
        // 检查是否有空格
        for (let r = 0; r < 4; r++) {
            for (let c = 0; c < 4; c++) {
                if (board[r][c] === 0) return true;
            }
        }
        // 检查是否有相邻相同数字
        for (let r = 0; r < 4; r++) {
            for (let c = 0; c < 4; c++) {
                if (
                    (r < 3 && board[r][c] === board[r + 1][c]) ||
                    (c < 3 && board[r][c] === board[r][c + 1])
                ) {
                    return true;
                }
            }
        }
        return false;
    }

    // 显示胜利
    function showWin() {
        winMessage.style.display = 'flex';
        if (soundEnabled) winSound.play().catch(e => console.log("音频播放被阻止"));
    }

    // 显示失败
    function showLose() {
        loseMessage.style.display = 'flex';
        if (soundEnabled) loseSound.play().catch(e => console.log("音频播放被阻止"));
    }

    // 键盘事件
    document.addEventListener('keydown', (e) => {
        if (e.key.startsWith('Arrow')) {
            e.preventDefault();
            let dir;
            switch (e.key) {
                case 'ArrowUp': dir = 0; break;
                case 'ArrowRight': dir = 1; break;
                case 'ArrowDown': dir = 2; break;
                case 'ArrowLeft': dir = 3; break;
            }
            handleMove(dir);
        }
    });

    // 按钮事件
    document.getElementById('new-game').addEventListener('click', initGame);
    document.getElementById('play-again-win').addEventListener('click', initGame);
    document.getElementById('play-again-lose').addEventListener('click', initGame);

    // 音频开关
    document.getElementById('sound-on').addEventListener('click', () => {
        soundEnabled = true;
    });
    document.getElementById('sound-off').addEventListener('click', () => {
        soundEnabled = false;
    });

    // 启动游戏
    initGame();
</script>
</body>
</html>
