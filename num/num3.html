<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>儿童数字递增[可选色]</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 主页面按钮 */
        #openPanelBtn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 28px 48px;
            font-size: 8vw;
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 14px;
            background: rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: background 0.2s;
        }
        #openPanelBtn:active {
            background: rgba(255,255,255,0.25);
        }
        #openPanelBtn.at-bottom {
            top: auto;
            bottom: 5vh;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 36px;
            font-size: 5.5vw;
            z-index: 60;
        }

        /* 遮罩层 */
        #overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        #overlay.show {
            display: flex;
        }

        /* 弹窗 */
        #panel {
            width: 95vw;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            background: #1e1e1e;
            border-radius: 20px;
            padding: 36px 32px;
            position: relative;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        }

        #panel h2 {
            text-align: center;
            margin-bottom: 28px;
            font-size: 8vw;
            color: #fff;
        }

        #closePanelBtn {
            position: absolute;
            top: 12px;
            right: 14px;
            width: 10vw;
            height: 10vw;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            color: #fff;
            font-size: 5.5vw;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #closePanelBtn:active {
            background: rgba(255,255,255,0.3);
        }

        .panel-group {
            margin-bottom: 28px;
        }
        .panel-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 5.5vw;
            color: #aaa;
        }
        .panel-group input {
            width: 100%;
            padding: 18px 16px;
            font-size: 7vw;
            border: 1px solid #444;
            border-radius: 8px;
            background: #2a2a2a;
            color: #fff;
            outline: none;
        }
        .panel-group input:focus {
            border-color: #6c9fff;
        }

        .panel-btn-row {
            display: flex;
            gap: 16px;
            margin-top: 12px;
        }

        #panelStartBtn {
            flex: 1;
            padding: 20px;
            font-size: 6vw;
            border: none;
            border-radius: 10px;
            background: #4caf50;
            color: #fff;
            cursor: pointer;
        }
        #panelStartBtn:active {
            background: #388e3c;
        }

        #panelResetBtn {
            flex: 1;
            padding: 20px;
            font-size: 6vw;
            border: none;
            border-radius: 10px;
            background: #f44336;
            color: #fff;
            cursor: pointer;
        }
        #panelResetBtn:active {
            background: #c62828;
        }

        .panel-color-row {
            margin-top: 22px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .panel-color-row label {
            font-size: 5.5vw;
            color: #aaa;
            margin-bottom: 0;
        }
        #panelColorBtn {
            padding: 16px 28px;
            font-size: 5.5vw;
            border: none;
            border-radius: 10px;
            background: #2196f3;
            color: #fff;
            cursor: pointer;
        }
        #panelColorBtn:active {
            background: #1565c0;
        }
        #colorPreview {
            width: 10vw;
            height: 10vw;
            max-width: 48px;
            max-height: 48px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            background: #ffffff;
        }

        /* 数字显示 */
        #number {
            display: none;
            position: fixed;
            inset: 0;
            text-align: center;
            z-index: 20;
            pointer-events: none;
            font-weight: bold;
        }
        #number.active {
            display: block;
        }

        /* 暂停提示 */
        #pauseHint {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10vw;
            color: rgba(255,255,255,0.5);
            z-index: 30;
            pointer-events: none;
            text-align: center;
        }
        #pauseHint.show {
            display: block;
        }
    </style>
</head>
<body>

<!-- 主页面唯一按钮 -->
<button id="openPanelBtn">打开操作面板</button>

<!-- 数字显示 -->
<div id="number">0</div>
<div id="pauseHint">已暂停<br><span style="font-size:0.5em">双击继续</span></div>

<!-- 弹窗遮罩 -->
<div id="overlay">
    <div id="panel">
        <button id="closePanelBtn">✕</button>
        <h2>操作面板</h2>

        <div class="panel-group">
            <label>起始数字</label>
            <input id="inputNumber" type="number" placeholder="输入数字" />
        </div>
        <div class="panel-group">
            <label>递增间隔(ms)</label>
            <input id="inputSpeed" type="number" placeholder="间隔毫秒" />
        </div>

        <div class="panel-btn-row">
            <button id="panelStartBtn">开始</button>
            <button id="panelResetBtn">重置</button>
        </div>

        <div class="panel-color-row">
            <label>数字颜色</label>
            <button id="panelColorBtn">选色</button>
            <div id="colorPreview"></div>
            <input type="color" id="colorPicker" style="display:none;" />
        </div>
    </div>
</div>

<script>
    const numberEl = document.getElementById('number');
    const openPanelBtn = document.getElementById('openPanelBtn');
    const overlay = document.getElementById('overlay');
    const closePanelBtn = document.getElementById('closePanelBtn');
    const inputNumber = document.getElementById('inputNumber');
    const inputSpeed = document.getElementById('inputSpeed');
    const panelStartBtn = document.getElementById('panelStartBtn');
    const panelResetBtn = document.getElementById('panelResetBtn');
    const panelColorBtn = document.getElementById('panelColorBtn');
    const colorPicker = document.getElementById('colorPicker');
    const colorPreview = document.getElementById('colorPreview');
    const pauseHint = document.getElementById('pauseHint');

    let currentNumber = 0;
    let timer = null;
    let interval = 1000;
    let fixedColor = null;
    let isActive = false;
    let isPaused = false;
    let lastTapTime = 0;

    function randomColor() {
        const r = Math.floor(Math.random() * 256);
        const g = Math.floor(Math.random() * 256);
        const b = Math.floor(Math.random() * 256);
        return `rgb(${r}, ${g}, ${b})`;
    }

    function adjustFontSize(num) {
        const len = num.toString().length;
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const base = Math.min(vw * 0.9, vh * 0.85);
        let size;
        if (len > 10) size = base * 0.12;
        else if (len > 9) size = base * 0.15;
        else if (len > 8) size = base * 0.18;
        else if (len > 7) size = base * 0.22;
        else if (len >= 5) size = base * 0.35;
        else if (len >= 3) size = base * 0.5;
        else size = base * 0.75;
        numberEl.style.fontSize = size + 'px';
        numberEl.style.lineHeight = vh + 'px';
    }

    function updateNumberDisplay() {
        numberEl.textContent = currentNumber;
        adjustFontSize(currentNumber);
        if (fixedColor) {
            numberEl.style.color = fixedColor;
        } else {
            numberEl.style.color = randomColor();
        }
    }

    function startIncrement() {
        if (timer) clearInterval(timer);
        isPaused = false;
        pauseHint.classList.remove('show');
        timer = setInterval(() => {
            currentNumber++;
            updateNumberDisplay();
        }, interval);
    }

    function togglePause() {
        if (!isActive) return;
        if (isPaused) {
            // 恢复
            isPaused = false;
            pauseHint.classList.remove('show');
            startIncrement();
        } else {
            // 暂停
            isPaused = true;
            clearInterval(timer);
            timer = null;
            pauseHint.classList.add('show');
        }
    }

    function resetAll() {
        if (timer) clearInterval(timer);
        timer = null;
        currentNumber = 0;
        fixedColor = null;
        updateNumberDisplay();
        inputNumber.value = '';
        inputSpeed.value = '';
        colorPreview.style.background = '#ffffff';
    }

    function openPanel() {
        overlay.classList.add('show');
    }

    function closePanel() {
        overlay.classList.remove('show');
    }

    function enterActiveMode() {
        if (isActive) return;
        isActive = true;
        numberEl.classList.add('active');
        openPanelBtn.classList.add('at-bottom');
        openPanelBtn.textContent = '操作面板';
    }

    // 初始化字体
    adjustFontSize(currentNumber);

    // 打开弹窗
    openPanelBtn.addEventListener('click', () => {
        openPanel();
    });

    // 关闭弹窗
    closePanelBtn.addEventListener('click', () => {
        closePanel();
    });

    // 点击遮罩关闭
    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) {
            closePanel();
        }
    });

    // 开始递增
    panelStartBtn.addEventListener('click', () => {
        const val = parseInt(inputNumber.value, 10);
        if (!isNaN(val)) {
            currentNumber = val;
        }

        const speedVal = parseInt(inputSpeed.value, 10);
        if (!isNaN(speedVal) && speedVal > 0) {
            interval = speedVal;
        }

        updateNumberDisplay();
        startIncrement();
        enterActiveMode();
        closePanel();
    });

    // 重置
    panelResetBtn.addEventListener('click', () => {
        resetAll();
        updateNumberDisplay();
    });

    // 选色
    panelColorBtn.addEventListener('click', () => {
        colorPicker.click();
    });

    colorPicker.addEventListener('input', (e) => {
        fixedColor = e.target.value;
        colorPreview.style.background = e.target.value;
        updateNumberDisplay();
    });

    // 禁用右键
    document.addEventListener('contextmenu', e => e.preventDefault());

    // 双击屏幕暂停/恢复计数
    document.addEventListener('touchend', (e) => {
        // 忽略弹窗内的触摸
        if (overlay.classList.contains('show')) return;
        // 忽略按钮点击
        if (e.target.closest('#openPanelBtn')) return;

        const now = Date.now();
        if (now - lastTapTime < 300) {
            togglePause();
        }
        lastTapTime = now;
    });

    // PC端双击支持
    document.addEventListener('dblclick', (e) => {
        if (overlay.classList.contains('show')) return;
        if (e.target.closest('#openPanelBtn')) return;
        togglePause();
    });
</script>
</body>
</html>
