<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JSON数据分组处理工具</title>
    <!-- 引入Vue -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <!-- 引入Element UI -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <style>
        body {
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .el-form-item {
            margin-bottom: 15px;
        }

        .form-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .el-textarea {
            width: 800px;
        }

        .el-input {
            width: 400px;
        }

        .result-container {
            margin-top: 20px;
        }

        .copy-btn {
            margin-left: 10px;
        }

        .result-item {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ebeef5;
            border-radius: 4px;
            background-color: #fafafa;
        }

        .result-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #409EFF;
        }

        .result-content {
            white-space: pre-line;
            line-height: 1.6;
        }

        .el-input-group {
            display: flex;
            align-items: center;
        }

        .el-input-group__append {
            background-color: #f5f7fa;
            border: 1px solid #dcdfe6;
            border-left: none;
            border-radius: 0 4px 4px 0;
            padding: 0 20px;
            white-space: nowrap;
            vertical-align: middle;
            display: table-cell;
            position: relative;
            border-collapse: separate;
        }

        .group-label {
            margin-right: 10px;
            color: #606266;
        }

        .input-section {
            margin-bottom: 30px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 4px;
        }

        .output-section {
            margin-top: 30px;
        }

        .json-input {
            min-height: 200px;
        }

        .result-textarea {
            min-height: 300px;
        }
    </style>
</head>
<body>
<div id="app" class="form-container">
    <div class="input-section">
        <h2>JSON数据分组处理工具</h2>
        <el-form :model="formData" :rules="rules" ref="formData" label-width="120px">
            <el-form-item label="通用要求" prop="commonRequirement">
                <el-input
                        v-model="formData.commonRequirement"
                        type="textarea"
                        :rows="3"
                        placeholder="请输入通用要求，将应用到每个分组">
                </el-input>
            </el-form-item>

            <el-form-item label="分组个数" prop="groupCount">
                <el-input
                        v-model.number="formData.groupCount"
                        placeholder="请输入分组个数，默认为4">
                    <template slot="append">个</template>
                </el-input>
            </el-form-item>

            <el-form-item label="JSON数据" prop="jsonData">
                <el-input
                        v-model="formData.jsonData"
                        type="textarea"
                        class="json-input"
                        :rows="10"
                        placeholder='请输入JSON数据，格式如：[{"num": "1", "title": "第001页", "plotContent": "...", "sceneSetting": "...", "Character": "..."}]'>
                </el-input>
            </el-form-item>

            <el-form-item>
                <el-button
                        type="primary"
                        @click="processJson"
                        :loading="isProcessing"
                >
                    开始处理
                </el-button>
                <el-button
                        @click="clearAll"
                >
                    清空全部
                </el-button>
            </el-form-item>
        </el-form>
    </div>

    <div class="output-section" v-if="processedResults.length > 0">
        <h3>处理结果</h3>
        <div class="result-item" v-for="(group, index) in processedResults" :key="index">
            <div class="result-title">{{ group.title }}</div>
            <el-input
                    type="textarea"
                    class="result-textarea"
                    :value="group.content"
                    :readonly="true"
                    :autosize="{ minRows: 6, maxRows: 20 }"
            ></el-input>
            <div style="margin-top: 10px;">
                <el-button
                        type="primary"
                        size="small"
                        @click="copyToClipboard(group.content)"
                        class="copy-btn"
                >
                    一键复制
                </el-button>
                <el-button
                        type="info"
                        size="small"
                        @click="copyToClipboardWithPrefix(group.content, group.title)"
                        class="copy-btn"
                >
                    复制带标题
                </el-button>
            </div>
        </div>
    </div>

    <!-- 全局加载状态 -->
    <div v-if="showLoading" class="loading-mask">
        <el-loading-spinner type="circle"></el-loading-spinner>
        <div class="loading-text">{{ loadingText }}</div>
    </div>
</div>

<script>
    new Vue({
        el: '#app',
        data() {
            return {
                formData: {
                    commonRequirement: '',
                    groupCount: 4,
                    jsonData: JSON.stringify([
                        {
                            "num": "1",
                            "title": "第001页",
                            "plotContent": "周三上午，阳光暖暖，小糖糖背着书包蹦跳着走进幼儿园，胸前佩戴一日园长徽章。",
                            "sceneSetting": "幼儿园门口，金黄银杏叶铺地，川西林盘小院与现代建筑交融，小糖糖穿日常童装，胸前太阳花徽章闪烁全息屏，脚踩蓝色熊猫图案社交感应鞋，手腕星罗手环泛蓝光。",
                            "Character": "小糖糖",
                            "common": ""
                        },
                        {
                            "num": "2",
                            "title": "第002页",
                            "plotContent": "老师温柔摸头欢迎，小糖糖挺起胸脯，骄傲承诺会做好一日园长。",
                            "sceneSetting": "幼儿园门厅，木质前台温馨整洁，女老师蹲下微笑，小糖糖仰脸红扑扑，双手背在身后站得笔直，徽章显示今日活动流程。",
                            "Character": "小糖糖、老师",
                            "common": ""
                        }
                    ], null, 2)
                },
                rules: {
                    commonRequirement: [
                        { required: true, message: '请输入通用要求', trigger: 'blur' }
                    ],
                    groupCount: [
                        { required: true, message: '请输入分组个数', trigger: 'blur' },
                        { type: 'number', message: '分组个数必须为数字', trigger: 'blur' },
                        { validator: (rule, value, callback) => {
                                if (value < 1) {
                                    callback(new Error('分组个数必须大于0'));
                                } else {
                                    callback();
                                }
                            }, trigger: 'blur' }
                    ],
                    jsonData: [
                        { required: true, message: '请输入JSON数据', trigger: 'blur' },
                        { validator: (rule, value, callback) => {
                                try {
                                    JSON.parse(value);
                                    callback();
                                } catch (e) {
                                    callback(new Error('JSON格式不正确'));
                                }
                            }, trigger: 'blur' }
                    ]
                },
                processedResults: [],
                isProcessing: false,
                showLoading: false,
                loadingText: '处理中，请稍候...'
            };
        },
        methods: {
            async processJson() {
                this.$refs.formData.validate(async (valid) => {
                    if (valid) {
                        this.showLoading = true;
                        this.isProcessing = true;
                        this.loadingText = '正在处理JSON数据，请稍候...';

                        try {
                            // 解析JSON数据
                            const jsonData = JSON.parse(this.formData.jsonData);

                            if (!Array.isArray(jsonData)) {
                                throw new Error('JSON数据必须是数组格式');
                            }

                            // 按指定数量分组
                            const groupSize = parseInt(this.formData.groupCount) || 4;
                            const groups = [];

                            for (let i = 0; i < jsonData.length; i += groupSize) {
                                groups.push(jsonData.slice(i, i + groupSize));
                            }

                            // 处理每个分组
                            const results = [];
                            for (let i = 0; i < groups.length; i++) {
                                const group = groups[i];

                                // 生成分组标题
                                const startIndex = i * groupSize + 1;
                                const endIndex = Math.min((i + 1) * groupSize, jsonData.length);
                                const groupTitle = `第${String(startIndex).padStart(3, '0')}页-${String(endIndex).padStart(3, '0')}页`;

                                // 生成分组内容
                                let content = '';
                                group.forEach(item => {
                                    content += `${item.title}\n`;
                                    content += `画面要求：${item.sceneSetting}\n`;
                                    content += `出场人物：${item.Character}\n`;
                                    if (this.formData.commonRequirement) {
                                        content += `通用要求：${this.formData.commonRequirement}\n`;
                                    }
                                    content += `\n`;
                                });

                                results.push({
                                    title: groupTitle,
                                    content: content.trim()
                                });
                            }

                            this.processedResults = results;

                            this.$message({
                                message: '处理完成！',
                                type: 'success',
                                duration: 2000
                            });
                        } catch (error) {
                            this.$alert(error.message || '处理过程中出现错误', '错误提示', {
                                confirmButtonText: '确定',
                                type: 'error'
                            });
                        } finally {
                            this.showLoading = false;
                            this.isProcessing = false;
                        }
                    }
                });
            },

            copyToClipboard(text) {
                if (!text) {
                    this.$message.warning('没有内容可复制');
                    return;
                }

                navigator.clipboard.writeText(text).then(() => {
                    this.$message.success('复制成功！');
                }).catch(err => {
                    // 降级方案
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    this.$message.success('复制成功！');
                });
            },

            copyToClipboardWithPrefix(content, prefix) {
                const text = `${prefix}\n${content}`;
                this.copyToClipboard(text);
            },

            clearAll() {
                this.$confirm('确定要清空所有内容吗？', '提示', {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'warning'
                }).then(() => {
                    this.formData.commonRequirement = '';
                    this.formData.groupCount = 4;
                    this.formData.jsonData = '';
                    this.processedResults = [];

                    this.$message({
                        type: 'success',
                        message: '已清空!'
                    });
                });
            }
        }
    });
</script>
</body>
</html>
