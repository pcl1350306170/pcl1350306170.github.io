<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://raw.githubusercontent.com/pcl1350306170/test-data-backup/refs/heads/main/img/T/头像-蒂法高清-grf6fb.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Data CRUD + 上传 演示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 20px;
        }
        h1 { text-align: center; color: #c084fc; margin-bottom: 24px; font-size: 26px; }
        .panel {
            max-width: 800px; margin: 0 auto 24px; background: #16213e;
            border: 1px solid #1f3056; border-radius: 8px; padding: 20px;
        }
        .panel h2 { color: #a78bfa; font-size: 16px; margin-bottom: 14px; border-bottom: 1px solid #1f3056; padding-bottom: 8px; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
        label { font-size: 13px; color: #94a3b8; min-width: 80px; }
        input, textarea {
            flex: 1; padding: 8px 12px; background: #0f1a30; border: 1px solid #1f3056;
            border-radius: 6px; color: #e2e8f0; font-size: 14px; outline: none; font-family: inherit;
        }
        input:focus, textarea:focus { border-color: #7c3aed; }
        textarea { resize: vertical; min-height: 60px; }
        button {
            padding: 8px 18px; background: #7c3aed; color: #fff; border: none;
            border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; transition: background .2s;
        }
        button:hover { background: #6d28d9; }
        button.danger { background: #dc2626; }
        button.danger:hover { background: #b91c1c; }
        button.success { background: #16a34a; }
        button.success:hover { background: #15803d; }
        #log {
            max-width: 800px; margin: 0 auto; background: #0f1a30; border: 1px solid #1f3056;
            border-radius: 8px; padding: 16px; font-size: 13px; line-height: 1.8;
            max-height: 360px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; color: #94a3b8;
        }
        #log .ok { color: #4ade80; }
        #log .err { color: #f87171; }
        #log .info { color: #60a5fa; }
    </style>
    <script src="../../lib/vue/axios.min.js"></script>
    <script src="../../js/_variable.js"></script>
    <script src="../../js/GeneralDataApi.js"></script>
</head>
<body>
    <h1>General Data CRUD + 上传 演示</h1>

    <!-- 表单 -->
    <div class="panel">
        <h2>数据表单</h2>
        <div class="row">
            <label>dataType</label>
            <input id="fType" value="demo_test" placeholder="数据分类">
        </div>
        <div class="row">
            <label>dataKey</label>
            <input id="fKey" value="" placeholder="唯一标识（可选）">
        </div>
        <div class="row">
            <label>dataContent</label>
            <textarea id="fContent" placeholder='数据内容，如 {"note":"hello"}'></textarea>
        </div>
        <div class="row" style="margin-top:4px;">
            <button onclick="doSave()">保存 (save)</button>
            <button onclick="doBatchSave()">批量保存</button>
            <button onclick="doSaveOrUpdate()">智能保存 (saveOrUpdate)</button>
            <button class="success" onclick="doQuery()">按类型查询</button>
            <button class="success" onclick="doQueryById()">按ID查询</button>
            <button class="danger" onclick="doDelete()">删除</button>
        </div>
        <div class="row" style="margin-top:4px;">
            <label>record ID</label>
            <input id="fId" placeholder="用于 update / delete / get-by-id">
            <button onclick="doUpdate()">更新</button>
        </div>
    </div>

    <!-- 上传面板 -->
    <div class="panel">
        <h2>文件上传演示（dataType: demo_test_upload）</h2>
        <div class="row">
            <label>选择文件</label>
            <input id="fFile" type="file" style="padding:6px;">
            <button class="success" onclick="doUpload()">上传并保存</button>
        </div>
        <div class="row">
            <label>dataKey</label>
            <input id="fUploadKey" value="" placeholder="可选，用于 saveOrUpdate">
        </div>
        <div class="row" style="margin-top:4px;">
            <button class="success" onclick="doQueryUpload()">查询上传记录</button>
        </div>
        <div id="uploadPreview" style="margin-top:8px;font-size:13px;color:#94a3b8;"></div>
    </div>

    <!-- 日志 -->
    <div id="log">等待操作...\n</div>

    <script>
        var logEl = document.getElementById('log');

        function log(msg, cls) {
            var t = new Date().toLocaleTimeString();
            logEl.innerHTML += '<span class="' + (cls||'') + '">[' + t + '] ' + msg + '</span>\n';
            logEl.scrollTop = logEl.scrollHeight;
        }

        function getVal(id) { return document.getElementById(id).value.trim(); }

        // ========== 1. 保存（save） ==========
        function doSave() {
            var payload = {
                dataType: getVal('fType'),
                dataKey: getVal('fKey') || undefined,
                dataContent: getVal('fContent')
            };
            log('>>> GeneralDataApi.save  ' + JSON.stringify(payload), 'info');
            GeneralDataApi.save(payload)
                .then(function (d) {
                    log('<<< 保存成功: ' + JSON.stringify(d), 'ok');
                    if (d.data && d.data.id) document.getElementById('fId').value = d.data.id;
                })
                .catch(function (e) { log('<<< 保存失败: ' + e.message, 'err'); });
        }

        // ========== 2. 批量保存（batch-save） ==========
        function doBatchSave() {
            var list = [
                { dataType: getVal('fType'), dataContent: getVal('fContent') || 'batch-item-1' },
                { dataType: getVal('fType'), dataContent: getVal('fContent') || 'batch-item-2' }
            ];
            log('>>> GeneralDataApi.batchSave  ' + JSON.stringify(list), 'info');
            GeneralDataApi.batchSave(list)
                .then(function (d) { log('<<< 批量保存成功: ' + JSON.stringify(d), 'ok'); })
                .catch(function (e) { log('<<< 批量保存失败: ' + e.message, 'err'); });
        }

        // ========== 3. 智能保存（saveOrUpdate） ==========
        function doSaveOrUpdate() {
            var dataType = getVal('fType');
            var dataKey = getVal('fKey');
            var dataContent = getVal('fContent');
            if (!dataKey) return log('智能保存需要填写 dataKey', 'err');
            log('>>> GeneralDataApi.saveOrUpdate("' + dataType + '", "' + dataKey + '", ...)', 'info');
            GeneralDataApi.saveOrUpdate(dataType, dataKey, dataContent)
                .then(function (d) { log('<<< 智能保存成功: ' + JSON.stringify(d), 'ok'); })
                .catch(function (e) { log('<<< 智能保存失败: ' + e.message, 'err'); });
        }

        // ========== 4. 更新（update） ==========
        function doUpdate() {
            var id = getVal('fId');
            if (!id) return log('请先填写 record ID', 'err');
            var payload = { dataContent: getVal('fContent') };
            log('>>> GeneralDataApi.update(' + id + ', ' + JSON.stringify(payload) + ')', 'info');
            GeneralDataApi.update(id, payload)
                .then(function (d) { log('<<< 更新成功: ' + JSON.stringify(d), 'ok'); })
                .catch(function (e) { log('<<< 更新失败: ' + e.message, 'err'); });
        }

        // ========== 5. 删除（delete） ==========
        function doDelete() {
            var id = getVal('fId');
            if (!id) return log('请先填写 record ID', 'err');
            log('>>> GeneralDataApi.remove(' + id + ')', 'info');
            GeneralDataApi.remove(id)
                .then(function (d) { log('<<< 删除成功: ' + JSON.stringify(d), 'ok'); })
                .catch(function (e) { log('<<< 删除失败: ' + e.message, 'err'); });
        }

        // ========== 6. 按类型查询（get-by-type） ==========
        function doQuery() {
            var dataType = getVal('fType');
            log('>>> GeneralDataApi.getByType("' + dataType + '")', 'info');
            GeneralDataApi.getByType(dataType)
                .then(function (list) {
                    log('<<< 查询成功，共 ' + list.length + ' 条:', 'ok');
                    list.forEach(function (item) {
                        var content = typeof item.dataContent === 'string'
                            ? item.dataContent.substring(0, 80)
                            : JSON.stringify(item.dataContent).substring(0, 80);
                        log('  [id=' + item.id + '] key=' + (item.dataKey || '-') + ' content=' + content);
                    });
                    if (list.length) document.getElementById('fId').value = list[0].id;
                })
                .catch(function (e) { log('<<< 查询失败: ' + e.message, 'err'); });
        }

        // ========== 7. 按ID查询（get-by-id） ==========
        function doQueryById() {
            var id = getVal('fId');
            if (!id) return log('请先填写 record ID', 'err');
            log('>>> GeneralDataApi.getById(' + id + ')', 'info');
            GeneralDataApi.getById(id)
                .then(function (d) {
                    var item = d.data;
                    log('<<< 查询成功:', 'ok');
                    log('  id=' + item.id + ', type=' + item.dataType + ', key=' + (item.dataKey || '-'));
                    log('  content=' + (typeof item.dataContent === 'string' ? item.dataContent : JSON.stringify(item.dataContent)));
                    log('  createTime=' + item.createTime + ', updateTime=' + item.updateTime);
                    // 回填表单
                    document.getElementById('fType').value = item.dataType || '';
                    document.getElementById('fKey').value = item.dataKey || '';
                    document.getElementById('fContent').value = typeof item.dataContent === 'string' ? item.dataContent : JSON.stringify(item.dataContent);
                })
                .catch(function (e) { log('<<< 查询失败: ' + e.message, 'err'); });
        }

        // ========== 8. 文件上传并保存到 GeneralData ==========
        function doUpload() {
            var fileInput = document.getElementById('fFile');
            if (!fileInput.files.length) return log('请先选择文件', 'err');

            var formData = new FormData();
            formData.append('file', fileInput.files[0]);
            var fileName = fileInput.files[0].name;

            log('>>> 上传文件: ' + fileName + ' (' + (fileInput.files[0].size / 1024).toFixed(1) + ' KB)', 'info');

            axios.post(ajaxFileDealJavaIP + '/blog-api/v1/upload', formData, {
                headers: { 'Content-Type': 'multipart/form-data' }
            }).then(function (res) {
                var d = res.data;
                if (d && d.resultCode === 200 && d.data) {
                    var fileUrl = d.data.fileUrl;
                    var fullUrl = ajaxFileDealJavaIP + fileUrl;
                    log('<<< 上传成功: ' + fileUrl, 'ok');
                    log('    完整地址: ' + fullUrl, 'ok');

                    // 预览图片
                    var previewEl = document.getElementById('uploadPreview');
                    if (fileUrl.match(/\.(png|jpe?g|gif|webp|bmp|svg)$/i)) {
                        previewEl.innerHTML = '<img src="' + fullUrl + '" style="max-width:300px;max-height:200px;border-radius:6px;border:1px solid #1f3056;margin-top:4px;" />';
                    } else {
                        previewEl.innerHTML = '<span style="color:#60a5fa;">文件: ' + d.data.fileName + ' (' + d.data.fileSize + ' bytes)</span>';
                    }

                    // 将上传结果保存到 GeneralData
                    var dataKey = document.getElementById('fUploadKey').value.trim();
                    var contentObj = {
                        fileName: d.data.fileName,
                        newFileName: d.data.newFileName,
                        fileUrl: fileUrl,
                        fullUrl: fullUrl,
                        fileSize: d.data.fileSize,
                        uploadTime: new Date().toISOString()
                    };

                    var payload = {
                        dataType: 'demo_test_upload',
                        dataContent: JSON.stringify(contentObj)
                    };
                    if (dataKey) payload.dataKey = dataKey;

                    log('>>> 保存到 GeneralData (dataType=demo_test_upload)', 'info');
                    return GeneralDataApi.save(payload);
                } else {
                    throw new Error('上传接口返回异常: ' + JSON.stringify(d));
                }
            }).then(function (saveRes) {
                if (saveRes && saveRes.data && saveRes.data.id) {
                    log('<<< 保存成功, id=' + saveRes.data.id, 'ok');
                }
            }).catch(function (e) {
                log('<<< 上传/保存失败: ' + (e.message || e), 'err');
            });
        }

        // ========== 9. 查询上传记录 ==========
        function doQueryUpload() {
            log('>>> GeneralDataApi.getByType("demo_test_upload")', 'info');
            GeneralDataApi.getByType('demo_test_upload')
                .then(function (list) {
                    log('<<< 查询上传记录，共 ' + list.length + ' 条:', 'ok');
                    list.forEach(function (item) {
                        var content = typeof item.dataContent === 'string'
                            ? JSON.parse(item.dataContent) : item.dataContent;
                        log('  [id=' + item.id + '] ' + (content.fileName || '-') + ' -> ' + (content.fullUrl || content.fileUrl || '-'));
                    });
                })
                .catch(function (e) { log('<<< 查询失败: ' + e.message, 'err'); });
        }
    </script>
</body>
</html>
