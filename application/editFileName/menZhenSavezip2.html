<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>门诊项目压缩包处理</title>
    <!-- 引入Vue 2 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <!-- 引入Element UI -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui-ui/lib/theme-chalk/index.css">
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <!-- 引入axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../../js/_variable.js" type="text/javascript"></script>
    <style>
        body {
            padding: 30px;
            background-color: #f5f7fa;
        }
        .form-container {
            max-width: 1800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.05);
        }
        .el-form-item {
            margin-bottom: 22px;
        }
        .el-input, .el-select {
            width: 100%;
        }
        .el-button--primary {
            width: 100%;
            height: 40px;
            font-size: 16px;
        }
        .result-card {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ebeef5;
        }
        .result-title {
            font-size: 15px;
            font-weight: 500;
            color: #1f2d3d;
            margin-bottom: 15px;
        }
        .progress-container {
            margin-top: 25px;
        }
        .log-container {
            margin-top: 15px;
            height: 300px;
            border: 1px solid #ebeef5;
            border-radius: 4px;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.5;
            background-color: #fafafa;
        }
        .log-item {
            margin-bottom: 5px;
        }
        .log-time {
            color: #909399;
            margin-right: 10px;
        }
        .log-content {
            color: #303133;
        }
    </style>
</head>
<body>
<div id="app" class="form-container">
    <!-- 表单区域 -->
    <el-form :model="formData" :rules="formRules" ref="zipForm" label-width="160px">
        <!-- 版本信息（单选可输入） -->
        <el-form-item label="版本信息" prop="version">
            <el-radio-group v-model="formData.version" @change="handleVersionChange">
                <el-radio label="1.5.0">1.5.0</el-radio>
                <el-radio label="1.5.1">1.5.1</el-radio>
                <el-radio label="1.5.2">1.5.2</el-radio>
                <el-radio label="1.5.3">1.5.3</el-radio>
                <el-radio label="custom">
                    <el-input
                            v-model="customVersion"
                            placeholder="请输入其他版本"
                            style="width: 120px; margin-left: 10px;"
                            @input="updateCustomVersion"
                    ></el-input>
                </el-radio>
            </el-radio-group>
        </el-form-item>

        <!-- 订单号 -->
        <el-form-item label="订单号" prop="orderNumber">
            <el-input
                    v-model="formData.orderNumber"
                    placeholder="请输入订单号"
            ></el-input>
        </el-form-item>

        <!-- 需发布zip文件 -->
        <el-form-item label="需发布zip文件" prop="sourceZipPath">
            <el-input
                    v-model="formData.sourceZipPath"
                    placeholder="请输入需发布的zip文件路径"
            ></el-input>
        </el-form-item>

        <!-- zip文件输出路径 -->
        <el-form-item label="zip文件输出路径" prop="outputZipPath">
            <el-input
                    v-model="formData.outputZipPath"
                    placeholder="请输入zip文件输出路径"
            ></el-input>
        </el-form-item>

        <!-- 项目地址 -->
        <el-form-item label="项目地址" prop="projectPath">
            <el-input
                    v-model="formData.projectPath"
                    placeholder="请输入项目地址"
            ></el-input>
        </el-form-item>

        <!-- node版本 -->
        <el-form-item label="node打包版本" prop="nodeVersion">
            <el-input
                    v-model="formData.nodeVersion"
                    placeholder="node打包版本，默认14.16.0"
            ></el-input>
        </el-form-item>

        <!-- 提交按钮 -->
        <el-form-item>
            <el-button
                    type="primary"
                    @click="submitZipForm"
                    :loading="submitLoading"
                    :disabled="isProcessing"
            >
                <i class="el-icon-upload" v-if="!submitLoading && !isProcessing"></i>
                <i class="el-icon-loading" v-if="submitLoading || isProcessing"></i>
                {{ isProcessing ? '处理中...' : (submitLoading ? '提交中...' : '处理并生成压缩包') }}
            </el-button>
        </el-form-item>
    </el-form>

    <!-- 进度展示区域 -->
    <div v-if="isProcessing" class="progress-container">
        <el-card>
            <div slot="header">
                <span>处理进度</span>
                <el-tag :type="statusTagType" style="margin-left: 10px;">{{ currentStatus }}</el-tag>
            </div>
            <div>
                <el-progress :percentage="progressPercent" :stroke-width="2"></el-progress>
                <div style="margin-top: 10px; text-align: right;">
                    <span style="color: #606266; font-size: 13px;">{{ progressPercent }}%</span>
                </div>

                <div style="margin-top: 15px;">
                    <el-descriptions column="1" border>
                        <el-descriptions-item label="当前状态">{{ currentMessage }}</el-descriptions-item>
                        <el-descriptions-item label="任务ID">{{ taskId }}</el-descriptions-item>
                        <el-descriptions-item label="开始时间">{{ startTime }}</el-descriptions-item>
                    </el-descriptions>
                </div>

                <div class="result-title">处理日志</div>
                <div class="log-container">
                    <div v-for="(log, index) in logs" :key="index" class="log-item">
                        <span class="log-time">{{ log.time }}</span>
                        <span class="log-content">{{ log.content }}</span>
                    </div>
                </div>
            </div>
        </el-card>
    </div>

    <!-- 结果展示区域 -->
    <el-card v-if="showResult && !isProcessing" class="result-card">
        <div class="result-title">操作结果</div>
        <el-descriptions :column="1" border>
            <el-descriptions-item label="状态">
                <el-tag type="success" v-if="resultSuccess">成功</el-tag>
                <el-tag type="danger" v-else>失败</el-tag>
            </el-descriptions-item>
            <el-descriptions-item label="提示信息">{{ resultMessage }}</el-descriptions-item>
            <el-descriptions-item label="生成文件路径" v-if="resultSuccess && resultData.zipFilePath">
                <el-input
                        v-model="resultData.zipFilePath"
                        readonly
                        style="margin-top: 5px;"
                ></el-input>
            </el-descriptions-item>
            <el-descriptions-item label="生成文件名称" v-if="resultSuccess && resultData.zipFileName">
                <el-input
                        v-model="resultData.zipFileName"
                        readonly
                        style="margin-top: 5px;"
                ></el-input>
            </el-descriptions-item>
        </el-descriptions>

        <div style="margin-top: 15px; text-align: right;">
            <el-button type="primary" @click="resetForm">
                <i class="el-icon-refresh"></i> 重新处理
            </el-button>
        </div>
    </el-card>
</div>

<script>
    new Vue({
        el: '#app',
        data() {
            return {
                // 表单数据
                formData: {
                    version: '1.5.0', // 默认版本
                    orderNumber: '2025-1814上海市第一人民医院',
                    sourceZipPath: 'C:\\www\\test\\门诊\\801S-订单\\前端',
                    outputZipPath: 'C:\\www\\yh\\SVN\\0门诊\\2025-1814上海市第一人民医院\\前端',
                    projectPath: 'C:\\www\\yh\\门诊\\self-low-code-template',
                    nodeVersion: '14.16.0', // node版本参数
                },
                // 自定义版本输入
                customVersion: '',
                // 表单验证规则
                formRules: {
                    version: [
                        { required: true, message: '请选择或输入版本信息', trigger: 'change' }
                    ],
                    orderNumber: [
                        { required: true, message: '订单号不能为空', trigger: 'blur' }
                    ],
                    sourceZipPath: [
                        { required: true, message: '需发布zip文件路径不能为空', trigger: 'blur' }
                    ],
                    outputZipPath: [
                        { required: true, message: 'zip文件输出路径不能为空', trigger: 'blur' }
                    ],
                    projectPath: [
                        { required: true, message: '项目地址不能为空', trigger: 'blur' }
                    ]
                },
                // 提交状态
                submitLoading: false,
                // 处理状态
                isProcessing: false,
                taskId: '',
                progressPercent: 0,
                currentStatus: '',
                currentMessage: '',
                statusTagType: '',
                logs: [],
                startTime: '',
                progressInterval: null,

                // 结果展示相关
                showResult: false,
                resultSuccess: false,
                resultMessage: '',
                resultData: {} // 存储返回的结果数据
            };
        },
        methods: {
            /**
             * 版本变更处理
             */
            handleVersionChange(val) {
                // 当选择非自定义版本时清空自定义版本输入
                if (val !== 'custom') {
                    this.customVersion = '';

                    // 根据版本自动设置相关路径
                    switch(val) {
                        case '1.5.1':
                            this.formData.sourceZipPath = 'C:\\www\\test\\门诊\\801S-订单\\前端\\1.5.1.zip';
                            this.formData.projectPath = 'C:\\www\\yh\\门诊\\self-low-code-template';
                            break;
                        case '1.5.2':
                            this.formData.sourceZipPath = 'C:\\www\\test\\门诊\\801S-订单\\前端\\1.5.2.zip';
                            this.formData.projectPath = 'C:\\www\\yh\\门诊\\template1.5.2';
                            break;
                        case '1.5.3':
                            this.formData.sourceZipPath = 'C:\\www\\test\\门诊\\801S-订单\\前端';
                            this.formData.projectPath = 'C:\\www\\yh\\门诊\\template1.5.3';
                            break;
                        case '1.5.0':
                            this.formData.sourceZipPath = 'C:\\www\\test\\门诊\\801S-订单\\前端';
                            this.formData.projectPath = 'C:\\www\\yh\\门诊\\self-low-code-template';
                            break;
                    }
                }
            },

            /**
             * 更新自定义版本
             */
            updateCustomVersion() {
                this.formData.version = this.customVersion;
            },

            /**
             * 提交表单：调用压缩包处理接口
             */
            submitZipForm() {
                // 表单验证
                this.$refs.zipForm.validate(async (isValid) => {
                    if (!isValid) return;

                    // 显示加载状态
                    this.submitLoading = true;
                    // 隐藏之前的结果
                    this.showResult = false;
                    this.logs = [];

                    try {
                        // 调用接口
                        const response = await axios({
                            url: ajaxFileDealJavaIP + '/blog-api/v1/outpatient/zip/process',
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json;charset=UTF-8'
                            },
                            data: this.formData
                        });

                        // 处理响应
                        const res = response.data;
                        if (res.success && res.data && res.data.taskId) {
                            // 获取任务ID，开始轮询进度
                            this.taskId = res.data.taskId;
                            this.isProcessing = true;
                            this.startTime = new Date().toLocaleString();
                            this.addLog('任务已启动，开始处理...');
                            this.startProgressPolling();
                        } else {
                            this.resultSuccess = false;
                            this.resultMessage = `操作失败：${res.message || "未知错误"}`;
                            this.showResult = true;
                        }
                    } catch (error) {
                        // 网络错误处理
                        this.resultSuccess = false;
                        if (error.response) {
                            this.resultMessage = `请求失败（${error.response.status}）：${error.response.data?.message || '服务器异常'}`;
                        } else if (error.request) {
                            this.resultMessage = '请求无响应，请检查接口地址或网络连接';
                        } else {
                            this.resultMessage = `请求失败：${error.message}`;
                        }
                        this.showResult = true;
                    } finally {
                        // 隐藏加载状态
                        this.submitLoading = false;
                    }
                });
            },

            /**
             * 开始轮询进度
             */
            startProgressPolling() {
                // 清除可能存在的旧定时器
                if (this.progressInterval) {
                    clearInterval(this.progressInterval);
                }

                // 立即查询一次
                this.queryProgress();

                // 每1秒查询一次
                this.progressInterval = setInterval(() => {
                    this.queryProgress();
                }, 1000);
            },

            /**
             * 查询进度
             */
            async queryProgress() {
                try {
                    const response = await axios({
                        url: ajaxFileDealJavaIP + `/blog-api/v1/outpatient/zip/status?taskId=${this.taskId}`,
                        method: 'GET'
                    });

                    const res = response.data;
                    if (res.success && res.data) {
                        const statusData = res.data;

                        // 更新进度信息
                        this.progressPercent = statusData.percentage >= 0 ? statusData.percentage : this.progressPercent;
                        this.currentMessage = statusData.message || '';
                        this.currentStatus = this.formatStatus(statusData.status);
                        this.statusTagType = this.getStatusTagType(statusData.status);

                        // 更新日志（只添加新日志）
                        if (statusData.logs && statusData.logs.length > 0) {
                            statusData.logs.forEach(log => {
                                // 检查是否已存在该日志
                                const logExists = this.logs.some(item => item.content === log);
                                if (!logExists) {
                                    this.addLog(log);
                                }
                            });
                        }

                        // 检查是否完成
                        if (statusData.status === 'COMPLETED' || statusData.status === 'FAILED') {
                            clearInterval(this.progressInterval);
                            this.isProcessing = false;
                            this.showResult = true;

                            if (statusData.status === 'COMPLETED') {
                                this.resultSuccess = true;
                                this.resultMessage = "压缩包处理成功";
                                this.resultData = statusData.result || {};
                            } else {
                                this.resultSuccess = false;
                                this.resultMessage = `处理失败：${statusData.errorMessage || '未知错误'}`;
                            }
                        }
                    } else {
                        this.addLog(`获取进度失败：${res.message || '未知错误'}`);
                    }
                } catch (error) {
                    this.addLog(`查询进度异常：${error.message}`);
                    console.error('查询进度失败:', error);
                }
            },

            /**
             * 添加日志
             */
            addLog(content) {
                this.logs.push({
                    time: new Date().toLocaleTimeString(),
                    content: content
                });

                // 自动滚动到底部
                this.$nextTick(() => {
                    const logContainer = document.querySelector('.log-container');
                    logContainer.scrollTop = logContainer.scrollHeight;
                });
            },

            /**
             * 格式化状态文本
             */
            formatStatus(status) {
                switch(status) {
                    case 'PROCESSING': return '处理中';
                    case 'COMPLETED': return '已完成';
                    case 'FAILED': return '处理失败';
                    default: return status;
                }
            },

            /**
             * 获取状态标签类型
             */
            getStatusTagType(status) {
                switch(status) {
                    case 'PROCESSING': return 'info';
                    case 'COMPLETED': return 'success';
                    case 'FAILED': return 'danger';
                    default: return 'warning';
                }
            },

            /**
             * 重置表单
             */
            resetForm() {
                this.$refs.zipForm.resetFields();
                this.showResult = false;
                this.resultData = {};
                this.logs = [];
            }
        },
        beforeDestroy() {
            // 组件销毁前清除定时器
            if (this.progressInterval) {
                clearInterval(this.progressInterval);
            }
        }
    });
</script>
</body>
</html>
