<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://raw.githubusercontent.com/pcl1350306170/test-data-backup/refs/heads/main/img/T/头像-蒂法高清-grf6fb.jpg">
    <title>快速创建Mock数据</title>
    <!-- 引入Vue -->
    <script src="../../lib/vue/vue.min.js"></script>
    <!-- 引入Element UI -->
    <link rel="stylesheet" href="../../lib/vue/element-ui/index.css">
    <script src="../../lib/vue/element-ui/index.js"></script>
    <!-- 引入axios -->
    <script src="../../lib/vue/axios.min.js"></script>
    <!-- 引入变量文件 -->
    <script src="../../js/_variable.js" type="text/javascript"></script>

    <style>
        body {
            padding: 20px;
        }
        .form-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .el-form-item {
            margin-bottom: 15px;
        }
        .page-description {
            margin-bottom: 20px;
            padding: 10px;

            border-radius: 4px;
        }
        .operation-buttons {
            margin-top: 10px;
        }
        .createLocalStorage-beds{
            width: 100%;
            height: 50vh;
            overflow-y: auto;
            display: flex  ;
            flex-wrap: wrap;
        }
        .createLocalStorage-beds >div{
            width: 45%;
        }
        .layer-createLocalStorage{
            display: flex;
            margin-bottom: 15px;
        }
        .layer-createLocalStorage >div{
            width: 45%;
        }
    </style>
</head>
<body>
<div id="app" class="form-container">
    <div class="page-description">
        <h2>页面说明：生成床头床旁使用的Mock数据，需要基础mock数据【把文件夹传过来】，患者信息列表、同科室下的设备列表。</h2>
    </div>

    <el-form :model="formData" :rules="rules" ref="formData" label-width="160px">
        <el-form-item label="病人信息数据" prop="patientData">
            <el-input
                    v-model="formData.patientData"
                    type="textarea"
                    placeholder="病人信息数据"
                    :rows="8"
            ></el-input>
        </el-form-item>

        <el-form-item label="设备信息数据" prop="deviceData">
            <el-input
                    v-model="formData.deviceData"
                    type="textarea"
                    placeholder="设备信息数据"
                    :rows="8"
            ></el-input>
        </el-form-item>

        <el-form-item>
            <el-button type="primary" @click="submitForm">确认</el-button>
            <el-button type="success" @click="submitOnlyPatient">只根据患者列表生成</el-button>
        </el-form-item>
    </el-form>

    <!-- 替换原有的popupTemplate模板 -->
    <el-dialog
            title="选择床位生成数据"
            :visible.sync="dialogVisible"
            width="80%"
            :modal="true"
    >
        <div class="createLocalStorage-beds">
            <div v-for="item in popupItems" :key="item.bedName" class="layer-createLocalStorage">
               <div>
                   床位：{{ item.bedName }}
                   姓名：{{ item.patientName }}
               </div>
                <div>
                    <el-button type="primary" size="mini" @click="createLocalStorage(item.bedName, 'wnBedHeadExtension')">生成床头</el-button>
                    <el-button type="success" size="mini" @click="createLocalStorage(item.bedName, 'wnBedSideExtension')">生成床旁</el-button>
                </div>
            </div>
            <el-input
                    v-model="localStorageText"
                    type="textarea"
                    id="localStorage-text"
                    :rows="8"
                    style="width: 90%; margin: 10px auto; display: block;"
                    placeholder="生成的localStorage代码将显示在这里"
            ></el-input>
        </div>
        <div slot="footer" class="dialog-footer">
            <el-button @click="dialogVisible = false">关闭</el-button>
        </div>
    </el-dialog>

</div>

<script>
    new Vue({
        el: '#app',
        data() {
            return {
                formData: {
                    patientData:'',
                    deviceData:'',
                },
                rules: {
                    patientData: [
                        { required: true, message: '请输入病人信息数据', trigger: 'blur' }
                    ],
                    deviceData: [
                        { required: true, message: '请输入设备信息数据', trigger: 'blur' }
                    ]
                },
                DataPatient: null,
                DataDevice: null,
                popupItems: [] ,// 用于存储弹窗中要显示的项目
                dialogVisible: false,       // 控制弹窗显示/隐藏
                localStorageText: ''        // 存储生成的localStorage代码
            };
        },
        methods: {
            // 生成8位大写字母和数字的组合
            generateRandomCode() {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let result = '';
                for (let i = 0; i < 8; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return result;
            },

            // 只根据患者列表生成
            submitOnlyPatient() {
                this.$refs.formData.validate(async (valid) => {
                    if (valid) {
                        try {
                            let patientData = this.formData.patientData;
                            let parsedPatientData = JSON.parse(patientData);
                            let AdataPatient = parsedPatientData.data.patientSelectDtos;
                            let patientIn = AdataPatient[0].patientIn;

                            let LS_A10_deviceInfo = {
                                "BED_ID": "ec89a1299d0646b78544659ae419a351",
                                "BED_NAME": patientIn.bedName,
                                "DEPT_ID": patientIn.deptId,
                                "DEPT_KEY": "",
                                "DEPT_NAME": patientIn.deptName,
                                "DEVICE_APP_ID": "34d6dc89a804f7c4",
                                "DEVICE_BRIGHTNESS": 0,
                                "DEVICE_ID": "028a9f1ef5ec481ea893e8434cfa9f93",
                                "DEVICE_NAME": "1",
                                "DEVICE_NUM": "1",
                                "DEVICE_VOLUME": 10,
                                "ROOM_ID": "6bba5f0762ce463d994fc55d8538a44b",
                                "ROOM_NAME": "1",
                                "ROTATE": 0
                            };

                            let LS_patientInfo = {
                                "bedName": patientIn.bedName,
                                "birthday": patientIn.birthday,
                                "doctorName": patientIn.doctorName,
                                "inTime": patientIn.inTime,
                                "inpNo": patientIn.inpNo,
                                "nurseName": patientIn.nurseName,
                                "patientAge": patientIn.patientAge,
                                "patientId": patientIn.patientId,
                                "patientName": patientIn.patientName,
                                "personIdNo": patientIn.personIdNo,
                                "sex": patientIn.sex,
                                "wristband": patientIn.wristband
                            };

                            const requestData = {
                                getDeviceInfosdk: JSON.stringify(LS_A10_deviceInfo),
                                getOrgIdsdk: JSON.stringify({"orgId": patientIn.orgId}),
                                getPatientInfosdk: JSON.stringify(LS_patientInfo)
                            };

                            this.downloadFile(requestData);
                        } catch (error) {
                            this.$message.error('数据解析错误: ' + error.message);
                        }
                    }
                });
            },

            // 提交表单
            submitForm() {
                this.$refs.formData.validate(async (valid) => {
                    if (valid) {
                        try {
                            let patientData = this.formData.patientData;
                            let deviceData = this.formData.deviceData;

                            let parsedPatientData = JSON.parse(patientData);
                            let parsedDeviceData = JSON.parse(deviceData);

                            this.DataPatient = parsedPatientData.data.patientSelectDtos;
                            this.DataDevice = parsedDeviceData.data.list;

                            let deptId1 = this.DataPatient[0].patientIn.deptId;
                            let deptId2 = this.DataDevice[0].deptId;

                            if (deptId1 !== deptId2) {
                                this.$alert('科室不一样', '提示', {
                                    confirmButtonText: '确定',
                                    type: 'warning'
                                });
                                return;
                            }

                            // 收集弹窗需要显示的项目数据
                            this.popupItems = [];
                            for (let i = 0; i < this.DataDevice.length; i++) {
                                let aDevice = this.DataDevice[i];
                                let bedName = aDevice.bedName;

                                let aPat = this.DataPatient.find((item) => {
                                    return item.patientIn.bedName === bedName;
                                });

                                if (!aPat) continue;

                                this.popupItems.push({
                                    bedName: aPat.patientIn.bedName,
                                    patientName: aPat.patientIn.patientName
                                });
                            }

                            // 显示弹窗
                            this.dialogVisible = true;
                            // 清空文本区域
                            this.localStorageText = '';

                        } catch (error) {
                            this.$message.error('数据解析错误: ' + error.message);
                        }
                    }
                });
            },

            // 创建本地存储数据
            createLocalStorage(bedName, type) {
                try {
                    let patientIn = this.DataPatient.find((item) => {
                        return item.patientIn.bedName === bedName;
                    });

                    let deviceInfo = this.DataDevice.find((item) => {
                        return item.bedName === bedName;
                    });

                    if (patientIn && patientIn.patientIn) {
                        patientIn = patientIn.patientIn;
                    } else {
                        this.$alert("patientIn数据不对", '错误', {
                            confirmButtonText: '确定',
                            type: 'error'
                        });
                        return;
                    }

                    if (!deviceInfo || deviceInfo.deviceType !== type) {
                        this.$alert("这个床没有这种设备啊", '错误', {
                            confirmButtonText: '确定',
                            type: 'error'
                        });
                        return;
                    }

                    let LS_A10_deviceInfo = {
                            "BED_ID": deviceInfo.bedId,
                            "BED_NAME": deviceInfo.bedName,
                            "DEPT_ID": deviceInfo.deptId,
                            "DEPT_KEY": "",
                            "DEPT_NAME": deviceInfo.deptName,
                            "DEVICE_APP_ID": deviceInfo.deviceAppId,
                            "DEVICE_BRIGHTNESS": deviceInfo.brighter,
                            "DEVICE_ID": deviceInfo.deviceId,
                            "DEVICE_NAME": deviceInfo.deviceName,
                            "DEVICE_NUM": deviceInfo.deviceNum,
                            "DEVICE_VOLUME": deviceInfo.volume,
                            "ROOM_ID": deviceInfo.roomId,
                            "ROOM_NAME": deviceInfo.roomName,
                            "ROTATE": deviceInfo.rotate
                        },
                        LS_orgId = deviceInfo.orgId,
                        LS_A10_patientInfo = {
                            "bedName": patientIn.bedName,
                            "birthday": patientIn.birthday,
                            "doctorName": patientIn.doctorName,
                            "inTime": patientIn.inTime,
                            "inpNo": patientIn.inpNo,
                            "nurseName": patientIn.nurseName,
                            "patientAge": patientIn.patientAge,
                            "patientId": patientIn.patientId,
                            "patientName": patientIn.patientName,
                            "personIdNo": patientIn.personIdNo,
                            "sex": patientIn.sex,
                            "wristband": patientIn.wristband
                        },
                        LS_A10_accountInfo = {
                            "patientId": patientIn.patientId,
                            "deptId": patientIn.deptId,
                            "orgId": patientIn.orgId
                        },
                        LS_patientData = {
                            "orgId": patientIn.orgId,
                            "patientId": patientIn.patientId,
                            "deptId": patientIn.deptId,
                            "patientName": patientIn.patientName,
                            "roomId": deviceInfo.roomId,
                            "roomName": deviceInfo.roomName,
                            "bedId": deviceInfo.bedId,
                            "bedName": deviceInfo.bedName,
                            "deviceId": deviceInfo.deviceId,
                            "deviceType": deviceInfo.deviceType,
                            "deptName": deviceInfo.deptName,
                            "inpNo": patientIn.inpNo
                        },
                        LS_accessToken = "",
                        LS_patientInfo = {
                            "bedName": patientIn.bedName,
                            "birthday": patientIn.birthday,
                            "doctorName": patientIn.doctorName,
                            "inTime": patientIn.inTime,
                            "inpNo": patientIn.inpNo,
                            "nurseName": patientIn.nurseName,
                            "patientAge": patientIn.patientAge,
                            "patientId": patientIn.patientId,
                            "patientName": patientIn.patientName,
                            "personIdNo": patientIn.personIdNo,
                            "sex": patientIn.sex,
                            "wristband": patientIn.wristband
                        },
                        LS_deviceInfo = LS_A10_deviceInfo,
                        LS_deviceType = type;

                    let DATA_A10_deviceInfo = `localStorage.setItem('A10_deviceInfo','${JSON.stringify(LS_A10_deviceInfo)}');`,
                        DATA_orgId = `localStorage.setItem('orgId','${LS_orgId}');`,
                        DATA_A10_patientInfo = `localStorage.setItem('A10_patientInfo','${JSON.stringify(LS_A10_patientInfo)}');`,
                        DATA_A10_accountInfo = `localStorage.setItem('A10_accountInfo','${JSON.stringify(LS_A10_accountInfo)}');`,
                        DATA_patientData = `localStorage.setItem('patientData','${JSON.stringify(LS_patientData)}');`,
                        DATA_accessToken = `localStorage.setItem('accessToken','${LS_accessToken}');`,
                        DATA_patientInfo = `localStorage.setItem('patientInfo','${JSON.stringify(LS_patientInfo)}');`,
                        DATA_deviceInfo = `localStorage.setItem('deviceInfo','${JSON.stringify(LS_deviceInfo)}');`,
                        DATA_deviceType = "localStorage.setItem('deviceType','" + LS_deviceType + "');";

                    const localStorageText = DATA_A10_deviceInfo + DATA_orgId + DATA_A10_patientInfo +
                        DATA_A10_accountInfo + DATA_patientData + DATA_accessToken +
                        DATA_patientInfo + DATA_deviceInfo + DATA_deviceType;

                    // 设置文本区域内容
                    document.getElementById('localStorage-text').value = localStorageText;

                    // 复制到剪贴板
                    setTimeout(() => {
                        this.copyToClipboard('localStorage-text');
                        this.$message.success('已复制到剪贴板！');
                    }, 100);

                    const requestData = {
                        getDeviceInfosdk: JSON.stringify(LS_A10_deviceInfo),
                        getOrgIdsdk: JSON.stringify({"orgId": patientIn.orgId}),
                        getPatientInfosdk: JSON.stringify(LS_patientInfo)
                    };

                    this.downloadFile(requestData);
                } catch (error) {
                    console.log(error)
                    Vue.prototype.$alert('处理数据时出错: ' + (error.message), '错误', {
                        confirmButtonText: '确定',
                        type: 'error'
                    });
                }
            },

            // 复制到剪贴板
            copyToClipboard(id) {
                const element = document.getElementById(id);
                if (element) {
                    element.select();
                    document.execCommand('Copy');
                }
            },

            // 下载文件
            downloadFile(requestData) {
                axios({
                    url: ajaxFileDealJavaIP + '/yh-mock/create-files',
                    method: 'post',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    data: requestData,
                    responseType: 'blob'
                })
                    .then(response => {
                        const blob = response.data;
                        const headers = response.headers;

                        const contentDisposition = headers['content-disposition'];
                        let filename = "mock.zip";

                        if (contentDisposition && contentDisposition.indexOf("filename=") !== -1) {
                            filename = decodeURIComponent(contentDisposition.split("filename=")[1]);
                        }

                        // 兼容性处理
                        if (window.navigator && window.navigator.msSaveOrOpenBlob) {
                            // 适配 IE / Edge
                            window.navigator.msSaveOrOpenBlob(blob, filename);
                        } else {
                            const url = (window.URL || window.webkitURL).createObjectURL(blob);
                            const a = document.createElement("a");
                            a.href = url;
                            a.download = filename;
                            document.body.appendChild(a);
                            a.click();
                            a.remove();
                            (window.URL || window.webkitURL).revokeObjectURL(url);
                        }

                        this.$message.success("下载成功");
                    })
                    .catch(error => {
                        console.error('下载失败：', error);
                        this.$message.error("下载失败");
                    });
            }
        }
    });
</script>
</body>
</html>
