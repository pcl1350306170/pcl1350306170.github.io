<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>小工具</title>
    <style>
        .container {
            width: 90%;
            margin: 5vh auto;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .tool-button {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            white-space: normal;
            word-wrap: break-word;
            padding: 8px;
        }

        .form-item {
            margin-bottom: 20px;
        }

        .dialog-content {
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 10px;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 18px;
            color: #333;
        }
        .tool-button{
            height: 8vh !important;
        }
        .tool-button span{
            white-space: normal;
            width: 100%;
            display: inline-block;
            line-height: 1.2;
        }
    </style>
</head>
<body>
<div id="app" class="container">
    <el-row>
        <el-col :span="24">
            <h1>小工具集合</h1>
            <div class="tools-grid">
                <!-- 工具按钮列表 -->
                <el-button
                        v-for="tool in tools"
                        :key="tool.id"
                        class="tool-button"
                        type="primary"
                        @click="openToolDialog(tool.id)">
                    {{ tool.name }}
                </el-button>
            </div>
        </el-col>
    </el-row>

    <!-- 工具弹窗 -->
    <el-dialog
            :title="currentTool.name"
            :visible.sync="dialogVisible"
            :width="dialogWidth"
            :before-close="handleClose">
        <div class="dialog-content">
            <template v-if="currentTool.id === 'editFile'">
                <h2>页面说明：用来重命名文件，根据输入的文件名关键字替换</h2>
                <el-form ref="editFileForm" :model="editFileForm" label-width="120px">
                    <el-form-item label="文件目录" prop="field_path" required>
                        <el-input v-model="editFileForm.field_path" placeholder="请输入文件目录"></el-input>
                    </el-form-item>
                    <el-form-item label="文件名替换关键字" prop="field_titlegjz" required>
                        <el-input v-model="editFileForm.field_titlegjz" placeholder="请输入文件名替换关键字"></el-input>
                    </el-form-item>
                    <el-form-item label="文件名替换内容" prop="field_titletogjz">
                        <el-input v-model="editFileForm.field_titletogjz" placeholder="请输入文件名替换内容"></el-input>
                    </el-form-item>
                </el-form>
            </template>

            <template v-if="currentTool.id === 'Resolution'">
                <h2>页面说明：根据分辨率删除不符合要求的壁纸</h2>
                <el-form ref="resolutionForm" :model="resolutionForm" label-width="120px">
                    <el-form-item label="文件目录" prop="field_path" required>
                        <el-input v-model="resolutionForm.field_path" placeholder="请输入文件目录"></el-input>
                    </el-form-item>
                    <el-form-item label="宽" prop="field_width" required>
                        <el-input v-model="resolutionForm.field_width" placeholder="请输入壁纸限制宽度"
                                  value="1920"></el-input>
                    </el-form-item>
                    <el-form-item label="高" prop="field_height" required>
                        <el-input v-model="resolutionForm.field_height" placeholder="请输入壁纸限制高度"
                                  value="1080"></el-input>
                    </el-form-item>
                </el-form>
            </template>

            <template v-if="currentTool.id === 'getImageAndCut'">
                <h2>页面说明：获取指定目录下的所有图片，根据最早的时间重命名，并移动到指定目录</h2>
                <el-form ref="imageCutForm" :model="imageCutForm" label-width="120px">
                    <el-form-item label="图片文件目录" prop="field_imgpath" required>
                        <el-input v-model="imageCutForm.field_imgpath" placeholder="图片文件目录"></el-input>
                    </el-form-item>
                    <el-form-item label="文件保存目录" prop="field_savepath" required>
                        <el-input v-model="imageCutForm.field_savepath" placeholder="文件保存目录"></el-input>
                    </el-form-item>
                </el-form>
            </template>

            <template v-if="currentTool.id === 'pptx_merge_pdf'">
                <h2>页面说明：遍历文件目录下面的所有“.pptx”文件，将他们合并然后转为pdf文件，下载到文件下载目录里面</h2>
                <el-form ref="pptxForm" :model="pptxForm" label-width="120px">
                    <el-form-item label="文件目录" prop="sourceDir" required>
                        <el-input v-model="pptxForm.sourceDir" placeholder="文件目录"></el-input>
                    </el-form-item>
                    <el-form-item label="下载目录" prop="outputDir" required>
                        <el-input v-model="pptxForm.outputDir" placeholder="下载目录"></el-input>
                    </el-form-item>
                </el-form>
            </template>

            <template v-if="currentTool.id === 'getFileAndCut'">
                <h2>页面说明：获取指定目录下的所有文件，并移动到指定目录</h2>
                <el-form ref="fileCutForm" :model="fileCutForm" label-width="120px">
                    <el-form-item label="文件目录" prop="field_imgpath" required>
                        <el-input v-model="fileCutForm.field_imgpath" placeholder="文件目录"></el-input>
                    </el-form-item>
                    <el-form-item label="文件保存目录" prop="field_savepath" required>
                        <el-input v-model="fileCutForm.field_savepath" placeholder="文件保存目录"></el-input>
                    </el-form-item>
                </el-form>
            </template>

            <template v-if="currentTool.id === 'txtHebing'">
                <h2>页面说明：抽出所有txt合并为1个文件</h2>
                <el-form ref="txtHebingForm" :model="txtHebingForm" label-width="120px">
                    <el-form-item label="文件目录" prop="field_filepath" required>
                        <el-input v-model="txtHebingForm.field_filepath" placeholder="请输入文件目录"></el-input>
                    </el-form-item>
                    <el-form-item label="输出目录" prop="field_filesavepath" required>
                        <el-input v-model="txtHebingForm.field_filesavepath"
                                  placeholder="请输入文件输出目录"></el-input>
                    </el-form-item>
                    <el-form-item label="文件名" prop="field_filesavename" required>
                        <el-input v-model="txtHebingForm.field_filesavename" placeholder="请输入文件名"></el-input>
                    </el-form-item>
                    <el-form-item label="筛选关键字" prop="field_titleGJZ">
                        <el-input v-model="txtHebingForm.field_titleGJZ" placeholder="请输入关键字"></el-input>
                    </el-form-item>
                </el-form>
            </template>

            <template v-if="currentTool.id === 'suffixImg'">
                <h2>页面说明：没有后缀名的图片批量修改图片的后缀名</h2>
                <el-form ref="suffixImgForm" :model="suffixImgForm" label-width="120px">
                    <el-form-item label="文件目录" prop="field_path" required>
                        <el-input v-model="suffixImgForm.field_path" placeholder="请输入文件目录"></el-input>
                    </el-form-item>
                    <el-form-item label="后缀名" prop="field_suffix" required>
                        <el-input v-model="suffixImgForm.field_suffix" placeholder="请输入后缀名"
                                  value="jpg"></el-input>
                    </el-form-item>
                </el-form>
            </template>

            <template v-if="currentTool.id === 'substrTextPath'">
                <h2>页面说明：小说字符替换 <br> 要替换的txt文件的全路径，将读取表中保存的替换字段进行文本替换</h2>
                <el-form ref="substrTextPathForm" :model="substrTextPathForm" label-width="120px">
                    <el-form-item label="小说路径" prop="field_textPath" required>
                        <el-input v-model="substrTextPathForm.field_textPath" placeholder="请输入小说路径"></el-input>
                    </el-form-item>
                </el-form>
            </template>

            <template v-if="currentTool.id === 'getAllContent'">
                <h2>页面说明：获取目录下的所有文件</h2>
                <el-form ref="getAllContentForm" :model="getAllContentForm" label-width="120px">
                    <el-form-item label="路径" prop="field_Path" required>
                        <el-input v-model="getAllContentForm.field_Path" placeholder="请输入路径"
                                  value="D:\\dataa\\txt"></el-input>
                    </el-form-item>
                </el-form>
            </template>

            <template v-if="currentTool.id === 'renameAllContent'">
                <h2>页面说明：获取目录下的所有文件，并按照规则重命名，比如过滤数字，章节，作者等</h2>
                <el-form ref="renameAllContentForm" :model="renameAllContentForm" label-width="120px">
                    <el-form-item label="路径" prop="field_Path" required>
                        <el-input v-model="renameAllContentForm.field_Path" placeholder="请输入路径"
                                  value="D:\\dataa\\txt"></el-input>
                    </el-form-item>
                </el-form>
            </template>

            <template v-if="currentTool.id === 'simpleCrawler'">
                <h2>页面说明：爬取某个地址下的网页内容 <br>查看爬取到的数据接口：http://localhost:28019/opex-crawler/web-content/list?pageNumber=1&pageSize=10
                </h2>
                <el-form ref="simpleCrawlerForm" :model="simpleCrawlerForm" label-width="120px">
                    <el-form-item label="网址" prop="field_Path" required>
                        <el-input v-model="simpleCrawlerForm.field_Path" placeholder="请输入"
                                  value="https://wiki.biligame.com/yanyu/蚊子腿"></el-input>
                    </el-form-item>
                </el-form>
            </template>

            <template v-if="currentTool.id === 'simpleCrawler2'">
                <h2>页面说明：默认爬取某个地址下的网页内容,需要改代码的</h2>
                <el-form ref="simpleCrawler2Form" :model="simpleCrawler2Form" label-width="120px">
                    <el-form-item label="网址" prop="field_Path" required>
                        <el-input v-model="simpleCrawler2Form.field_Path" placeholder="请输入"
                                  value="https://wiki.biligame.com/yanyu/蚊子腿"></el-input>
                    </el-form-item>
                </el-form>
            </template>

            <template v-if="currentTool.id === 'movefiles'">
                <h2>
                    页面说明：a路径下的所有文件，包括子目录下的文件，都移动到b目录下，可以根据关键字筛选，包含这个字符的移动过去！</h2>
                <el-form ref="movefilesForm" :model="movefilesForm" label-width="120px">
                    <el-form-item label="原路径" prop="aPath" required>
                        <el-input v-model="movefilesForm.aPath" placeholder="请输入"
                                  value="A:\\NOVEL\\98T\\98T2022"></el-input>
                    </el-form-item>
                    <el-form-item label="目标路径" prop="bPath" required>
                        <el-input v-model="movefilesForm.bPath" placeholder="请输入" value="A:\\NOVEL\\KF"></el-input>
                    </el-form-item>
                    <el-form-item label="移动关键字" prop="keyword">
                        <el-input v-model="movefilesForm.keyword" placeholder="请输入"></el-input>
                    </el-form-item>
                </el-form>
            </template>

            <template v-if="currentTool.id === 'deletefiles'">
                <h2>页面说明：a路径下的所有文件，根据后缀名去重并删除【.pdf】</h2>
                <el-form ref="deletefilesForm" :model="deletefilesForm" label-width="120px">
                    <el-form-item label="路径" prop="directoryPath" required>
                        <el-input v-model="deletefilesForm.directoryPath" placeholder="请输入"
                                  value="D:\\dataa\\ceshi\\a"></el-input>
                    </el-form-item>
                    <el-form-item label="后缀名" prop="fileExtension" required>
                        <el-input v-model="deletefilesForm.fileExtension" placeholder="请输入" value=".pdf"></el-input>
                    </el-form-item>
                </el-form>
            </template>

            <template v-if="currentTool.id === 'deletefilesdedup'">
                <h2>页面说明：a路径下的所有文件，一些规则去重【判断文件名是否重复，这里的“重复”不是严格完全相等，而是
                    文件名可能存在数字章节差异或少量标点差异。对重复的文件，保留最大的文件（根据文件大小），删除其他的，并记录删除的文件。】</h2>
                <el-form ref="deletefilesdedupForm" :model="deletefilesdedupForm" label-width="120px">
                    <el-form-item label="路径" prop="directoryPath" required>
                        <el-input v-model="deletefilesdedupForm.directoryPath" placeholder="请输入"
                                  value="D:\\dataa\\ceshi\\a"></el-input>
                    </el-form-item>
                </el-form>
            </template>

            <template v-if="currentTool.id === 'mergefiles'">
                <h2>页面说明：路径下的所有文件以及子文件【txt格式】，过滤合并成为一个新的txt文件</h2>
                <el-form ref="mergefilesForm" :model="mergefilesForm" label-width="120px">
                    <el-form-item label="全文件路径" prop="allFileDirPath" required>
                        <el-input v-model="mergefilesForm.allFileDirPath" placeholder="请输入"></el-input>
                    </el-form-item>
                    <el-form-item label="合并数量" prop="hbNumber" required>
                        <el-input v-model="mergefilesForm.hbNumber" placeholder="请输入"></el-input>
                    </el-form-item>
                    <el-form-item label="路径" prop="directoryPath" required>
                        <el-input v-model="mergefilesForm.directoryPath" placeholder="请输入"></el-input>
                    </el-form-item>
                    <el-form-item label="生成的文件" prop="outputFilePath" required>
                        <el-input v-model="mergefilesForm.outputFilePath" placeholder="请输入"></el-input>
                    </el-form-item>
                </el-form>
            </template>

            <template v-if="currentTool.id === 'mergefilesToEpub'">
                <h2>
                    页面说明：路径下的所有文件【txt格式】，合并成为一个epub文件，2025年8月15日现在问题是能转化成功，但是无法上传微信读书，超大文件不能转</h2>
                <el-form ref="mergefilesToEpubForm" :model="mergefilesToEpubForm" label-width="120px">
                    <el-form-item label="txt目录" prop="txtDir" required>
                        <el-input v-model="mergefilesToEpubForm.txtDir" placeholder="请输入"
                                  value="D:\\dataa\\txt"></el-input>
                    </el-form-item>
                    <el-form-item label="封面图片路径" prop="coverImagePath" required>
                        <el-input v-model="mergefilesToEpubForm.coverImagePath" placeholder="请输入"
                                  value="F:\\竖屏壁纸绝美\\a 015 (1).jpg"></el-input>
                    </el-form-item>
                    <el-form-item label="输出的文件路径" prop="outputDir" required>
                        <el-input v-model="mergefilesToEpubForm.outputDir" placeholder="请输入"
                                  value="D:\\dataa\\epub"></el-input>
                    </el-form-item>
                    <el-form-item label="生成的文件文件名" prop="outputFileName" required>
                        <el-input v-model="mergefilesToEpubForm.outputFileName" placeholder="请输入"
                                  value="HQ.epub"></el-input>
                    </el-form-item>
                </el-form>
            </template>

            <template v-if="currentTool.id === 'mergeTxt'">
                <h2>页面说明：将某个txt文件合并到目标txt。<br>使用方式：确定追加的章节，要合并的文件所在路径，要合并的文件名称，不需要后缀，合并后的文件全路径
                </h2>
                <el-form ref="mergeTxtForm" :model="mergeTxtForm" label-width="120px">
                    <el-form-item label="章节" prop="field_zj" required>
                        <el-input v-model="mergeTxtForm.field_zj" placeholder="请输入章节"></el-input>
                    </el-form-item>
                    <el-form-item label="合并路径" prop="field_merPath" required>
                        <el-input v-model="mergeTxtForm.field_merPath" placeholder="请输入合并路径"></el-input>
                    </el-form-item>
                    <el-form-item label="合并名称" prop="field_merName" required>
                        <el-input v-model="mergeTxtForm.field_merName" placeholder="请输入合并名称"></el-input>
                    </el-form-item>
                    <el-form-item label="目标路径" prop="field_tarPath" required>
                        <el-input v-model="mergeTxtForm.field_tarPath" placeholder="请输入目标路径"></el-input>
                    </el-form-item>
                </el-form>
            </template>
        </div>

        <div slot="footer" class="dialog-footer">
            <el-button @click="dialogVisible = false">取消</el-button>
            <el-button type="primary" @click="submitForm">确定</el-button>
        </div>
    </el-dialog>
</div>
<!-- 引入Vue -->
<script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<!-- 引入Element UI -->
<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">

<script src="https://unpkg.com/element-ui/lib/index.js"></script>
<script src="../../js/_variable.js" type="text/javascript"></script>
<script src="../../js/popup.js" type="text/javascript"></script>
<script src="../Resources/js/common2.js" type="text/javascript"></script>
<script src="./js/file-operation-modal.js" type="text/javascript"></script>
<script>

    // 验证组件是否加载成功
    if (window.FileOperationModal) {
        console.log('文件操作弹窗组件加载成功');
    } else {
        console.error('文件操作弹窗组件加载失败，请检查脚本路径');
    }

    new Vue({
        el: '#app',
        data() {
            return {
                // 工具列表
                tools: [
                    {id: 'editFile', name: '重命名文件'},
                    {id: 'Resolution', name: '根据分辨率删除不符合要求的壁纸'},
                    {id: 'getImageAndCut', name: '获取指定目录下的所有图片，根据最早的时间重命名，并移动到指定目录'},
                    {id: 'getFileAndCut', name: '获取指定目录下的所有文件，并移动到指定目录'},
                    {id: 'txtHebing', name: '抽出所有txt合并为1个文件'},
                    {id: 'suffixImg', name: '批量修改图片的后缀名'},
                    {id: 'substrTextPath', name: '小说字符替换'},
                    {id: 'mergeTxt', name: '合并txt文档'},
                    {id: 'getAllContent', name: '获取目录下的所有文件'},
                    {id: 'renameAllContent', name: '重命名目录下文件【子】'},
                    {id: 'simpleCrawler', name: '根据网址爬取网页内容'},
                    {id: 'simpleCrawler2', name: '默认爬取网页内容'},
                    {id: 'movefiles', name: '移动文件'},
                    {id: 'deletefiles', name: '文件去重【后缀】'},
                    {id: 'deletefilesdedup', name: '文件去重【逻辑判断】'},
                    {id: 'mergefiles', name: '文件合并Main'},
                    {id: 'mergefilesToEpub', name: '目录下的txt合并为epub'},
                    {id: 'pptx_merge_pdf', name: 'pptx合并并转pdf'}
                ],

                // 弹窗状态
                dialogVisible: false,
                currentTool: {},
                dialogWidth: '60%',

                // 各个工具的表单数据
                editFileForm: {
                    field_path: '',
                    field_titlegjz: '',
                    field_titletogjz: ''
                },

                resolutionForm: {
                    field_path: '',
                    field_width: 1920,
                    field_height: 1080
                },

                imageCutForm: {
                    field_imgpath: '',
                    field_savepath: ''
                },

                pptxForm: {
                    sourceDir: '',
                    outputDir: ''
                },

                fileCutForm: {
                    field_imgpath: '',
                    field_savepath: ''
                },

                txtHebingForm: {
                    field_filepath: '',
                    field_filesavepath: '',
                    field_filesavename: '',
                    field_titleGJZ: ''
                },

                suffixImgForm: {
                    field_path: '',
                    field_suffix: 'jpg'
                },

                substrTextPathForm: {
                    field_textPath: ''
                },

                getAllContentForm: {
                    field_Path: 'D:\\dataa\\txt'
                },

                renameAllContentForm: {
                    field_Path: 'D:\\dataa\\txt'
                },

                simpleCrawlerForm: {
                    field_Path: 'https://wiki.biligame.com/yanyu/蚊子腿'
                },

                simpleCrawler2Form: {
                    field_Path: 'https://wiki.biligame.com/yanyu/蚊子腿'
                },

                movefilesForm: {
                    aPath: 'A:\\NOVEL\\98T\\98T2022',
                    bPath: 'A:\\NOVEL\\KF',
                    keyword: ''
                },

                deletefilesForm: {
                    directoryPath: 'D:\\dataa\\ceshi\\a',
                    fileExtension: '.pdf'
                },

                deletefilesdedupForm: {
                    directoryPath: 'D:\\dataa\\ceshi\\a'
                },

                mergefilesForm: {
                    allFileDirPath: 'A:\\NOVEL\\98T\\98T大于5M',
                    hbNumber: 3,
                    directoryPath: 'F:\\book\\txt',
                    outputFilePath: 'F:\\book\\合并'
                },

                mergefilesToEpubForm: {
                    txtDir: 'D:\\dataa\\txt',
                    coverImagePath: 'F:\\竖屏壁纸绝美\\a 015 (1).jpg',
                    outputDir: 'D:\\dataa\\epub',
                    outputFileName: 'HQ.epub'
                },

                mergeTxtForm: {
                    field_zj: '',
                    field_merPath: '',
                    field_merName: '',
                    field_tarPath: ''
                }
            };
        },
        methods: {
            // 打开工具弹窗
            openToolDialog(toolId) {
                this.currentTool = this.tools.find(tool => tool.id === toolId);
                this.dialogVisible = true;

                // 根据工具类型调整弹窗宽度
                if (['deletefilesdedup', 'mergefilesToEpub'].includes(toolId)) {
                    this.dialogWidth = '70%';
                } else {
                    this.dialogWidth = '60%';
                }
            },

            // 关闭弹窗时重置表单
            handleClose() {
                const formName = this.currentTool.id + 'Form';
                if (this.$refs[formName]) {
                    this.$refs[formName].resetFields();
                }
            },

            // 提交表单
            submitForm() {
                const toolId = this.currentTool.id;
                const formName = toolId + 'Form';
                const formData = this[formName];

                // 调用对应的处理函数
                switch (toolId) {
                    case "editFile":
                        this.handleAction(formData, 'fileEdit');
                        break;
                    case "Resolution":
                        this.handleAction(formData, 'fileDelImage');
                        break;
                    case "getImageAndCut":
                        this.handleAction(formData, 'getAllImages');
                        break;
                    case "pptx_merge_pdf":
                        this.handleAction(formData, 'pptxToPDF');
                        break;
                    case "getFileAndCut":
                        this.handleAction(formData, 'getAllFiles');
                        break;

                    case "substrTextPath":

                    case "getAllContent":

                    case "renameAllContent":

                    case "mergeTxt":

                    case "movefiles":

                }
            },

            // 处理工具操作
            handleAction(formData, actionName) {
                // 这里可以添加表单验证逻辑
                if (typeof CommonFun !== 'undefined' && typeof CommonFun[actionName] === 'function') {
                    console.log()
                    CommonFun[actionName](formData);
                    this.$message.success('操作已执行');
                    //this.dialogVisible = false;
                } else {
                    this.$message.error('未找到对应的处理函数: ' + actionName);
                }
            }
        }
    });
