<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://raw.githubusercontent.com/pcl1350306170/test-data-backup/refs/heads/main/img/T/头像-蒂法高清-grf6fb.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线图片管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e; color: #e0e0e0; min-height: 100vh;
        }
        h1 { text-align: center; color: #c084fc; margin-bottom: 8px; font-size: 28px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 14px; }
        /* 操作栏 */
        .action-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
        .action-btn {
            padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer;
            font-size: 13px; color: #fff; transition: background .2s;
        }
        .action-btn.import { background: #0ea5e9; }
        .action-btn.import:hover { background: #0284c7; }
        .action-btn.refresh { background: #22c55e; }
        .action-btn.refresh:hover { background: #16a34a; }
        /* 进度条 */
        .progress-section { margin: 0 auto 20px; max-width: 600px; display: none; }
        .progress-section.active { display: block; }
        .progress-bar-wrap {
            background: #16213e; border-radius: 8px; height: 20px; overflow: hidden;
            border: 1px solid #1f3056; margin-bottom: 8px;
        }
        .progress-bar {
            height: 100%; background: linear-gradient(90deg, #7c3aed, #0ea5e9);
            border-radius: 8px; transition: width .3s; width: 0%;
        }
        .progress-text { text-align: center; font-size: 13px; color: #94a3b8; }
        /* dataType 显示 */
        .datatype-bar {
            text-align: center; margin-bottom: 20px; padding: 10px 16px;
            background: #16213e; border: 1px solid #1f3056; border-radius: 8px;
            font-size: 13px; color: #a78bfa; word-break: break-all;
        }
        .datatype-bar span { color: #e2e8f0; font-weight: 600; }
        /* 相册网格 */
        .gallery {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px; padding: 0 20px 40px;
        }
        .gallery-card {
            background: #16213e; border: 1px solid #1f3056; border-radius: 10px;
            overflow: hidden; transition: border-color .2s, transform .2s;
        }
        .gallery-card:hover { border-color: #7c3aed; transform: translateY(-2px); }
        .card-img-wrap {
            width: 100%; aspect-ratio: 16/10; overflow: hidden; position: relative;
            background: #0f172a; cursor: pointer;
        }
        .card-img-wrap.portrait {
            aspect-ratio: 9/14;
        }
        .card-img-wrap img {
            width: 100%; height: 100%; object-fit: cover; transition: transform .3s;
        }
        .card-img-wrap.portrait img {
            object-fit: contain;
        }
        .card-img-wrap .orient-badge {
            position: absolute; top: 6px; right: 6px; z-index: 2;
            font-size: 11px; padding: 2px 8px; border-radius: 4px;
            color: #fff; pointer-events: none;
        }
        .orient-badge.landscape { background: rgba(14,165,233,.8); }
        .orient-badge.portrait { background: rgba(245,158,11,.8); }
        /* 分组标题 */
        .section-header {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 20px; margin-bottom: 4px;
        }
        .section-header .section-title {
            font-size: 18px; font-weight: 600;
        }
        .section-header .section-title.landscape { color: #0ea5e9; }
        .section-header .section-title.portrait { color: #f59e0b; }
        .section-header .section-count {
            font-size: 13px; color: #64748b;
        }
        .gallery-card:hover .card-img-wrap img { transform: scale(1.05); }
        .card-img-wrap .img-loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #64748b; font-size: 13px;
        }
        .card-img-wrap .img-error {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #ef4444; font-size: 13px; text-align: center;
        }
        .card-body { padding: 12px 14px; }
        .card-url {
            font-size: 12px; color: #94a3b8; line-height: 1.5; word-break: break-all;
            margin-bottom: 10px; max-height: 54px; overflow: hidden;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }
        .card-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .card-btn {
            padding: 5px 12px; border: none; border-radius: 5px; cursor: pointer;
            font-size: 12px; color: #fff; transition: background .2s; white-space: nowrap;
        }
        .card-btn.copy { background: #7c3aed; }
        .card-btn.copy:hover { background: #6d28d9; }
        .card-btn.copy.copied { background: #22c55e; }
        .card-btn.edit { background: #0ea5e9; }
        .card-btn.edit:hover { background: #0284c7; }
        .card-btn.del { background: #ef4444; }
        .card-btn.del:hover { background: #dc2626; }
        .card-btn.view { background: #f59e0b; }
        .card-btn.view:hover { background: #d97706; }
        /* 空状态 */
        .empty-state { text-align: center; color: #64748b; padding: 60px 20px; }
        .empty-state p { margin-bottom: 16px; font-size: 16px; }
        /* 统计 */
        .stats { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 16px; }
        /* 模态框 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,.6); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #1e293b; border: 1px solid #334155; border-radius: 12px;
            padding: 24px; width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto;
        }
        .modal h3 { color: #c084fc; margin-bottom: 16px; font-size: 18px; }
        .modal label { display: block; color: #a78bfa; font-size: 13px; margin-bottom: 4px; margin-top: 12px; }
        .modal input, .modal textarea {
            width: 100%; padding: 8px 12px; background: #16213e; border: 1px solid #1f3056;
            border-radius: 6px; color: #e2e8f0; font-size: 14px; outline: none; font-family: inherit;
        }
        .modal input:focus, .modal textarea:focus { border-color: #7c3aed; }
        .modal textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
        .modal-btn {
            padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer;
            font-size: 13px; color: #fff; transition: background .2s;
        }
        .modal-btn.confirm { background: #7c3aed; }
        .modal-btn.confirm:hover { background: #6d28d9; }
        .modal-btn.cancel { background: #475569; }
        .modal-btn.cancel:hover { background: #334155; }
        .modal-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .modal .hint { font-size: 12px; color: #64748b; margin-top: 6px; line-height: 1.5; }
        /* 图片预览大图 */
        .preview-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,.85); z-index: 2000; justify-content: center; align-items: center;
            cursor: zoom-out;
        }
        .preview-overlay.active { display: flex; }
        .preview-overlay img {
            max-width: 95vw; max-height: 95vh; object-fit: contain; border-radius: 8px;
        }
        #loading { text-align: center; color: #888; padding: 60px 0; font-size: 16px; }
        .scroll-sentinel { height: 1px; }
        .load-more-tip { text-align: center; color: #64748b; padding: 20px; font-size: 13px; }
        @media (max-width: 768px) {
            .gallery { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); padding: 0 10px 40px; }
        }
    </style>
    <script src="../../lib/vue/axios.min.js"></script>
    <script src="../../js/_variable.js" type="text/javascript"></script>
    <script src="../../js/GeneralDataApi.js"></script>
</head>
<body>
    <h1>在线图片管理</h1>
    <p class="subtitle">导入远程图片地址，自动获取并压缩为 base64 保存，支持相册浏览与管理</p>

    <div class="datatype-bar" id="datatypeBar" style="display:none;">
        dataType：<span id="datatypeValue"></span>
    </div>

    <div class="action-bar">
        <button class="action-btn import" onclick="showImportModal()">导入图片地址</button>
        <button class="action-btn refresh" onclick="loadAllImages()">刷新列表</button>
    </div>

    <div class="progress-section" id="progressSection">
        <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
        <div class="progress-text" id="progressText">准备中...</div>
    </div>

    <div class="stats" id="statsInfo"></div>
    <div id="container"><div id="loading">正在加载数据...</div></div>

    <!-- 图片预览 -->
    <div class="preview-overlay" id="previewOverlay" onclick="this.classList.remove('active')">
        <img id="previewImg" src="" alt="预览">
    </div>

    <!-- 模态框 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <script>
        // ========== 常量与状态 ==========
        const GDA = GeneralDataApi;
        let currentDataType = 'cdn-jsdelivr-net-gh-pcl1350306170';
        let imageList = []; // [{ id, dataKey(url), dataContent(base64) }] — 当前页数据
        const PAGE_LIMIT = 20;
        let currentPage = 1;
        let totalRecords = 0;
        let isLoadingPage = false;
        let loadedDataKeys = new Set(); // 跨页去重集合

        // ========== 工具函数 ==========
        function escapeHtml(str) {
            const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
        }

        /**
         * 从图片 URL 推导 dataType
         * 例：https://raw.githubusercontent.com/pcl1350306170/test-data-backup/refs/heads/main/img/...
         *   → raw.githubusercontent.com-pcl1350306170-test-data-backup
         * 规则：域名各段 + 路径前两段（通常为 用户名/仓库名）
         */
        function deriveDataType(url) {
            try {
                const u = new URL(url);
                const hostParts = u.hostname.split('.');
                const pathParts = u.pathname.split('/').filter(Boolean);
                // 取路径前两段（如 pcl1350306170/test-data-backup）
                const pathPrefix = pathParts.slice(0, Math.min(2, pathParts.length));
                const all = [...hostParts, ...pathPrefix];
                return all.join('-');
            } catch (e) {
                return 'image_gallery';
            }
        }

        /**
         * 获取远程图片并压缩为 base64
         * 超过 1MB 的图片自动压缩，逐步降低质量
         */
        function fetchImageAsBase64(url, maxWidth = 1920, quality = 0.85) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = function () {
                    let w = img.naturalWidth, h = img.naturalHeight;
                    // 如果宽度超过限制，等比缩放
                    if (w > maxWidth) {
                        h = Math.round(h * maxWidth / w);
                        w = maxWidth;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    // 先尝试较高质量
                    let base64 = canvas.toDataURL('image/jpeg', quality);
                    // 超过 1MB 则逐步降低质量压缩
                    const SIZE_LIMIT = 1; // 1MB
                    let sizeMB = base64.length * 0.75 / 1024 / 1024;
                    if (sizeMB > SIZE_LIMIT) {
                        base64 = canvas.toDataURL('image/jpeg', 0.6);
                        sizeMB = base64.length * 0.75 / 1024 / 1024;
                    }
                    if (sizeMB > SIZE_LIMIT) {
                        base64 = canvas.toDataURL('image/jpeg', 0.4);
                        sizeMB = base64.length * 0.75 / 1024 / 1024;
                    }
                    if (sizeMB > SIZE_LIMIT) {
                        base64 = canvas.toDataURL('image/jpeg', 0.2);
                    }
                    resolve(base64);
                };
                img.onerror = function () { reject(new Error('图片加载失败: ' + url)); };
                // 加时间戳防缓存
                img.src = url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
            });
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
            document.body.appendChild(ta);
            ta.focus(); ta.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch(e) {}
            document.body.removeChild(ta);
            return ok;
        }

        function copyText(text, btn) {
            const onSuccess = () => {
                btn.textContent = '已复制 ✓'; btn.classList.add('copied');
                setTimeout(() => { btn.textContent = '复制地址'; btn.classList.remove('copied'); }, 1500);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(onSuccess).catch(() => {
                    if (fallbackCopy(text)) onSuccess(); else alert('复制失败，请手动复制');
                });
            } else {
                if (fallbackCopy(text)) onSuccess(); else alert('复制失败，请手动复制');
            }
        }

        // ========== 模态框 ==========
        function openModal(html) {
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modalOverlay').classList.add('active');
        }
        function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ========== 导入图片 ==========
        function showImportModal() {
            const defaultDT = currentDataType || '';
            openModal(
                '<h3>导入图片地址</h3>' +
                '<label>图片地址列表（每行一个 URL）：</label>' +
                '<textarea id="importUrls" rows="10" placeholder="粘贴图片地址，每行一个&#10;例如：&#10;https://raw.githubusercontent.com/xxx/img1.png&#10;https://raw.githubusercontent.com/xxx/img2.jpg"></textarea>' +
                '<div class="hint">系统会自动获取远程图片并压缩为 base64 格式保存。超过 10MB 的图片会自动压缩。</div>' +
                '<label>dataType（数据分类，留空则自动从 URL 推导）：</label>' +
                '<input id="importDataType" value="' + escapeHtml(defaultDT) + '" placeholder="留空自动推导">' +
                '<div class="modal-actions">' +
                '<button class="modal-btn cancel" onclick="closeModal()">取消</button>' +
                '<button class="modal-btn confirm" id="importBtn" onclick="doImport()">开始导入</button>' +
                '</div>'
            );
        }

        /**
         * 带重试的单条保存
         */
        async function saveWithRetry(item, maxRetries = 2) {
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    await GDA.save(item);
                    return true;
                } catch (e) {
                    console.warn('保存失败(第' + attempt + '次):', item.dataKey, e.message);
                    if (attempt < maxRetries) {
                        await new Promise(r => setTimeout(r, 1000 * attempt)); // 递增等待
                    }
                }
            }
            return false;
        }

        async function doImport() {
            const urlsText = document.getElementById('importUrls').value.trim();
            if (!urlsText) { alert('请粘贴图片地址'); return; }
            let urls = urlsText.split('\n').map(u => u.trim()).filter(u => u && u.startsWith('http'));
            if (urls.length === 0) { alert('未找到有效的图片地址'); return; }

            // 1. 输入列表内部去重
            const beforeDedup = urls.length;
            urls = [...new Set(urls)];
            const inputDupCount = beforeDedup - urls.length;

            // 2. 与已保存数据去重（对比 dataKey）
            let existingDupCount = 0;
            if (imageList.length > 0) {
                const existingKeys = new Set(imageList.map(d => d.dataKey));
                const filtered = urls.filter(u => !existingKeys.has(u));
                existingDupCount = urls.length - filtered.length;
                urls = filtered;
            }

            if (urls.length === 0) {
                let msg = '所有地址均已跳过';
                if (inputDupCount > 0) msg += '（重复 ' + inputDupCount + ' 条）';
                if (existingDupCount > 0) msg += '（已存在 ' + existingDupCount + ' 条）';
                alert(msg);
                btn.disabled = false; btn.textContent = '开始导入';
                return;
            }

            let dataType = document.getElementById('importDataType').value.trim();
            if (!dataType) {
                dataType = deriveDataType(urls[0]);
            }

            const btn = document.getElementById('importBtn');
            btn.disabled = true; btn.textContent = '导入中...';

            const progressSection = document.getElementById('progressSection');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            progressSection.classList.add('active');

            currentDataType = dataType;
            document.getElementById('datatypeBar').style.display = 'block';
            document.getElementById('datatypeValue').textContent = dataType;

            const total = urls.length;
            let dupInfo = '';
            if (inputDupCount > 0 || existingDupCount > 0) {
                dupInfo = '（去重：输入重复 ' + inputDupCount + '，已存在 ' + existingDupCount + '，跳过）';
            }
            progressText.textContent = '待处理 ' + total + ' 张' + dupInfo;
            let savedCount = 0;
            let fetchFailCount = 0;
            let saveFailCount = 0;
            const failedUrls = []; // 保存失败的记录，供重试

            for (let i = 0; i < urls.length; i++) {
                const url = urls[i];
                progressText.textContent = '[' + (i + 1) + '/' + total + '] 获取图片中...';
                progressBar.style.width = ((i / total) * 100) + '%';

                let base64;
                try {
                    base64 = await fetchImageAsBase64(url);
                } catch (e) {
                    console.error('图片获取失败:', url, e);
                    fetchFailCount++;
                    failedUrls.push({ url: url, base64: null, phase: 'fetch' });
                    continue;
                }

                // 转换成功，立即保存（带重试）
                const item = { dataType: dataType, dataKey: url, dataContent: base64 };
                progressText.textContent = '[' + (i + 1) + '/' + total + '] 保存中...';
                const ok = await saveWithRetry(item);
                if (ok) {
                    savedCount++;
                } else {
                    saveFailCount++;
                    failedUrls.push({ url: url, base64: base64, phase: 'save' });
                }

                progressBar.style.width = (((i + 1) / total) * 100) + '%';
            }

            // 汇总结果
            const failTotal = fetchFailCount + saveFailCount;
            if (failTotal === 0) {
                progressText.textContent = '导入完成！共 ' + savedCount + ' 张图片全部保存成功 ✓';
            } else {
                let msg = '完成：成功 ' + savedCount + ' 张';
                if (fetchFailCount > 0) msg += '，获取失败 ' + fetchFailCount + ' 张';
                if (saveFailCount > 0) msg += '，保存失败 ' + saveFailCount + ' 张';
                progressText.textContent = msg;

                // 缓存失败数据到 localStorage，供后续重试
                try {
                    localStorage.setItem('imageGallery_failedImport', JSON.stringify({
                        dataType: dataType,
                        items: failedUrls,
                        time: new Date().toLocaleString()
                    }));
                    progressText.textContent += '（失败数据已缓存，可点击「重试失败项」恢复）';
                    // 显示重试按钮
                    showRetryButton(failedUrls, dataType);
                } catch(e) {
                    console.warn('缓存失败数据失败', e);
                }
            }

            progressBar.style.width = '100%';
            setTimeout(() => {
                progressSection.classList.remove('active');
                progressBar.style.width = '0%';
            }, 5000);

            closeModal();
            loadAllImages();
        }

        /**
         * 显示重试按钮
         */
        function showRetryButton(failedItems, dataType) {
            const fetchFails = failedItems.filter(f => f.phase === 'fetch');
            const saveFails = failedItems.filter(f => f.phase === 'save');
            let html = '<div style="margin:12px auto;max-width:600px;text-align:center;">';
            if (saveFails.length > 0) {
                html += '<button class="action-btn import" style="margin-right:8px;" onclick="retrySaveFailed()">重试保存失败项(' + saveFails.length + '张)</button>';
            }
            if (fetchFails.length > 0) {
                html += '<button class="action-btn import" style="background:#f59e0b;" onclick="retryFetchFailed()">重试获取失败项(' + fetchFails.length + '张)</button>';
            }
            html += '</div>';
            const container = document.getElementById('container');
            container.insertAdjacentHTML('beforebegin', html);
        }

        /**
         * 重试保存失败的项（base64 已转换好，只需重新提交）
         */
        async function retrySaveFailed() {
            const cached = localStorage.getItem('imageGallery_failedImport');
            if (!cached) { alert('没有缓存的失败数据'); return; }
            const data = JSON.parse(cached);
            const saveFails = data.items.filter(f => f.phase === 'save' && f.base64);
            if (saveFails.length === 0) { alert('没有保存失败的项'); return; }

            const progressSection = document.getElementById('progressSection');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            progressSection.classList.add('active');

            let successCount = 0;
            for (let i = 0; i < saveFails.length; i++) {
                const item = { dataType: data.dataType, dataKey: saveFails[i].url, dataContent: saveFails[i].base64 };
                progressText.textContent = '重试保存 ' + (i + 1) + '/' + saveFails.length + '...';
                progressBar.style.width = ((i / saveFails.length) * 100) + '%';
                const ok = await saveWithRetry(item);
                if (ok) successCount++;
            }
            progressBar.style.width = '100%';
            progressText.textContent = '重试完成：成功 ' + successCount + '/' + saveFails.length;
            localStorage.removeItem('imageGallery_failedImport');
            setTimeout(() => { progressSection.classList.remove('active'); }, 3000);
            loadAllImages();
        }

        /**
         * 重试获取失败的项（重新获取图片并保存）
         */
        async function retryFetchFailed() {
            const cached = localStorage.getItem('imageGallery_failedImport');
            if (!cached) { alert('没有缓存的失败数据'); return; }
            const data = JSON.parse(cached);
            const fetchFails = data.items.filter(f => f.phase === 'fetch');
            if (fetchFails.length === 0) { alert('没有获取失败的项'); return; }

            const progressSection = document.getElementById('progressSection');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            progressSection.classList.add('active');

            let successCount = 0;
            const stillFailed = [];
            for (let i = 0; i < fetchFails.length; i++) {
                const url = fetchFails[i].url;
                progressText.textContent = '重试获取 ' + (i + 1) + '/' + fetchFails.length + '...';
                progressBar.style.width = ((i / fetchFails.length) * 100) + '%';
                try {
                    const base64 = await fetchImageAsBase64(url);
                    const item = { dataType: data.dataType, dataKey: url, dataContent: base64 };
                    const ok = await saveWithRetry(item);
                    if (ok) { successCount++; continue; }
                } catch(e) { console.warn('重试仍失败:', url, e); }
                stillFailed.push(fetchFails[i]);
            }
            progressBar.style.width = '100%';
            progressText.textContent = '重试完成：成功 ' + successCount + '/' + fetchFails.length;
            if (stillFailed.length > 0) {
                localStorage.setItem('imageGallery_failedImport', JSON.stringify({ dataType: data.dataType, items: stillFailed, time: new Date().toLocaleString() }));
            } else {
                localStorage.removeItem('imageGallery_failedImport');
            }
            setTimeout(() => { progressSection.classList.remove('active'); }, 3000);
            loadAllImages();
        }

        // ========== 分页加载图片列表 ==========
        var PAGINATED_BASE = ajaxFileDealJavaIP + '/api/v1/general-data/get-by-type';

        async function loadAllImages() {
            currentPage = 1;
            totalRecords = 0;
            imageList = [];
            loadedDataKeys = new Set();
            const container = document.getElementById('container');
            container.innerHTML = '<div id="loading">正在加载数据...</div>';
            document.getElementById('statsInfo').textContent = '';

            if (!currentDataType) {
                const saved = localStorage.getItem('imageGallery_dataType');
                if (saved) {
                    currentDataType = saved;
                    document.getElementById('datatypeBar').style.display = 'block';
                    document.getElementById('datatypeValue').textContent = currentDataType;
                } else {
                    container.innerHTML = '<div class="empty-state"><p>暂无数据，请先点击「导入图片地址」按钮</p></div>';
                    return;
                }
            }

            try {
                const res = await axios.get(PAGINATED_BASE, {
                    params: { dataType: currentDataType, page: 1, limit: PAGE_LIMIT }
                });
                const d = res.data;
                if (d.resultCode !== 200) throw new Error(d.message || '查询失败');
                const pageData = d.data;
                totalRecords = pageData.total || 0;
                const list = pageData.list || [];
                list.forEach(item => {
                    imageList.push({ id: item.id, dataKey: item.dataKey, dataContent: item.dataContent });
                    loadedDataKeys.add(item.dataKey);
                });
                localStorage.setItem('imageGallery_dataType', currentDataType);
                document.getElementById('datatypeBar').style.display = 'block';
                document.getElementById('datatypeValue').textContent = currentDataType;
            } catch (e) {
                imageList = [];
                container.innerHTML = '<div class="empty-state"><p>加载失败: ' + escapeHtml(e.message) + '</p></div>';
                return;
            }

            if (imageList.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>暂无图片数据，请先导入</p></div>';
                return;
            }

            document.getElementById('statsInfo').textContent = '共 ' + totalRecords + ' 张图片，已加载 ' + imageList.length + ' 张';
            renderGallery();
        }

        async function loadNextPage() {
            if (isLoadingPage) return;
            if (imageList.length >= totalRecords) return;
            isLoadingPage = true;
            currentPage++;
            try {
                const res = await axios.get(PAGINATED_BASE, {
                    params: { dataType: currentDataType, page: currentPage, limit: PAGE_LIMIT }
                });
                const d = res.data;
                if (d.resultCode !== 200) throw new Error(d.message || '查询失败');
                const list = (d.data && d.data.list) || [];
                const newItems = [];
                list.forEach(item => {
                    if (!loadedDataKeys.has(item.dataKey)) {
                        const obj = { id: item.id, dataKey: item.dataKey, dataContent: item.dataContent };
                        imageList.push(obj);
                        loadedDataKeys.add(item.dataKey);
                        newItems.push(obj);
                    }
                });
                document.getElementById('statsInfo').textContent = '共 ' + totalRecords + ' 张图片，已加载 ' + imageList.length + ' 张';
                if (newItems.length > 0) {
                    await appendGalleryItems(newItems);
                }
            } catch (e) {
                console.error('加载下一页失败:', e);
                currentPage--;
            }
            isLoadingPage = false;
        }

        // ========== 检测图片方向 ==========
        function detectOrientation(src) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = function() {
                    resolve(img.naturalWidth >= img.naturalHeight ? 'landscape' : 'portrait');
                };
                img.onerror = function() { resolve('landscape'); }; // 默认横屏
                img.src = src;
            });
        }

        // 方向缓存：{ dataKey: 'landscape'|'portrait' }
        const ORIENT_CACHE_KEY = 'imageGallery_orientCache';
        function loadOrientCache() {
            try { return JSON.parse(localStorage.getItem(ORIENT_CACHE_KEY) || '{}'); }
            catch(e) { return {}; }
        }
        function saveOrientCache(cache) {
            try { localStorage.setItem(ORIENT_CACHE_KEY, JSON.stringify(cache)); }
            catch(e) { /* 存储超限时忽略 */ }
        }

        // ========== 渲染相册 ==========
        async function renderGallery() {
            const container = document.getElementById('container');
            container.innerHTML = '';

            if (imageList.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>暂无图片数据，请先导入</p></div>';
                return;
            }

            // 创建主网格
            const gallery = document.createElement('div');
            gallery.className = 'gallery';
            gallery.id = 'mainGallery';
            container.appendChild(gallery);

            await renderGalleryItems(imageList, gallery, true);
        }

        // 追加加载更多的图片
        async function appendGalleryItems(newItems) {
            let gallery = document.getElementById('mainGallery');
            if (!gallery) {
                const container = document.getElementById('container');
                container.innerHTML = '';
                gallery = document.createElement('div');
                gallery.className = 'gallery';
                gallery.id = 'mainGallery';
                container.appendChild(gallery);
            }
            await renderGalleryItems(newItems, gallery, false);
        }

        // 渲染图片项到指定网格
        async function renderGalleryItems(items, gallery, isFirstPage) {
            const orientCache = loadOrientCache();
            const oriented = [];
            const needDetect = [];

            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                const src = (item.dataContent && item.dataContent.startsWith('data:')) ? item.dataContent : item.dataKey;
                const cached = orientCache[item.dataKey];
                if (cached) {
                    oriented.push({ item, src, orient: cached });
                } else {
                    needDetect.push({ item, src });
                }
            }

            // 并行批量检测未缓存方向（每批 6 张）
            if (needDetect.length > 0) {
                const BATCH = 6;
                for (let b = 0; b < needDetect.length; b += BATCH) {
                    const batch = needDetect.slice(b, b + BATCH);
                    const results = await Promise.all(batch.map(async ({ item, src }) => {
                        const orient = await detectOrientation(src);
                        return { item, src, orient };
                    }));
                    results.forEach(r => {
                        oriented.push(r);
                        orientCache[r.item.dataKey] = r.orient;
                    });
                }
                saveOrientCache(orientCache);
            }

            // 渲染卡片到网格
            oriented.forEach(({ item, src, orient }) => {
                const globalIdx = imageList.indexOf(item);
                gallery.appendChild(createCard(item, src, orient, globalIdx));
            });

            // 底部：加载更多提示 / 滚动哨兵
            const container = document.getElementById('container');
            const oldSentinel = document.getElementById('scrollSentinel');
            const oldTip = document.getElementById('loadMoreTip');
            if (oldSentinel) oldSentinel.remove();
            if (oldTip) oldTip.remove();

            if (imageList.length < totalRecords) {
                const tip = document.createElement('div');
                tip.className = 'load-more-tip';
                tip.id = 'loadMoreTip';
                tip.textContent = '向下滚动加载更多...';
                container.appendChild(tip);
                const sentinel = document.createElement('div');
                sentinel.className = 'scroll-sentinel';
                sentinel.id = 'scrollSentinel';
                container.appendChild(sentinel);
            } else if (totalRecords > PAGE_LIMIT) {
                const tip = document.createElement('div');
                tip.className = 'load-more-tip';
                tip.id = 'loadMoreTip';
                tip.textContent = '已全部加载（共 ' + totalRecords + ' 张）';
                container.appendChild(tip);
            }
        }

        function createSectionHeader(title, count, type) {
            const div = document.createElement('div');
            div.className = 'section-header';
            const t = document.createElement('span');
            t.className = 'section-title ' + type;
            t.textContent = title;
            const c = document.createElement('span');
            c.className = 'section-count';
            c.textContent = '(' + count + '张)';
            div.appendChild(t);
            div.appendChild(c);
            return div;
        }

        function createCard(item, src, orient, origIdx) {
            const card = document.createElement('div');
            card.className = 'gallery-card';

            // 图片区域
            const imgWrap = document.createElement('div');
            imgWrap.className = 'card-img-wrap' + (orient === 'portrait' ? ' portrait' : '');
            const loadingTip = document.createElement('div');
            loadingTip.className = 'img-loading';
            loadingTip.textContent = '加载中...';
            imgWrap.appendChild(loadingTip);

            // 方向标签
            const badge = document.createElement('div');
            badge.className = 'orient-badge ' + orient;
            badge.textContent = orient === 'landscape' ? '横屏' : '竖屏';
            imgWrap.appendChild(badge);

            const img = document.createElement('img');
            img.alt = '图片';
            img.loading = 'lazy';
            img.onload = function() { loadingTip.remove(); };
            img.onerror = function() {
                loadingTip.remove();
                const errTip = document.createElement('div');
                errTip.className = 'img-error';
                errTip.textContent = '图片加载失败';
                imgWrap.appendChild(errTip);
            };
            img.src = src;
            imgWrap.appendChild(img);
            // 点击预览
            imgWrap.onclick = function() { showPreview(src); };
            card.appendChild(imgWrap);

            // 信息区域
            const body = document.createElement('div');
            body.className = 'card-body';

            const urlDiv = document.createElement('div');
            urlDiv.className = 'card-url';
            urlDiv.textContent = item.dataKey;
            urlDiv.title = item.dataKey;
            body.appendChild(urlDiv);

            const actions = document.createElement('div');
            actions.className = 'card-actions';

            const copyBtn = document.createElement('button');
            copyBtn.className = 'card-btn copy';
            copyBtn.textContent = '复制地址';
            copyBtn.onclick = function(e) { e.stopPropagation(); copyText(item.dataKey, copyBtn); };
            actions.appendChild(copyBtn);

            const editBtn = document.createElement('button');
            editBtn.className = 'card-btn edit';
            editBtn.textContent = '编辑';
            editBtn.onclick = function(e) { e.stopPropagation(); showEditModal(item.dataKey); };
            actions.appendChild(editBtn);

            const delBtn = document.createElement('button');
            delBtn.className = 'card-btn del';
            delBtn.textContent = '删除';
            delBtn.onclick = function(e) { e.stopPropagation(); deleteImage(item.dataKey); };
            actions.appendChild(delBtn);

            const viewBtn = document.createElement('button');
            viewBtn.className = 'card-btn view';
            viewBtn.textContent = '原图';
            viewBtn.onclick = function(e) { e.stopPropagation(); window.open(item.dataKey, '_blank'); };
            actions.appendChild(viewBtn);

            body.appendChild(actions);
            card.appendChild(body);
            return card;
        }

        // ========== 图片预览 ==========
        function showPreview(src) {
            document.getElementById('previewImg').src = src;
            document.getElementById('previewOverlay').classList.add('active');
        }

        // ========== 编辑图片 ==========
        function showEditModal(dataKey) {
            const item = imageList.find(d => d.dataKey === dataKey);
            if (!item) return;
            openModal(
                '<h3>编辑图片信息</h3>' +
                '<label>图片地址（dataKey）：</label>' +
                '<input id="editUrl" value="' + escapeHtml(item.dataKey) + '">' +
                '<div class="hint">修改地址后，图片预览将使用新地址（需确保新地址可访问）</div>' +
                '<div class="modal-actions">' +
                '<button class="modal-btn cancel" onclick="closeModal()">取消</button>' +
                '<button class="modal-btn confirm" id="editSaveBtn" onclick="doEditImage(\'' + dataKey.replace(/'/g, "\\'") + '\')">保存</button>' +
                '</div>'
            );
        }

        async function doEditImage(oldDataKey) {
            const item = imageList.find(d => d.dataKey === oldDataKey);
            if (!item) return;
            const newUrl = document.getElementById('editUrl').value.trim();
            if (!newUrl) { alert('地址不能为空'); return; }
            const btn = document.getElementById('editSaveBtn');
            btn.disabled = true; btn.textContent = '保存中...';
            try {
                if (item.id) {
                    await GDA.update(item.id, { dataKey: newUrl });
                } else {
                    await GDA.saveOrUpdate(currentDataType, newUrl, item.dataContent);
                }
                item.dataKey = newUrl;
                closeModal();
                renderGallery();
            } catch (e) {
                alert('保存失败: ' + e.message);
                btn.disabled = false; btn.textContent = '保存';
            }
        }

        // ========== 删除图片 ==========
        async function deleteImage(dataKey) {
            const item = imageList.find(d => d.dataKey === dataKey);
            if (!item) return;
            const shortUrl = item.dataKey.length > 50 ? item.dataKey.substring(0, 50) + '...' : item.dataKey;
            if (!confirm('确定删除此图片？\n' + shortUrl)) return;
            try {
                if (item.id) {
                    await GDA.remove(item.id);
                } else {
                    await GDA.removeByKey(currentDataType, item.dataKey);
                }
                const idx = imageList.indexOf(item);
                if (idx > -1) imageList.splice(idx, 1);
                loadedDataKeys.delete(dataKey);
                totalRecords = Math.max(0, totalRecords - 1);
                document.getElementById('statsInfo').textContent = '共 ' + totalRecords + ' 张图片，已加载 ' + imageList.length + ' 张';
                renderGallery();
            } catch (e) {
                alert('删除失败: ' + e.message);
            }
        }

        // ========== 滚动加载监听 ==========
        function initScrollLoad() {
            window.addEventListener('scroll', function() {
                if (isLoadingPage) return;
                if (imageList.length >= totalRecords) return;
                const scrollBottom = window.innerHeight + window.pageYOffset;
                const docHeight = document.documentElement.scrollHeight;
                if (docHeight - scrollBottom < 300) {
                    loadNextPage();
                }
            });
        }

        // ========== 初始化 ==========
        loadAllImages();
        initScrollLoad();
    </script>
</body>
</html>
