<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://raw.githubusercontent.com/pcl1350306170/test-data-backup/refs/heads/main/img/T/头像-蒂法高清-grf6fb.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线图片管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e; color: #e0e0e0; min-height: 100vh;
        }
        h1 { text-align: center; color: #c084fc; margin-bottom: 8px; font-size: 28px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 14px; }
        /* 操作栏 */
        .action-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
        .action-btn {
            padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer;
            font-size: 13px; color: #fff; transition: background .2s;
        }
        .action-btn.import { background: #0ea5e9; }
        .action-btn.import:hover { background: #0284c7; }
        .action-btn.refresh { background: #22c55e; }
        .action-btn.refresh:hover { background: #16a34a; }
        /* 进度条 */
        .progress-section { margin: 0 auto 20px; max-width: 600px; display: none; }
        .progress-section.active { display: block; }
        .progress-bar-wrap {
            background: #16213e; border-radius: 8px; height: 20px; overflow: hidden;
            border: 1px solid #1f3056; margin-bottom: 8px;
        }
        .progress-bar {
            height: 100%; background: linear-gradient(90deg, #7c3aed, #0ea5e9);
            border-radius: 8px; transition: width .3s; width: 0%;
        }
        .progress-text { text-align: center; font-size: 13px; color: #94a3b8; }
        /* dataType 显示 */
        .datatype-bar {
            text-align: center; margin-bottom: 20px; padding: 10px 16px;
            background: #16213e; border: 1px solid #1f3056; border-radius: 8px;
            font-size: 13px; color: #a78bfa; word-break: break-all;
        }
        .datatype-bar span { color: #e2e8f0; font-weight: 600; }
        /* 相册网格 */
        .gallery {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px; padding: 0 20px 40px;
        }
        .gallery-card {
            background: #16213e; border: 1px solid #1f3056; border-radius: 10px;
            overflow: hidden; transition: border-color .2s, transform .2s;
        }
        .gallery-card:hover { border-color: #7c3aed; transform: translateY(-2px); }
        .card-img-wrap {
            width: 100%; aspect-ratio: 16/10; overflow: hidden; position: relative;
            background: #0f172a; cursor: pointer;
        }
        .card-img-wrap img {
            width: 100%; height: 100%; object-fit: cover; transition: transform .3s;
        }
        .gallery-card:hover .card-img-wrap img { transform: scale(1.05); }
        .card-img-wrap .img-loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #64748b; font-size: 13px;
        }
        .card-img-wrap .img-error {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #ef4444; font-size: 13px; text-align: center;
        }
        .card-body { padding: 12px 14px; }
        .card-url {
            font-size: 12px; color: #94a3b8; line-height: 1.5; word-break: break-all;
            margin-bottom: 10px; max-height: 54px; overflow: hidden;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }
        .card-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .card-btn {
            padding: 5px 12px; border: none; border-radius: 5px; cursor: pointer;
            font-size: 12px; color: #fff; transition: background .2s; white-space: nowrap;
        }
        .card-btn.copy { background: #7c3aed; }
        .card-btn.copy:hover { background: #6d28d9; }
        .card-btn.copy.copied { background: #22c55e; }
        .card-btn.edit { background: #0ea5e9; }
        .card-btn.edit:hover { background: #0284c7; }
        .card-btn.del { background: #ef4444; }
        .card-btn.del:hover { background: #dc2626; }
        .card-btn.view { background: #f59e0b; }
        .card-btn.view:hover { background: #d97706; }
        /* 空状态 */
        .empty-state { text-align: center; color: #64748b; padding: 60px 20px; }
        .empty-state p { margin-bottom: 16px; font-size: 16px; }
        /* 统计 */
        .stats { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 16px; }
        /* 模态框 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,.6); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #1e293b; border: 1px solid #334155; border-radius: 12px;
            padding: 24px; width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto;
        }
        .modal h3 { color: #c084fc; margin-bottom: 16px; font-size: 18px; }
        .modal label { display: block; color: #a78bfa; font-size: 13px; margin-bottom: 4px; margin-top: 12px; }
        .modal input, .modal textarea {
            width: 100%; padding: 8px 12px; background: #16213e; border: 1px solid #1f3056;
            border-radius: 6px; color: #e2e8f0; font-size: 14px; outline: none; font-family: inherit;
        }
        .modal input:focus, .modal textarea:focus { border-color: #7c3aed; }
        .modal textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
        .modal-btn {
            padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer;
            font-size: 13px; color: #fff; transition: background .2s;
        }
        .modal-btn.confirm { background: #7c3aed; }
        .modal-btn.confirm:hover { background: #6d28d9; }
        .modal-btn.cancel { background: #475569; }
        .modal-btn.cancel:hover { background: #334155; }
        .modal-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .modal .hint { font-size: 12px; color: #64748b; margin-top: 6px; line-height: 1.5; }
        /* 图片预览大图 */
        .preview-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,.85); z-index: 2000; justify-content: center; align-items: center;
            cursor: zoom-out;
        }
        .preview-overlay.active { display: flex; }
        .preview-overlay img {
            max-width: 95vw; max-height: 95vh; object-fit: contain; border-radius: 8px;
        }
        #loading { text-align: center; color: #888; padding: 60px 0; font-size: 16px; }
        @media (max-width: 768px) {
            .gallery { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); padding: 0 10px 40px; }
        }
    </style>
    <script src="../../lib/vue/axios.min.js"></script>
    <script src="../../js/_variable.js" type="text/javascript"></script>
    <script src="../../js/GeneralDataApi.js"></script>
</head>
<body>
    <h1>在线图片管理</h1>
    <p class="subtitle">导入远程图片地址，自动获取并压缩为 base64 保存，支持相册浏览与管理</p>

    <div class="datatype-bar" id="datatypeBar" style="display:none;">
        dataType：<span id="datatypeValue"></span>
    </div>

    <div class="action-bar">
        <button class="action-btn import" onclick="showImportModal()">导入图片地址</button>
        <button class="action-btn refresh" onclick="loadAllImages()">刷新列表</button>
    </div>

    <div class="progress-section" id="progressSection">
        <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
        <div class="progress-text" id="progressText">准备中...</div>
    </div>

    <div class="stats" id="statsInfo"></div>
    <div id="container"><div id="loading">正在加载数据...</div></div>

    <!-- 图片预览 -->
    <div class="preview-overlay" id="previewOverlay" onclick="this.classList.remove('active')">
        <img id="previewImg" src="" alt="预览">
    </div>

    <!-- 模态框 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <script>
        // ========== 常量与状态 ==========
        const GDA = GeneralDataApi;
        let currentDataType = '';
        let imageList = []; // [{ id, dataKey(url), dataContent(base64) }]

        // ========== 工具函数 ==========
        function escapeHtml(str) {
            const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
        }

        /**
         * 从图片 URL 推导 dataType
         * 例：https://raw.githubusercontent.com/pcl1350306170/test-data-backup/refs/heads/main/img/...
         *   → raw.githubusercontent.com-pcl1350306170-test-data-backup
         * 规则：域名各段 + 路径前两段（通常为 用户名/仓库名）
         */
        function deriveDataType(url) {
            try {
                const u = new URL(url);
                const hostParts = u.hostname.split('.');
                const pathParts = u.pathname.split('/').filter(Boolean);
                // 取路径前两段（如 pcl1350306170/test-data-backup）
                const pathPrefix = pathParts.slice(0, Math.min(2, pathParts.length));
                const all = [...hostParts, ...pathPrefix];
                return all.join('-');
            } catch (e) {
                return 'image_gallery';
            }
        }

        /**
         * 获取远程图片并压缩为 base64
         * 超过 1MB 的图片自动压缩，逐步降低质量
         */
        function fetchImageAsBase64(url, maxWidth = 1920, quality = 0.85) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = function () {
                    let w = img.naturalWidth, h = img.naturalHeight;
                    // 如果宽度超过限制，等比缩放
                    if (w > maxWidth) {
                        h = Math.round(h * maxWidth / w);
                        w = maxWidth;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    // 先尝试较高质量
                    let base64 = canvas.toDataURL('image/jpeg', quality);
                    // 超过 1MB 则逐步降低质量压缩
                    const SIZE_LIMIT = 1; // 1MB
                    let sizeMB = base64.length * 0.75 / 1024 / 1024;
                    if (sizeMB > SIZE_LIMIT) {
                        base64 = canvas.toDataURL('image/jpeg', 0.6);
                        sizeMB = base64.length * 0.75 / 1024 / 1024;
                    }
                    if (sizeMB > SIZE_LIMIT) {
                        base64 = canvas.toDataURL('image/jpeg', 0.4);
                        sizeMB = base64.length * 0.75 / 1024 / 1024;
                    }
                    if (sizeMB > SIZE_LIMIT) {
                        base64 = canvas.toDataURL('image/jpeg', 0.2);
                    }
                    resolve(base64);
                };
                img.onerror = function () { reject(new Error('图片加载失败: ' + url)); };
                // 加时间戳防缓存
                img.src = url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
            });
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
            document.body.appendChild(ta);
            ta.focus(); ta.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch(e) {}
            document.body.removeChild(ta);
            return ok;
        }

        function copyText(text, btn) {
            const onSuccess = () => {
                btn.textContent = '已复制 ✓'; btn.classList.add('copied');
                setTimeout(() => { btn.textContent = '复制地址'; btn.classList.remove('copied'); }, 1500);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(onSuccess).catch(() => {
                    if (fallbackCopy(text)) onSuccess(); else alert('复制失败，请手动复制');
                });
            } else {
                if (fallbackCopy(text)) onSuccess(); else alert('复制失败，请手动复制');
            }
        }

        // ========== 模态框 ==========
        function openModal(html) {
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modalOverlay').classList.add('active');
        }
        function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ========== 导入图片 ==========
        function showImportModal() {
            const defaultDT = currentDataType || '';
            openModal(
                '<h3>导入图片地址</h3>' +
                '<label>图片地址列表（每行一个 URL）：</label>' +
                '<textarea id="importUrls" rows="10" placeholder="粘贴图片地址，每行一个&#10;例如：&#10;https://raw.githubusercontent.com/xxx/img1.png&#10;https://raw.githubusercontent.com/xxx/img2.jpg"></textarea>' +
                '<div class="hint">系统会自动获取远程图片并压缩为 base64 格式保存。超过 10MB 的图片会自动压缩。</div>' +
                '<label>dataType（数据分类，留空则自动从 URL 推导）：</label>' +
                '<input id="importDataType" value="' + escapeHtml(defaultDT) + '" placeholder="留空自动推导">' +
                '<div class="modal-actions">' +
                '<button class="modal-btn cancel" onclick="closeModal()">取消</button>' +
                '<button class="modal-btn confirm" id="importBtn" onclick="doImport()">开始导入</button>' +
                '</div>'
            );
        }

        async function doImport() {
            const urlsText = document.getElementById('importUrls').value.trim();
            if (!urlsText) { alert('请粘贴图片地址'); return; }
            const urls = urlsText.split('\n').map(u => u.trim()).filter(u => u && u.startsWith('http'));
            if (urls.length === 0) { alert('未找到有效的图片地址'); return; }

            let dataType = document.getElementById('importDataType').value.trim();
            if (!dataType) {
                dataType = deriveDataType(urls[0]);
            }

            const btn = document.getElementById('importBtn');
            btn.disabled = true; btn.textContent = '导入中...';

            const progressSection = document.getElementById('progressSection');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            progressSection.classList.add('active');

            currentDataType = dataType;
            document.getElementById('datatypeBar').style.display = 'block';
            document.getElementById('datatypeValue').textContent = dataType;

            const total = urls.length;
            let done = 0;
            let successCount = 0;
            let failCount = 0;
            const batchData = [];

            for (let i = 0; i < urls.length; i++) {
                const url = urls[i];
                progressText.textContent = '正在处理 ' + (i + 1) + ' / ' + total + '：' + url.substring(0, 60) + '...';
                progressBar.style.width = ((i / total) * 100) + '%';

                try {
                    const base64 = await fetchImageAsBase64(url);
                    batchData.push({
                        dataType: dataType,
                        dataKey: url,
                        dataContent: base64
                    });
                    successCount++;
                } catch (e) {
                    console.error('处理失败:', url, e);
                    failCount++;
                }
                done++;
                progressBar.style.width = ((done / total) * 100) + '%';
            }

            // 批量保存
            if (batchData.length > 0) {
                progressText.textContent = '正在保存 ' + batchData.length + ' 条数据...';
                try {
                    await GDA.batchSave(batchData);
                    progressText.textContent = '导入完成！成功 ' + successCount + ' 张' + (failCount > 0 ? '，失败 ' + failCount + ' 张' : '');
                } catch (e) {
                    progressText.textContent = '保存失败: ' + e.message;
                    btn.disabled = false; btn.textContent = '开始导入';
                    return;
                }
            } else {
                progressText.textContent = '没有成功获取到任何图片';
                btn.disabled = false; btn.textContent = '开始导入';
                return;
            }

            progressBar.style.width = '100%';
            setTimeout(() => {
                progressSection.classList.remove('active');
                progressBar.style.width = '0%';
            }, 3000);

            closeModal();
            loadAllImages();
        }

        // ========== 加载图片列表 ==========
        async function loadAllImages() {
            const container = document.getElementById('container');
            container.innerHTML = '<div id="loading">正在加载数据...</div>';
            document.getElementById('statsInfo').textContent = '';

            if (!currentDataType) {
                // 尝试从 URL 参数或上次使用的 dataType 加载
                const saved = localStorage.getItem('imageGallery_dataType');
                if (saved) {
                    currentDataType = saved;
                    document.getElementById('datatypeBar').style.display = 'block';
                    document.getElementById('datatypeValue').textContent = currentDataType;
                } else {
                    container.innerHTML = '<div class="empty-state"><p>暂无数据，请先点击「导入图片地址」按钮</p></div>';
                    return;
                }
            }

            try {
                const list = await GDA.getByType(currentDataType);
                imageList = list.map(d => ({
                    id: d.id,
                    dataKey: d.dataKey,
                    dataContent: d.dataContent
                }));
                localStorage.setItem('imageGallery_dataType', currentDataType);
            } catch (e) {
                imageList = [];
                container.innerHTML = '<div class="empty-state"><p>加载失败: ' + escapeHtml(e.message) + '</p></div>';
                return;
            }

            if (imageList.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>暂无图片数据，请先导入</p></div>';
                return;
            }

            document.getElementById('statsInfo').textContent = '共 ' + imageList.length + ' 张图片';
            renderGallery();
        }

        // ========== 渲染相册 ==========
        function renderGallery() {
            const container = document.getElementById('container');
            container.innerHTML = '';
            const gallery = document.createElement('div');
            gallery.className = 'gallery';

            imageList.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'gallery-card';

                // 图片区域
                const imgWrap = document.createElement('div');
                imgWrap.className = 'card-img-wrap';
                const loadingTip = document.createElement('div');
                loadingTip.className = 'img-loading';
                loadingTip.textContent = '加载中...';
                imgWrap.appendChild(loadingTip);

                const img = document.createElement('img');
                img.alt = '图片 ' + (idx + 1);
                img.loading = 'lazy';
                img.onload = function() { loadingTip.remove(); };
                img.onerror = function() {
                    loadingTip.remove();
                    const errTip = document.createElement('div');
                    errTip.className = 'img-error';
                    errTip.textContent = '图片加载失败';
                    imgWrap.appendChild(errTip);
                };
                // dataContent 是 base64，直接作为 src
                if (item.dataContent && item.dataContent.startsWith('data:')) {
                    img.src = item.dataContent;
                } else {
                    // 兼容旧数据：可能是 URL
                    img.src = item.dataKey;
                }
                imgWrap.appendChild(img);
                // 点击预览
                imgWrap.onclick = function() { showPreview(img.src); };
                card.appendChild(imgWrap);

                // 信息区域
                const body = document.createElement('div');
                body.className = 'card-body';

                const urlDiv = document.createElement('div');
                urlDiv.className = 'card-url';
                urlDiv.textContent = item.dataKey;
                urlDiv.title = item.dataKey;
                body.appendChild(urlDiv);

                const actions = document.createElement('div');
                actions.className = 'card-actions';

                // 复制地址
                const copyBtn = document.createElement('button');
                copyBtn.className = 'card-btn copy';
                copyBtn.textContent = '复制地址';
                copyBtn.onclick = function(e) { e.stopPropagation(); copyText(item.dataKey, copyBtn); };
                actions.appendChild(copyBtn);

                // 编辑
                const editBtn = document.createElement('button');
                editBtn.className = 'card-btn edit';
                editBtn.textContent = '编辑';
                editBtn.onclick = function(e) { e.stopPropagation(); showEditModal(idx); };
                actions.appendChild(editBtn);

                // 删除
                const delBtn = document.createElement('button');
                delBtn.className = 'card-btn del';
                delBtn.textContent = '删除';
                delBtn.onclick = function(e) { e.stopPropagation(); deleteImage(idx); };
                actions.appendChild(delBtn);

                // 新窗口查看
                const viewBtn = document.createElement('button');
                viewBtn.className = 'card-btn view';
                viewBtn.textContent = '原图';
                viewBtn.onclick = function(e) { e.stopPropagation(); window.open(item.dataKey, '_blank'); };
                actions.appendChild(viewBtn);

                body.appendChild(actions);
                card.appendChild(body);
                gallery.appendChild(card);
            });

            container.appendChild(gallery);
        }

        // ========== 图片预览 ==========
        function showPreview(src) {
            document.getElementById('previewImg').src = src;
            document.getElementById('previewOverlay').classList.add('active');
        }

        // ========== 编辑图片 ==========
        function showEditModal(idx) {
            const item = imageList[idx];
            openModal(
                '<h3>编辑图片信息</h3>' +
                '<label>图片地址（dataKey）：</label>' +
                '<input id="editUrl" value="' + escapeHtml(item.dataKey) + '">' +
                '<div class="hint">修改地址后，图片预览将使用新地址（需确保新地址可访问）</div>' +
                '<div class="modal-actions">' +
                '<button class="modal-btn cancel" onclick="closeModal()">取消</button>' +
                '<button class="modal-btn confirm" id="editSaveBtn" onclick="doEditImage(' + idx + ')">保存</button>' +
                '</div>'
            );
        }

        async function doEditImage(idx) {
            const item = imageList[idx];
            const newUrl = document.getElementById('editUrl').value.trim();
            if (!newUrl) { alert('地址不能为空'); return; }
            const btn = document.getElementById('editSaveBtn');
            btn.disabled = true; btn.textContent = '保存中...';
            try {
                if (item.id) {
                    await GDA.update(item.id, { dataKey: newUrl });
                } else {
                    await GDA.saveOrUpdate(currentDataType, newUrl, item.dataContent);
                }
                item.dataKey = newUrl;
                closeModal();
                renderGallery();
            } catch (e) {
                alert('保存失败: ' + e.message);
                btn.disabled = false; btn.textContent = '保存';
            }
        }

        // ========== 删除图片 ==========
        async function deleteImage(idx) {
            const item = imageList[idx];
            const shortUrl = item.dataKey.length > 50 ? item.dataKey.substring(0, 50) + '...' : item.dataKey;
            if (!confirm('确定删除此图片？\n' + shortUrl)) return;
            try {
                if (item.id) {
                    await GDA.remove(item.id);
                } else {
                    await GDA.removeByKey(currentDataType, item.dataKey);
                }
                imageList.splice(idx, 1);
                document.getElementById('statsInfo').textContent = '共 ' + imageList.length + ' 张图片';
                renderGallery();
            } catch (e) {
                alert('删除失败: ' + e.message);
            }
        }

        // ========== 初始化 ==========
        loadAllImages();
    </script>
