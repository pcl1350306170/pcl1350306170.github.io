<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://raw.githubusercontent.com/pcl1350306170/test-data-backup/refs/heads/main/img/T/头像-蒂法高清-grf6fb.jpg">
    <title>通用数据处理</title>
    <!-- 引入Vue -->
    <!-- 引入Vue -->
    <script src="../../lib/vue/vue.min.js"></script>
    <!-- 引入Element UI -->
    <link rel="stylesheet" href="../../lib/vue/element-ui/index.css">
    <script src="../../lib/vue/element-ui/index.js"></script>
    <!-- 引入axios -->
    <script src="../../lib/vue/axios.min.js"></script>
    <script src="../../js/_variable.js" type="text/javascript"></script>
    <style>
        body {
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
        }
        .el-form-item {
            margin-bottom: 20px;
        }
        .status-card {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #e4e7ed;
        }
        .progress-container {
            margin-top: 15px;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .stat-item {
            flex: 1;
            min-width: 150px;
            text-align: center;
            padding: 10px;
        }
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            margin: 5px 0;
        }
        .stat-label {
            color: #606266;
            font-size: 14px;
        }
        .button-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        .task-id-display {
            font-family: monospace;
            padding: 5px 10px;
            border-radius: 4px;
            word-break: break-all;
        }
    </style>
</head>
<body>
<div id="app" class="container">
    <h2>txt文件处理</h2>
    <el-divider></el-divider>

    <el-form :model="formData" :rules="rules" ref="formData" label-width="150px">
        <el-form-item label="数据类型" prop="dataType">
            <el-input v-model="formData.dataType" placeholder="请输入数据类型（如：url、person等）"></el-input>
        </el-form-item>

        <el-form-item label="TXT保存目录" prop="saveDir">
            <el-input v-model="formData.saveDir" placeholder="请输入TXT文件保存的目录路径"></el-input>
        </el-form-item>

        <el-form-item label="每批处理数量" prop="batchSize">
            <el-input-number
                    v-model="formData.batchSize"
                    :min="2"
                    :max="1000"
                    :step="10"
                    placeholder="每批处理的数据量">
            </el-input-number>
        </el-form-item>

        <div class="button-group">
            <el-button
                    type="primary"
                    @click="startTask"
                    :disabled="taskStatus === 'PROCESSING'">
                <i class="el-icon-play"></i> 开始处理任务
            </el-button>
            <el-button
                    type="warning"
                    @click="stopTask"
                    :disabled="taskStatus !== 'PROCESSING'">
                <i class="el-icon-pause"></i> 终止当前任务
            </el-button>
            <el-button
                    type="info"
                    @click="queryProgress"
                    :disabled="!taskId">
                <i class="el-icon-refresh"></i> 刷新进度
            </el-button>
            <el-button
                    type="danger"
                    @click="resetTask"
                    :disabled="taskStatus === 'PROCESSING'">
                <i class="el-icon-delete"></i> 重置任务
            </el-button>
        </div>
    </el-form>

    <!-- 任务状态和进度展示 -->
    <div class="status-card" v-if="taskId || taskStatus">
        <el-descriptions column="1" border>
            <el-descriptions-item label="当前状态">
                <el-tag
                        :type="statusTagType"
                        size="medium">
                    {{ statusText }}
                </el-tag>
            </el-descriptions-item>
            <el-descriptions-item label="任务ID" v-if="taskId">
                <div class="task-id-display">{{ taskId }}</div>
            </el-descriptions-item>
        </el-descriptions>

        <div class="progress-container" v-if="showProgress">
            <el-progress
                    :percentage="progressPercentage"
                    :status="progressStatus"
                    stroke-width="8">
            </el-progress>
            <div style="margin-top: 10px; text-align: right;">
                {{ progress.processedCount }} / {{ progress.totalCount }} 条数据
            </div>
        </div>

        <div class="stats" v-if="progress.totalCount > 0">
            <div class="stat-item">
                <div class="stat-label">总数据量</div>
                <div class="stat-value">{{ progress.totalCount }}</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">已处理</div>
                <div class="stat-value">{{ progress.processedCount }}</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">处理成功</div>
                <div class="stat-value" style="color: #42b983;">{{ progress.successCount }}</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">处理失败</div>
                <div class="stat-value" style="color: #f56c6c;">{{ progress.failedCount }}</div>
            </div>
        </div>
    </div>
</div>

<script>
    // 后端API基础地址
    ajaxFileDealJavaIP = 'http://localhost:5000';
    const apiBaseUrl = ajaxFileDealJavaIP+'/crawl-api/v1/generalData/process';

    new Vue({
        el: '#app',
        data() {
            return {
                formData: {
                    dataType: '小说-都市',               // 数据类型
                    saveDir: 'F:\\download\\novels',  // 默认保存目录
                    batchSize: 100                    // 默认每批处理数量
                },
                rules: {
                    dataType: [
                        { required: true, message: '请输入数据类型', trigger: 'blur' }
                    ],
                    saveDir: [
                        { required: false, message: '请输入保存目录', trigger: 'blur' }
                    ],
                    batchSize: [
                        { required: true, message: '请输入每批处理数量', trigger: 'blur' }
                    ]
                },
                taskId: '',               // 当前任务ID
                taskStatus: '',           // 任务状态：PROCESSING, COMPLETED, STOPPED, ERROR
                progress: {               // 进度信息
                    totalCount: 0,         // 总数据量
                    processedCount: 0,     // 已处理数量
                    successCount: 0,       // 处理成功数量
                    failedCount: 0,        // 处理失败数量
                    progressPercentage: 0  // 进度百分比
                },
                progressInterval: null,   // 进度查询定时器
            };
        },
        computed: {
            progressPercentage() {
                return this.progress.progressPercentage || 0;
            },
            progressStatus() {
                if (this.taskStatus === 'COMPLETED') return 'success';
                if (this.taskStatus === 'ERROR') return 'exception';
                return '';
            },
            statusText() {
                const statusMap = {
                    '': '未开始',
                    'PROCESSING': '处理中',
                    'COMPLETED': '已完成',
                    'STOPPED': '已终止',
                    'ERROR': '处理出错'
                };
                return statusMap[this.taskStatus] || '未知状态';
            },
            statusTagType() {
                const typeMap = {
                    'PROCESSING': 'primary',
                    'COMPLETED': 'success',
                    'STOPPED': 'warning',
                    'ERROR': 'danger'
                };
                return typeMap[this.taskStatus] || 'info';
            },
            showProgress() {
                return this.taskStatus && this.taskStatus !== '';
            }
        },
        methods: {
            async startTask() {
                this.$refs.formData.validate(async (valid) => {
                    if (valid) {
                        try {
                            const response = await axios({
                                url: `${apiBaseUrl}/start`,
                                method: 'post',
                                params: {
                                    dataType: this.formData.dataType,
                                    saveDir: this.formData.saveDir,
                                    batchSize: this.formData.batchSize
                                }
                            });

                            this.$message.closeAll();

                            if (response.data.resultCode === 200 && response.data.data) {
                                this.taskId = response.data.data.taskId;
                                this.taskStatus = 'PROCESSING';
                                this.progress = {
                                    totalCount: 0,
                                    processedCount: 0,
                                    successCount: 0,
                                    failedCount: 0,
                                    progressPercentage: 0
                                };

                                this.$message.success('任务已成功启动');
                                this.startProgressPolling();
                            } else {
                                this.$message.error(`启动任务失败: ${response.data.message || '未知错误'}`);
                            }
                        } catch (error) {
                            this.$message.closeAll();
                            this.handleRequestError(error);
                        }
                    }
                });
            },

            async queryProgress() {
                if (!this.taskId) {
                    this.$message.warning('请先启动任务');
                    return;
                }

                try {
                    const response = await axios({
                        url: `${apiBaseUrl}/progress`,
                        method: 'get',
                        params: {
                            taskId: this.taskId
                        }
                    });

                    if (response.data.resultCode === 200 && response.data.data) {
                        const progressData = response.data.data;
                        this.progress = progressData;
                        this.taskStatus = progressData.status;

                        if (['COMPLETED', 'STOPPED', 'ERROR'].includes(this.taskStatus)) {
                            this.stopProgressPolling();

                            if (this.taskStatus === 'COMPLETED') {
                                this.$message.success('任务已完成');
                            } else if (this.taskStatus === 'STOPPED') {
                                this.$message.warning('任务已终止');
                            } else if (this.taskStatus === 'ERROR') {
                                this.$message.error('任务处理出错: ' + (progressData.errorMessage || ''));
                            }
                        }
                    } else {
                        this.$message.error(`查询进度失败: ${response.data.message || '未知错误'}`);
                    }
                } catch (error) {
                    this.handleRequestError(error);
                }
            },

            async stopTask() {
                if (!this.taskId) {
                    this.$message.warning('请先启动任务');
                    return;
                }

                try {
                    const response = await axios({
                        url: `${apiBaseUrl}/stop`,
                        method: 'post',
                        params: {
                            taskId: this.taskId
                        }
                    });

                    this.$message.closeAll();

                    if (response.data.resultCode === 200) {
                        this.$message.success('已发送终止任务请求，将处理完当前批次后停止');
                    } else {
                        this.$message.error(`终止任务失败: ${response.data.message || '未知错误'}`);
                    }
                } catch (error) {
                    this.$message.closeAll();
                    this.handleRequestError(error);
                }
            },

            resetTask() {
                this.$confirm('确定要重置任务状态吗？当前任务信息将被清除。', '提示', {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'warning'
                }).then(() => {
                    this.taskId = '';
                    this.taskStatus = '';
                    this.progress = {
                        totalCount: 0,
                        processedCount: 0,
                        successCount: 0,
                        failedCount: 0,
                        progressPercentage: 0
                    };
                    this.stopProgressPolling();
                    this.$message.success('任务已重置');
                }).catch(() => {
                    // 取消操作
                });
            },

            startProgressPolling() {
                this.stopProgressPolling();
                this.progressInterval = setInterval(() => {
                    this.queryProgress();
                }, 10000); // 每10秒查询一次
            },

            stopProgressPolling() {
                if (this.progressInterval) {
                    clearInterval(this.progressInterval);
                    this.progressInterval = null;
                }
            },

            handleRequestError(error) {
                if (error.response) {
                    this.$message.error(`请求失败: ${error.response.data?.message || '服务器错误'}`);
                } else if (error.request) {
                    this.$message.error('请求无响应，请检查服务器是否正常运行');
                } else {
                    this.$message.error('请求失败: ' + error.message);
                }

                if (this.taskStatus === 'PROCESSING') {
                    this.taskStatus = 'ERROR';
                    this.stopProgressPolling();
                }
            }
        },
        beforeDestroy() {
            this.stopProgressPolling();
        }
    });
</script>
</body>
</html>
