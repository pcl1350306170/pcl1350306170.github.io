<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://raw.githubusercontent.com/pcl1350306170/test-data-backup/refs/heads/main/img/T/头像-蒂法高清-grf6fb.jpg">
    <title>创建服务器的测试数据</title>
    <link href="../../lib/layui/css/layui.css" rel="stylesheet" type="text/css">
    <script src="../../js/jquery-1.8.3.min.js" type="text/javascript"></script>
    <script src="../../lib/layui/layui.all.js" type="text/javascript"></script>
    <script src="../../lib/layui/lay/modules/layer.js" type="text/javascript"></script>
    <script src="../../js/_variable.js" type="text/javascript"></script>
    <script src="../../js/popup.js" type="text/javascript"></script>
    <style>
        body {
            background: #fff;
        }

        .layui-form-label {
        }
    </style>
</head>
<body class="layui-container" style="padding: 20px">

<form class="layui-form" lay-filter="formData">
    <div class="layui-form-item">
        <label class="layui-form-label">数据库地址</label>
        <div class="layui-input-block">
            <input type="text" name="dbHost" required lay-verify="required" placeholder="数据库地址" class="layui-input"
                   value="192.168.31.82">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">端口</label>
        <div class="layui-input-block">
            <input type="text" name="dbPort" required lay-verify="required" placeholder="数据库端口" class="layui-input"
                   value="3306">
        </div>
    </div>


    <div class="layui-form-item">
        <label class="layui-form-label">数据库名</label>
        <div class="layui-input-block">
            <input type="text" name="dbName" required lay-verify="required" placeholder="数据库名" class="layui-input"
                   value="YHDB">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">用户名</label>
        <div class="layui-input-block">
            <input type="text" name="username" required lay-verify="required" placeholder="用户名" class="layui-input"
                   value="root">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">密码</label>
        <div class="layui-input-block">
            <select name="password">
                <option value="Yahua@3585668" selected>4.0</option>
                <option value="Yahua3585668yh">3.0</option>
            </select>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">操作类型</label>
        <div class="layui-input-block">
            <select name="sqlType" id="sqlType" lay-filter="sqlType" lay-verify="required">
                <option value="insertUser">添加用户</option>
                <option value="deleteip">删除某个ip占用的设备</option>
                <option value="addlabelclass">添加护理标签分类</option>
                <option value="addlabel">添加护理标签【每个分类下面都添加】</option>
            </select>
        </div>
    </div>

    <div class="layui-form-item layui-form-item-others" id="username_emp">
        <label class="layui-form-label">添加的账号名</label>
        <div class="layui-input-block">
            <input type="text" name="username_emp" required  placeholder="添加的账号名"
                   class="layui-input" value="gz">
        </div>
    </div>
    <div class="layui-form-item layui-form-item-others" id="deleteip">
        <label class="layui-form-label">需要删除设备的ip</label>
        <div class="layui-input-block">
            <input type="text" name="deleteip" required placeholder="需要删除设备的ip"
                   class="layui-input" value="192.168.3.199">
        </div>
    </div>
    <div class="layui-form-item layui-form-item-others" id="addlabelclass">
        <label class="layui-form-label">添加分类数量</label>
        <div class="layui-input-block">
            <input type="text" name="addlabelclassnum" required placeholder="添加分类数量"
                   class="layui-input" value="5">
        </div>
    </div>
    <div class="layui-form-item layui-form-item-others" id="addlabel">
        <label class="layui-form-label">添加护理标签数量</label>
        <div class="layui-input-block">
            <input type="text" name="addlabelnum" required placeholder="添加护理标签数量"
                   class="layui-input" value="15">
        </div>
    </div>

    <div class="layui-form-item">
        <div class="layui-input-block">
            <button type="button" class="layui-btn layui-btn-normal" id="submitBtn">确认</button>
        </div>
    </div>
</form>

<script>
    var clicknum;
    $(() => {
        clicknum = 0;
        $(".layui-form-item-others").hide()
        $('#username_emp').show()
        $('#submitBtn').click()
    })
    layui.use(['layer', 'jquery', 'form'], function () {
        var layer = layui.layer, $ = layui.jquery, form = layui.form;
        form.on('select(sqlType)', function (data) {
            $(".layui-form-item-others").hide()
            let sqlType = $("#sqlType").val()
            if (sqlType === 'insertUser') {
                $('#username_emp').show()
            } else if (sqlType === 'deleteip') {
                $('#deleteip').show()
            } else if (sqlType === 'addlabelclass') {
                $('#addlabelclass').show()
            }else if (sqlType === 'addlabel') {
                $('#addlabel').show()
            }
        });
    });

    $('#submitBtn').on('click', function () {
        const formData = layui.form.val("formData");
        clicknum++

        if (clicknum === 1) return

        let body = formData.body;
        //body = body.replace(/\*i\*/g, generateRandomCode());

        const requestData = {
            dbHost: formData.dbHost,
            dbPort: formData.dbPort,
            dbName: formData.dbName,
            username: formData.username,
            password: formData.password,
            sqlType: formData.sqlType,
            times: parseInt(formData.times)
        };
        if (requestData.sqlType === 'insertUser') {
            requestData.username_emp = formData.username_emp
        } else if (requestData.sqlType === 'deleteip') {
            requestData.deleteip = formData.deleteip
        }else if (requestData.sqlType === 'addlabelclass') {
            requestData.addlabelclassnum = formData.addlabelclassnum
        }else if (requestData.sqlType === 'addlabel') {
            requestData.addlabelnum = formData.addlabelnum
        }

        $.ajax({
            url: ajaxFileDealJavaIP + '/yh-mock/create-host-data',  // 本地接口地址
            type: 'POST',
            contentType: 'application/json',
            dataType: 'json',
            data: JSON.stringify(requestData),
            success: function (res) {
                if(res.status==='error'){
                    layer.msg(res.message || "请求失败", {icon: 2});
                }else{
                    layer.msg(res.message || "请求成功", {icon: 1});
                }
            },
            error: function () {
                layer.msg("请求失败", {icon: 2});
            }
        });
    });
</script>
</body>
</html>
