<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme 数据管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 20px;
        }
        h1 { text-align: center; color: #c084fc; margin-bottom: 8px; font-size: 28px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 14px; }
        /* 前缀区域 */
        .prefix-section { max-width: 90%; margin: 0 auto 24px; }
        .prefix-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .prefix-header-title { font-size: 16px; color: #a78bfa; font-weight: 600; }
        .prefix-add-btn {
            padding: 6px 14px; background: #7c3aed; color: #fff; border: none;
            border-radius: 6px; cursor: pointer; font-size: 13px; transition: background .2s;
        }
        .prefix-add-btn:hover { background: #6d28d9; }
        .prefix-card {
            background: #16213e; border: 1px solid #1f3056; border-radius: 8px;
            padding: 12px 16px; margin-bottom: 8px; transition: border-color .2s;
        }
        .prefix-card:hover { border-color: #334155; }
        .prefix-card.active { border-color: #22c55e; background: rgba(34,197,94,.05); }
        .prefix-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .prefix-card-name { font-size: 14px; font-weight: 600; color: #e2e8f0; flex: 1; }
        .prefix-active-badge {
            font-size: 11px; padding: 2px 8px; border-radius: 10px;
            background: #22c55e; color: #fff; white-space: nowrap;
        }
        .prefix-card-content { font-size: 13px; color: #94a3b8; line-height: 1.5; word-break: break-all; margin-bottom: 8px; }
        .prefix-card-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .prefix-card-actions .item-btn { font-size: 11px; padding: 4px 10px; }
        .prefix-empty { text-align: center; color: #4a5568; padding: 20px; font-size: 13px; }
        /* 操作栏 */
        .action-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
        .action-btn {
            padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer;
            font-size: 13px; color: #fff; transition: background .2s;
        }
        .action-btn.import { background: #0ea5e9; }
        .action-btn.import:hover { background: #0284c7; }
        .action-btn.add-theme { background: #22c55e; }
        .action-btn.add-theme:hover { background: #16a34a; }
        .action-btn.add-cat { background: #f59e0b; }
        .action-btn.add-cat:hover { background: #d97706; }
        /* 主题 */
        .theme-group { margin-bottom: 40px; }
        .theme-header { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #1f3056; }
        .theme-title { text-align: center; color: #c084fc; font-size: 24px; font-weight: 600; }
        .theme-del { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 18px; padding: 2px 6px; border-radius: 4px; }
        .theme-del:hover { background: rgba(239,68,68,.15); }
        /* 类别 */
        .category { margin-bottom: 30px; column-count: 2; column-gap: 16px; }
        .category-title {
            column-span: all; font-size: 20px; color: #a78bfa;
            border-left: 4px solid #7c3aed; padding-left: 12px; margin-bottom: 14px;
            display: flex; align-items: center; gap: 10px;
        }
        .cat-del { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px; }
        .cat-del:hover { background: rgba(239,68,68,.15); }
        /* 条目 */
        .item {
            background: #16213e; border-radius: 8px; padding: 14px 18px; margin-bottom: 10px;
            display: flex; align-items: flex-start; gap: 12px; border: 1px solid #1f3056;
            transition: border-color .2s; break-inside: avoid;
        }
        .item:hover { border-color: #7c3aed; }
        .item-info { flex: 1; min-width: 0; }
        .item-name { font-size: 16px; font-weight: 600; color: #e2e8f0; margin-bottom: 6px; }
        .item-name .seq { color: #64748b; font-weight: 400; margin-right: 6px; }
        .item-desc { font-size: 14px; color: #94a3b8; line-height: 1.6; word-break: break-all; }
        .item-actions { flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; align-self: center; }
        .item-btn {
            padding: 5px 12px; border: none; border-radius: 5px; cursor: pointer;
            font-size: 12px; color: #fff; transition: background .2s; white-space: nowrap;
        }
        .item-btn.copy { background: #7c3aed; }
        .item-btn.copy:hover { background: #6d28d9; }
        .item-btn.copy.copied { background: #22c55e; }
        .item-btn.edit { background: #0ea5e9; }
        .item-btn.edit:hover { background: #0284c7; }
        .item-btn.del { background: #ef4444; }
        .item-btn.del:hover { background: #dc2626; }
        .add-item-btn {
            column-span: all; display: block; width: 100%; padding: 10px; margin-top: 6px;
            background: rgba(124,58,237,.15); border: 1px dashed #7c3aed; border-radius: 8px;
            color: #a78bfa; font-size: 14px; cursor: pointer; text-align: center;
            transition: background .2s;
        }
        .add-item-btn:hover { background: rgba(124,58,237,.25); }
        /* 模态框 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,.6); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #1e293b; border: 1px solid #334155; border-radius: 12px;
            padding: 24px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto;
        }
        .modal h3 { color: #c084fc; margin-bottom: 16px; font-size: 18px; }
        .modal label { display: block; color: #a78bfa; font-size: 13px; margin-bottom: 4px; margin-top: 12px; }
        .modal input, .modal textarea, .modal select {
            width: 100%; padding: 8px 12px; background: #16213e; border: 1px solid #1f3056;
            border-radius: 6px; color: #e2e8f0; font-size: 14px; outline: none; font-family: inherit;
        }
        .modal input:focus, .modal textarea:focus, .modal select:focus { border-color: #7c3aed; }
        .modal textarea { min-height: 100px; resize: vertical; line-height: 1.5; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
        .modal-btn {
            padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer;
            font-size: 13px; color: #fff; transition: background .2s;
        }
        .modal-btn.confirm { background: #7c3aed; }
        .modal-btn.confirm:hover { background: #6d28d9; }
        .modal-btn.cancel { background: #475569; }
        .modal-btn.cancel:hover { background: #334155; }
        .modal-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        /* 导入进度 */
        .import-progress {
            max-width: 90%; margin: 0 auto 20px; text-align: center;
            font-size: 13px; color: #0ea5e9; display: none;
        }
        .import-progress.active { display: block; }
        /* 空状态 */
        .empty-state { text-align: center; color: #64748b; padding: 60px 20px; }
        .empty-state p { margin-bottom: 16px; font-size: 16px; }
        #loading { text-align: center; color: #888; padding: 60px 0; font-size: 16px; }
        @media (max-width: 768px) { .category { column-count: 1; } }
    </style>
    <script src="../../lib/vue/axios.min.js"></script>
    <script src="../../js/_variable.js" type="text/javascript"></script>
    <script src="../../js/GeneralDataApi.js"></script>
</head>
<body>
    <h1>Theme 数据管理</h1>
    <p class="subtitle">点击右侧按钮复制描述内容，支持在线编辑管理</p>
    <div class="prefix-section">
        <div class="prefix-header">
            <span class="prefix-header-title">内容前缀管理</span>
            <button class="prefix-add-btn" onclick="showAddPrefixModal()">+ 新增前缀</button>
        </div>
        <div id="prefixList"><div class="prefix-empty">暂无前缀，点击上方按钮添加</div></div>
    </div>
    <div class="action-bar">
        <button class="action-btn import" onclick="showImportModal()">导入 JSON 数据</button>
        <button class="action-btn add-theme" onclick="showAddThemeModal()">+ 新增大类</button>
    </div>
    <div class="import-progress" id="importProgress"></div>
    <div id="container"><div id="loading">正在加载数据...</div></div>
    <!-- 通用模态框 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent"></div>
    </div>
    <script>
        // ========== 常量与状态 ==========
        const PREFIX_TYPE = 'theme_viewer_prefix';
        const STRUCT_TYPE = 'theme_structure';
        let themeStructure = [];
        let themeItems = {};
        let prefixes = []; // { id, dataKey, content, active }

        // GDA = GeneralDataApi 的简写别名
        const GDA = GeneralDataApi;

        // ========== 前缀管理 ==========
        // 解析前缀 JSON：{ content: '实际内容', active: true/false }
        function parsePrefixData(jsonStr) {
            try {
                const obj = JSON.parse(jsonStr);
                return { content: obj.content || '', active: !!obj.active };
            } catch(e) {
                // 兼容旧数据（纯文本）
                return { content: jsonStr || '', active: false };
            }
        }
        function buildPrefixJson(content, active) {
            return JSON.stringify({ content: content, active: active });
        }
        async function loadPrefixes() {
            try {
                const list = await GDA.getByType(PREFIX_TYPE);
                prefixes = list.map(d => {
                    const parsed = parsePrefixData(d.dataContent);
                    return { id: d.id, dataKey: d.dataKey, content: parsed.content, active: parsed.active };
                });
            } catch(e) { prefixes = []; }
            renderPrefixList();
        }
        function renderPrefixList() {
            const list = document.getElementById('prefixList');
            list.innerHTML = '';
            if (prefixes.length === 0) {
                list.innerHTML = '<div class="prefix-empty">暂无前缀，点击上方按钮添加</div>';
                return;
            }
            prefixes.forEach(p => {
                const card = document.createElement('div');
                card.className = 'prefix-card' + (p.active ? ' active' : '');
                const header = document.createElement('div');
                header.className = 'prefix-card-header';
                const name = document.createElement('span');
                name.className = 'prefix-card-name';
                name.textContent = p.dataKey;
                header.appendChild(name);
                if (p.active) {
                    const badge = document.createElement('span');
                    badge.className = 'prefix-active-badge';
                    badge.textContent = '使用中';
                    header.appendChild(badge);
                }
                card.appendChild(header);
                const content = document.createElement('div');
                content.className = 'prefix-card-content';
                content.textContent = p.content;
                card.appendChild(content);
                const actions = document.createElement('div');
                actions.className = 'prefix-card-actions';
                if (!p.active) {
                    const activateBtn = document.createElement('button');
                    activateBtn.className = 'item-btn copy';
                    activateBtn.textContent = '设为使用中';
                    activateBtn.onclick = () => setActivePrefix(p.dataKey);
                    actions.appendChild(activateBtn);
                }
                const editBtn = document.createElement('button');
                editBtn.className = 'item-btn edit';
                editBtn.textContent = '编辑';
                editBtn.onclick = () => showEditPrefixModal(p.dataKey);
                actions.appendChild(editBtn);
                const delBtn = document.createElement('button');
                delBtn.className = 'item-btn del';
                delBtn.textContent = '删除';
                delBtn.onclick = () => deletePrefix(p.dataKey);
                actions.appendChild(delBtn);
                card.appendChild(actions);
                list.appendChild(card);
            });
        }
        function showAddPrefixModal() {
            openModal(
                '<h3>新增内容前缀</h3>' +
                '<label>前缀名称：</label><input id="prefixName" placeholder="例如：通用前缀、16:9比例">' +
                '<label>前缀内容：</label><textarea id="prefixContent" rows="5" placeholder="输入前缀内容，复制时将自动拼接到描述前面"></textarea>' +
                '<label style="margin-top:12px;"><input type="checkbox" id="prefixActive" style="width:auto;margin-right:6px;">设为使用中</label>' +
                '<div class="modal-actions">' +
                '<button class="modal-btn cancel" onclick="closeModal()">取消</button>' +
                '<button class="modal-btn confirm" id="prefixSaveBtn" onclick="doAddPrefix()">保存</button>' +
                '</div>'
            );
        }
        async function doAddPrefix() {
            const name = document.getElementById('prefixName').value.trim();
            const content = document.getElementById('prefixContent').value.trim();
            const isActive = document.getElementById('prefixActive').checked;
            if (!name) { alert('请输入前缀名称'); return; }
            const btn = document.getElementById('prefixSaveBtn');
            btn.disabled = true; btn.textContent = '保存中...';
            try {
                // 如果勾选了"使用中"，先把其他前缀的 active 设为 false
                if (isActive) {
                    for (const p of prefixes) {
                        if (p.active) {
                            await GDA.update(p.id, { dataContent: buildPrefixJson(p.content, false) });
                            p.active = false;
                        }
                    }
                }
                const jsonContent = buildPrefixJson(content, isActive);
                const res = await GDA.save({ dataType: PREFIX_TYPE, dataKey: name, dataContent: jsonContent });
                // 兼容不同返回格式：尝试 res.data.id / res.id / 回查
                let newId = (res && res.data && res.data.id) || (res && res.id) || null;
                if (!newId) {
                    const list = await GDA.getByType(PREFIX_TYPE);
                    const found = list.find(d => d.dataKey === name);
                    if (found) newId = found.id;
                }
                prefixes.push({ id: newId, dataKey: name, content: content, active: isActive });
                closeModal(); renderPrefixList();
            } catch(e) { alert('保存失败: ' + e.message); btn.disabled = false; btn.textContent = '保存'; }
        }
        function showEditPrefixModal(key) {
            const p = prefixes.find(x => x.dataKey === key);
            if (!p) return;
            openModal(
                '<h3>编辑前缀</h3>' +
                '<label>前缀名称：</label><input id="editPrefixName" value="' + escapeHtml(p.dataKey) + '">' +
                '<label>前缀内容：</label><textarea id="editPrefixContent" rows="5">' + escapeHtml(p.content) + '</textarea>' +
                '<div class="modal-actions">' +
                '<button class="modal-btn cancel" onclick="closeModal()">取消</button>' +
                '<button class="modal-btn confirm" id="prefixEditBtn" onclick="doEditPrefix(\'' + key.replace(/'/g, "\\'") + '\')">保存</button>' +
                '</div>'
            );
        }
        async function doEditPrefix(oldKey) {
            const newName = document.getElementById('editPrefixName').value.trim();
            const newContent = document.getElementById('editPrefixContent').value.trim();
            if (!newName) { alert('请输入前缀名称'); return; }
            const btn = document.getElementById('prefixEditBtn');
            btn.disabled = true; btn.textContent = '保存中...';
            try {
                const p = prefixes.find(x => x.dataKey === oldKey);
                const jsonContent = buildPrefixJson(newContent, p ? p.active : false);
                if (p && p.id) {
                    await GDA.update(p.id, { dataKey: newName, dataContent: jsonContent });
                } else {
                    // id 不可用时，通过 dataKey 查找记录再更新
                    const list = await GDA.getByType(PREFIX_TYPE);
                    const target = list.find(d => d.dataKey === oldKey);
                    if (target) {
                        await GDA.update(target.id, { dataKey: newName, dataContent: jsonContent });
                        p.id = target.id; // 补存 id
                    } else {
                        await GDA.save({ dataType: PREFIX_TYPE, dataKey: newName, dataContent: jsonContent });
                    }
                }
                if (p) { p.dataKey = newName; p.content = newContent; }
                closeModal(); renderPrefixList();
            } catch(e) { alert('保存失败: ' + e.message); btn.disabled = false; btn.textContent = '保存'; }
        }
        async function setActivePrefix(name) {
            try {
                // 确保所有前都有 id（兼容旧数据）
                for (const p of prefixes) {
                    if (!p.id) {
                        const list = await GDA.getByType(PREFIX_TYPE);
                        const found = list.find(d => d.dataKey === p.dataKey);
                        if (found) p.id = found.id;
                    }
                }
                // 先把所有前缀的 active 设为 false，再把目标设为 true
                const promises = [];
                for (const p of prefixes) {
                    const newActive = (p.dataKey === name);
                    if (p.active !== newActive) {
                        promises.push(GDA.update(p.id, { dataContent: buildPrefixJson(p.content, newActive) }));
                        p.active = newActive;
                    }
                }
                await Promise.all(promises);
                renderPrefixList();
            } catch(e) { alert('设置失败'); }
        }
        async function deletePrefix(key) {
            if (!confirm('确定删除前缀「' + key + '」？')) return;
            const p = prefixes.find(x => x.dataKey === key);
            if (p && p.id) {
                await GDA.remove(p.id);
            } else {
                await GDA.removeByKey(PREFIX_TYPE, key);
            }
            prefixes = prefixes.filter(x => x.dataKey !== key);
            renderPrefixList();
        }

        // ========== 加载主题数据 ==========
        async function loadAllData() {
            const container = document.getElementById('container');
            container.innerHTML = '<div id="loading">正在加载数据...</div>';
            try {
                const list = await GDA.getByType(STRUCT_TYPE);
                themeStructure = list.length > 0 ? JSON.parse(list[0].dataContent || '[]') : [];
            } catch (e) { themeStructure = []; }

            if (themeStructure.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>暂无数据，请先导入 JSON 数据</p></div>';
                return;
            }
            // 并行加载所有类别的条目
            const promises = [];
            themeItems = {};
            themeStructure.forEach(theme => {
                (theme.类别 || []).forEach(catName => {
                    const key = theme.大类 + '|' + catName;
                    themeItems[key] = [];
                    const dt = 'theme_' + theme.大类 + '_' + catName;
                    promises.push(
                        GDA.getByType(dt)
                            .then(list => {
                                themeItems[key] = list.map(d => ({
                                    id: d.id, dataKey: d.dataKey, dataContent: d.dataContent
                                }));
                            }).catch(() => {})
                    );
                });
            });
            await Promise.all(promises);
            renderAll();
        }

        // ========== 渲染 ==========
        function renderAll() {
            const container = document.getElementById('container');
            container.innerHTML = '';
            themeStructure.forEach((theme, ti) => {
                const group = document.createElement('div');
                group.className = 'theme-group';
                // 主题标题
                const header = document.createElement('div');
                header.className = 'theme-header';
                const title = document.createElement('div');
                title.className = 'theme-title';
                title.textContent = theme.大类;
                const delBtn = document.createElement('button');
                delBtn.className = 'theme-del'; delBtn.textContent = '✕'; delBtn.title = '删除此大类';
                delBtn.onclick = () => deleteTheme(ti);
                header.appendChild(title);
                header.appendChild(delBtn);
                group.appendChild(header);
                // 各类别
                (theme.类别 || []).forEach((catName, ci) => {
                    const section = document.createElement('div');
                    section.className = 'category';
                    const catTitle = document.createElement('div');
                    catTitle.className = 'category-title';
                    const catText = document.createElement('span');
                    catText.textContent = catName;
                    const catDel = document.createElement('button');
                    catDel.className = 'cat-del'; catDel.textContent = '✕'; catDel.title = '删除此类别';
                    catDel.onclick = () => deleteCategory(ti, ci);
                    catTitle.appendChild(catText);
                    catTitle.appendChild(catDel);
                    section.appendChild(catTitle);
                    // 条目
                    const key = theme.大类 + '|' + catName;
                    const items = themeItems[key] || [];
                    items.forEach((item, idx) => {
                        const row = document.createElement('div');
                        row.className = 'item';
                        const info = document.createElement('div');
                        info.className = 'item-info';
                        const nameDiv = document.createElement('div');
                        nameDiv.className = 'item-name';
                        nameDiv.innerHTML = '<span class="seq">[' + (idx + 1) + ']</span>' + escapeHtml(item.dataKey);
                        const descDiv = document.createElement('div');
                        descDiv.className = 'item-desc';
                        descDiv.textContent = item.dataContent;
                        info.appendChild(nameDiv);
                        info.appendChild(descDiv);
                        const actions = document.createElement('div');
                        actions.className = 'item-actions';
                        const copyBtn = document.createElement('button');
                        copyBtn.className = 'item-btn copy'; copyBtn.textContent = '复制描述';
                        copyBtn.onclick = () => copyDesc(item.dataContent, copyBtn);
                        const editBtn = document.createElement('button');
                        editBtn.className = 'item-btn edit'; editBtn.textContent = '编辑';
                        editBtn.onclick = () => showEditItemModal(ti, ci, idx);
                        const delItemBtn = document.createElement('button');
                        delItemBtn.className = 'item-btn del'; delItemBtn.textContent = '删除';
                        delItemBtn.onclick = () => deleteItem(ti, ci, idx);
                        actions.appendChild(copyBtn);
                        actions.appendChild(editBtn);
                        actions.appendChild(delItemBtn);
                        row.appendChild(info);
                        row.appendChild(actions);
                        section.appendChild(row);
                    });
                    // 添加条目按钮
                    const addBtn = document.createElement('button');
                    addBtn.className = 'add-item-btn';
                    addBtn.textContent = '+ 添加条目';
                    addBtn.onclick = () => showAddItemModal(ti, ci);
                    section.appendChild(addBtn);
                    group.appendChild(section);
                });
                // 添加类别按钮
                const addCatBtn = document.createElement('button');
                addCatBtn.className = 'add-item-btn';
                addCatBtn.style.marginBottom = '10px';
                addCatBtn.textContent = '+ 添加类别';
                addCatBtn.onclick = () => showAddCatModal(ti);
                group.appendChild(addCatBtn);
                container.appendChild(group);
            });
        }
        function escapeHtml(str) {
            const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
        }
        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
            document.body.appendChild(ta);
            ta.focus(); ta.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch(e) {}
            document.body.removeChild(ta);
            return ok;
        }
        function copyDesc(desc, btn) {
            const activePrefix = prefixes.find(p => p.active);
            const prefix = activePrefix ? activePrefix.content : '';
            const text = prefix + desc;
            const onSuccess = () => {
                btn.textContent = '已复制 ✓'; btn.classList.add('copied');
                setTimeout(() => { btn.textContent = '复制描述'; btn.classList.remove('copied'); }, 1500);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(onSuccess).catch(() => {
                    if (fallbackCopy(text)) onSuccess(); else alert('复制失败，请手动复制');
                });
            } else {
                if (fallbackCopy(text)) onSuccess(); else alert('复制失败，请手动复制');
            }
        }

        // ========== 模态框 ==========
        function openModal(html) {
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modalOverlay').classList.add('active');
        }
        function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ========== 导入 JSON ==========
        function showImportModal() {
            openModal(
                '<h3>导入 JSON 数据</h3>' +
                '<label>粘贴 JSON 内容（将覆盖现有数据）：</label>' +
                '<textarea id="importJsonInput" rows="10" placeholder=\'[{"大类":"主题名","分类数据":[{"类别":"类别名","内容":[{"名称":"xxx","描述":"xxx"}]}]}]\'></textarea>' +
                '<div class="modal-actions">' +
                '<button class="modal-btn cancel" onclick="closeModal()">取消</button>' +
                '<button class="modal-btn confirm" id="importConfirmBtn" onclick="doImport()">开始导入</button>' +
                '</div>'
            );
        }
        async function doImport() {
            const input = document.getElementById('importJsonInput').value.trim();
            if (!input) { alert('请粘贴 JSON 内容'); return; }
            let jsonData;
            try { jsonData = JSON.parse(input); } catch (e) { alert('JSON 格式错误: ' + e.message); return; }
            if (!Array.isArray(jsonData)) jsonData = [jsonData];
            const btn = document.getElementById('importConfirmBtn');
            btn.disabled = true; btn.textContent = '导入中...';
            const progress = document.getElementById('importProgress');
            progress.classList.add('active');
            try {
                // 1. 保存结构
                const newStruct = jsonData.map(t => ({
                    大类: t['大类'] || '未命名',
                    类别: (t['分类数据'] || []).map(c => c['类别'] || '未命名')
                }));
                await GDA.saveOrUpdate(STRUCT_TYPE, STRUCT_TYPE, JSON.stringify(newStruct));
                // 2. 保存每条数据
                let total = 0, done = 0;
                newStruct.forEach(t => t.类别.forEach(c => { total++; }));
                for (let ti = 0; ti < jsonData.length; ti++) {
                    const theme = jsonData[ti];
                    const cats = theme['分类数据'] || [];
                    for (let ci = 0; ci < cats.length; ci++) {
                        const cat = cats[ci];
                        const dt = 'theme_' + newStruct[ti].大类 + '_' + newStruct[ti].类别[ci];
                        const items = cat['内容'] || [];
                        for (let ii = 0; ii < items.length; ii++) {
                            const item = items[ii];
                            await GDA.saveOrUpdate(dt, item['名称'] || ('item_' + ii), item['描述'] || '');
                        }
                        done++;
                        progress.textContent = '导入进度: ' + done + ' / ' + total + ' 个类别';
                    }
                }
                progress.textContent = '导入完成！';
                setTimeout(() => { progress.classList.remove('active'); progress.textContent = ''; }, 2000);
                closeModal();
                loadAllData();
            } catch (e) {
                alert('导入失败: ' + e.message);
                btn.disabled = false; btn.textContent = '开始导入';
            }
        }

        // ========== 新增大类 ==========
        function showAddThemeModal() {
            openModal(
                '<h3>新增大类主题</h3>' +
                '<label>主题名称：</label><input id="newThemeName" placeholder="例如：赛博主题">' +
                '<label>首个类别名称（可选）：</label><input id="newThemeFirstCat" placeholder="例如：自然风光">' +
                '<div class="modal-actions">' +
                '<button class="modal-btn cancel" onclick="closeModal()">取消</button>' +
                '<button class="modal-btn confirm" onclick="doAddTheme()">确定</button>' +
                '</div>'
            );
        }
        async function doAddTheme() {
            const name = document.getElementById('newThemeName').value.trim();
            if (!name) { alert('请输入主题名称'); return; }
            const firstCat = document.getElementById('newThemeFirstCat').value.trim();
            const exists = themeStructure.find(t => t.大类 === name);
            if (exists) { alert('该主题已存在'); return; }
            const newTheme = { 大类: name, 类别: firstCat ? [firstCat] : [] };
            themeStructure.push(newTheme);
            if (firstCat) themeItems[name + '|' + firstCat] = [];
            await GDA.saveOrUpdate(STRUCT_TYPE, STRUCT_TYPE, JSON.stringify(themeStructure));
            closeModal(); renderAll();
        }

        // ========== 新增类别 ==========
        function showAddCatModal(themeIdx) {
            const theme = themeStructure[themeIdx];
            openModal(
                '<h3>在「' + escapeHtml(theme.大类) + '」下新增类别</h3>' +
                '<label>类别名称：</label><input id="newCatName" placeholder="例如：星空宇宙">' +
                '<div class="modal-actions">' +
                '<button class="modal-btn cancel" onclick="closeModal()">取消</button>' +
                '<button class="modal-btn confirm" onclick="doAddCategory(' + themeIdx + ')">确定</button>' +
                '</div>'
            );
        }
        async function doAddCategory(themeIdx) {
            const name = document.getElementById('newCatName').value.trim();
            if (!name) { alert('请输入类别名称'); return; }
            const theme = themeStructure[themeIdx];
            if (theme.类别.includes(name)) { alert('该类别已存在'); return; }
            theme.类别.push(name);
            themeItems[theme.大类 + '|' + name] = [];
            await GDA.saveOrUpdate(STRUCT_TYPE, STRUCT_TYPE, JSON.stringify(themeStructure));
            closeModal(); renderAll();
        }

        // ========== 新增条目 ==========
        function showAddItemModal(themeIdx, catIdx) {
            const theme = themeStructure[themeIdx];
            const catName = theme.类别[catIdx];
            openModal(
                '<h3>在「' + escapeHtml(catName) + '」下添加条目</h3>' +
                '<label>名称：</label><input id="newItemName" placeholder="条目名称">' +
                '<label>描述：</label><textarea id="newItemDesc" rows="5" placeholder="条目描述内容"></textarea>' +
                '<div class="modal-actions">' +
                '<button class="modal-btn cancel" onclick="closeModal()">取消</button>' +
                '<button class="modal-btn confirm" onclick="doAddItem(' + themeIdx + ',' + catIdx + ')">确定</button>' +
                '</div>'
            );
        }
        async function doAddItem(themeIdx, catIdx) {
            const name = document.getElementById('newItemName').value.trim();
            const desc = document.getElementById('newItemDesc').value.trim();
            if (!name) { alert('请输入名称'); return; }
            const theme = themeStructure[themeIdx];
            const catName = theme.类别[catIdx];
            const dt = 'theme_' + theme.大类 + '_' + catName;
            const res = await GDA.save({ dataType: dt, dataKey: name, dataContent: desc });
            const key = theme.大类 + '|' + catName;
            themeItems[key].push({ id: res.data ? res.data.id : null, dataKey: name, dataContent: desc });
            closeModal(); renderAll();
        }

        // ========== 编辑条目 ==========
        function showEditItemModal(themeIdx, catIdx, itemIdx) {
            const theme = themeStructure[themeIdx];
            const catName = theme.类别[catIdx];
            const key = theme.大类 + '|' + catName;
            const item = themeItems[key][itemIdx];
            openModal(
                '<h3>编辑条目</h3>' +
                '<label>名称：</label><input id="editItemName" value="' + escapeHtml(item.dataKey) + '">' +
                '<label>描述：</label><textarea id="editItemDesc" rows="6">' + escapeHtml(item.dataContent) + '</textarea>' +
                '<div class="modal-actions">' +
                '<button class="modal-btn cancel" onclick="closeModal()">取消</button>' +
                '<button class="modal-btn confirm" id="editConfirmBtn" onclick="doEditItem(' + themeIdx + ',' + catIdx + ',' + itemIdx + ')">保存</button>' +
                '</div>'
            );
        }
        async function doEditItem(themeIdx, catIdx, itemIdx) {
            const theme = themeStructure[themeIdx];
            const catName = theme.类别[catIdx];
            const key = theme.大类 + '|' + catName;
            const item = themeItems[key][itemIdx];
            const newName = document.getElementById('editItemName').value.trim();
            const newDesc = document.getElementById('editItemDesc').value.trim();
            if (!newName) { alert('名称不能为空'); return; }
            const btn = document.getElementById('editConfirmBtn');
            btn.disabled = true; btn.textContent = '保存中...';
            const dt = 'theme_' + theme.大类 + '_' + catName;
            try {
                // 如果名称变了，需要检查新名称是否冲突
                if (newName !== item.dataKey) {
                    const checkList = await GDA.getByType(dt);
                    const dup = checkList.find(d => d.dataKey === newName);
                    if (dup) { alert('该名称已存在'); btn.disabled = false; btn.textContent = '保存'; return; }
                }
                if (item.id) {
                    await GDA.update(item.id, { dataContent: newDesc, dataKey: newName });
                } else {
                    await GDA.saveOrUpdate(dt, newName, newDesc);
                }
                item.dataKey = newName;
                item.dataContent = newDesc;
                closeModal(); renderAll();
            } catch (e) { alert('保存失败: ' + e.message); btn.disabled = false; btn.textContent = '保存'; }
        }

        // ========== 删除 ==========
        async function deleteItem(themeIdx, catIdx, itemIdx) {
            const theme = themeStructure[themeIdx];
            const catName = theme.类别[catIdx];
            const key = theme.大类 + '|' + catName;
            const item = themeItems[key][itemIdx];
            if (!confirm('确定删除「' + item.dataKey + '」？')) return;
            if (item.id) await GDA.remove(item.id);
            themeItems[key].splice(itemIdx, 1);
            renderAll();
        }
        async function deleteCategory(themeIdx, catIdx) {
            const theme = themeStructure[themeIdx];
            const catName = theme.类别[catIdx];
            if (!confirm('确定删除类别「' + catName + '」及其所有条目？')) return;
            // 删除该类别下所有条目
            const key = theme.大类 + '|' + catName;
            const items = themeItems[key] || [];
            for (const item of items) {
                if (item.id) await GDA.remove(item.id).catch(() => {});
            }
            theme.类别.splice(catIdx, 1);
            delete themeItems[key];
            await GDA.saveOrUpdate(STRUCT_TYPE, STRUCT_TYPE, JSON.stringify(themeStructure));
            renderAll();
        }
        async function deleteTheme(themeIdx) {
            const theme = themeStructure[themeIdx];
            if (!confirm('确定删除整个主题「' + theme.大类 + '」及其所有数据？')) return;
            // 删除所有类别下的所有条目
            for (const catName of theme.类别) {
                const key = theme.大类 + '|' + catName;
                const items = themeItems[key] || [];
                for (const item of items) {
                    if (item.id) await GDA.remove(item.id).catch(() => {});
                }
                delete themeItems[key];
            }
            themeStructure.splice(themeIdx, 1);
            await GDA.saveOrUpdate(STRUCT_TYPE, STRUCT_TYPE, JSON.stringify(themeStructure));
            renderAll();
        }

        // ========== 初始化 ==========
        loadPrefixes();
        loadAllData();
    </script>
</body>
</html>
