<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme 数据展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #c084fc;
            margin-bottom: 8px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .theme-group {
            margin-bottom: 40px;
        }
        .theme-title {
            text-align: center;
            color: #c084fc;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1f3056;
        }
        .category {
            margin-bottom: 30px;
            column-count: 2;
            column-gap: 16px;
        }
        .category-title {
            column-span: all;
            font-size: 20px;
            color: #a78bfa;
            border-left: 4px solid #7c3aed;
            padding-left: 12px;
            margin-bottom: 14px;
        }
        .item {
            background: #16213e;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            border: 1px solid #1f3056;
            transition: border-color .2s;
            break-inside: avoid;
        }
        .item:hover { border-color: #7c3aed; }
        .item-info { flex: 1; min-width: 0; }
        .item-name {
            font-size: 16px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 6px;
        }
        .item-name .seq {
            color: #64748b;
            font-weight: 400;
            margin-right: 6px;
        }
        .item-desc {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            word-break: break-all;
        }
        .copy-btn {
            flex-shrink: 0;
            align-self: center;
            padding: 6px 14px;
            background: #7c3aed;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            transition: background .2s;
        }
        .copy-btn:hover { background: #6d28d9; }
        .copy-btn.copied { background: #22c55e; }
        .prefix-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 90%;
            margin: 0 auto 24px;
        }
        .prefix-bar label {
            font-size: 14px;
            color: #a78bfa;
            white-space: nowrap;
        }
        .prefix-bar input {
            flex: 1;
            padding: 8px 12px;
            background: #16213e;
            border: 1px solid #1f3056;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 14px;
            outline: none;
            transition: border-color .2s;
        }
        .prefix-bar input:focus { border-color: #7c3aed; }
        .prefix-bar input::placeholder { color: #4a5568; }
        @media (max-width: 768px) {
            .category { column-count: 1; }
        }
        #loading {
            text-align: center;
            color: #888;
            padding: 60px 0;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Theme 数据展示</h1>
    <p class="subtitle">点击右侧按钮复制描述内容</p>
    <div class="prefix-bar">
        <label for="prefixInput">内容前缀：</label>
        <input type="textarea" rows="5" id="prefixInput" placeholder="输入前缀，复制时将自动拼接到描述前面">
    </div>
    <div id="container"><div id="loading">正在加载 theme.json ...</div></div>

    <script>
        const PREFIX_KEY = 'themeViewer_prefix';
        const prefixInput = document.getElementById('prefixInput');
        prefixInput.value = localStorage.getItem(PREFIX_KEY) || '';
        prefixInput.addEventListener('input', function () {
            localStorage.setItem(PREFIX_KEY, this.value);
        });

        function render(dataList) {
            const container = document.getElementById('container');
            container.innerHTML = '';

            if (!Array.isArray(dataList)) dataList = [dataList];

            dataList.forEach(theme => {
                const themeGroup = document.createElement('div');
                themeGroup.className = 'theme-group';

                const themeTitle = document.createElement('div');
                themeTitle.className = 'theme-title';
                themeTitle.textContent = theme['大类'] || '未命名主题';
                themeGroup.appendChild(themeTitle);

                (theme['分类数据'] || []).forEach(cat => {
                    const section = document.createElement('div');
                    section.className = 'category';

                    const title = document.createElement('div');
                    title.className = 'category-title';
                    title.textContent = cat['类别'];
                    section.appendChild(title);

                    (cat['内容'] || []).forEach((item, idx) => {
                        const row = document.createElement('div');
                        row.className = 'item';

                        const info = document.createElement('div');
                        info.className = 'item-info';

                        const nameDiv = document.createElement('div');
                        nameDiv.className = 'item-name';
                        nameDiv.innerHTML = '<span class="seq">[' + (idx + 1) + ']</span>' + item['名称'];

                        const descDiv = document.createElement('div');
                        descDiv.className = 'item-desc';
                        descDiv.textContent = item['描述'];

                        info.appendChild(nameDiv);
                        info.appendChild(descDiv);

                        const btn = document.createElement('button');
                        btn.className = 'copy-btn';
                        btn.textContent = '复制描述';
                        btn.onclick = function () {
                            const prefix = document.getElementById('prefixInput').value;
                            const text = prefix + item['描述'];
                            navigator.clipboard.writeText(text).then(() => {
                                btn.textContent = '已复制 ✓';
                                btn.classList.add('copied');
                                setTimeout(() => {
                                    btn.textContent = '复制描述';
                                    btn.classList.remove('copied');
                                }, 1500);
                            });
                        };

                        row.appendChild(info);
                        row.appendChild(btn);
                        section.appendChild(row);
                    });

                    themeGroup.appendChild(section);
                });

                container.appendChild(themeGroup);
            });
        }

        fetch('Json/theme.json')
            .then(r => r.json())
            .then(render)
            .catch(e => {
                document.getElementById('container').innerHTML =
                    '<div id="loading" style="color:#f87171;">加载失败: ' + e.message + '</div>';
            });
    </script>
</body>
</html>
